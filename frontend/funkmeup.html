<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    fetch('/api/check', {credentials:'include'})
      .then(r => r.ok ? null : (location.href='/login'))
      .catch(() => location.href='/login');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funk Me Up · funkyiq</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base:       #07090f;
      --bg-card:       #0e1220;
      --bg-elevated:   #1a2035;
      --border:        #1e2840;
      --gold:          #e8a020;
      --purple:        #a855f7;
      --purple-bright: #c084fc;
      --green:         #22c55e;
      --green-bright:  #4ade80;
      --blue:          #60a5fa;
      --teal-bright:   #5eead4;
      --amber:         #f59e0b;
      --red:           #f87171;
      --text:          #e6e9f0;
      --text-dim:      #8a93a8;
      --text-muted:    #5c6478;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text);
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(180deg, #0a0d18 0%, rgba(10,13,24,0.92) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
      padding-top: calc(14px + env(safe-area-inset-top));
    }
    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: 0.5px;
      margin: 0;
      color: var(--text);
    }
    .title .funk { color: var(--purple-bright); }
    .subtitle {
      color: var(--text-dim);
      font-size: 12px;
      margin-top: 2px;
    }
    .nav-back {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg-card);
    }
    .nav-back + .nav-back { margin-left: 6px; }

    /* Exposure summary */
    .exposure-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .exposure-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
    }
    .exposure-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 20px;
      font-variant-numeric: tabular-nums;
    }
    .exposure-num.pos { color: var(--green-bright); }
    .exposure-num.neg { color: var(--red); }
    .exposure-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Body */
    main { padding: 14px 16px 24px; max-width: 720px; margin: 0 auto; }

    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin: 18px 0 8px;
    }

    /* Play card */
    .play {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      position: relative;
    }
    .play.hero {
      border-color: var(--purple);
      box-shadow: 0 0 0 1px var(--purple), 0 0 24px rgba(168,85,247,0.18);
    }
    .play-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .play-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      font-weight: 800;
      margin: 0;
      letter-spacing: 0.5px;
    }
    .play-title .emoji { margin-right: 6px; }
    .play-subtitle {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 3px;
    }
    .hero-tag {
      position: absolute;
      top: -8px;
      left: 12px;
      background: var(--purple);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .confidence {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 13px;
      flex-shrink: 0;
      border: 1.5px solid;
    }
    .confidence.A { color: var(--green-bright); border-color: var(--green); background: rgba(34,197,94,0.12); }
    .confidence.B { color: var(--amber); border-color: var(--amber); background: rgba(245,158,11,0.12); }
    .confidence.C { color: var(--red); border-color: var(--red); background: rgba(248,113,113,0.12); }

    .play-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .sharp-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(168,85,247,0.14);
      border: 1px solid rgba(168,85,247,0.4);
      color: var(--purple-bright);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }
    /* Tier badges — preview of paid tier structure (no gating yet). */
    .tier-badge {
      display: inline-flex; align-items: center;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: 999px;
      vertical-align: middle;
      margin-left: 10px;
    }
    .tier-badge.tier-edge {
      background: rgba(34, 197, 94, 0.14);
      color: var(--green-bright);
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .tier-badge.tier-pro {
      background: rgba(59, 130, 246, 0.14);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }
    .tier-badge.tier-labs {
      background: rgba(16, 185, 129, 0.14);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.45);
    }
    .tier-marker {
      display: inline-block;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.12em;
      padding: 1px 5px;
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .tier-marker.tier-labs {
      background: rgba(16, 185, 129, 0.22);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.45);
    }

    /* Prescriptive action block — the 'do this exact bet' instruction */
    .action-block {
      margin: 10px 0;
      padding: 10px 12px;
      background: rgba(168,85,247,0.08);
      border: 1px solid rgba(168,85,247,0.35);
      border-left: 4px solid var(--purple);
      border-radius: 8px;
    }
    .action-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .action-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--purple);
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 13px;
      flex-shrink: 0;
    }
    .action-verb {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--purple-bright);
    }
    .action-product {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .action-path {
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'Outfit', sans-serif;
      line-height: 1.45;
      margin-bottom: 5px;
    }
    .action-return {
      font-size: 11px;
      font-weight: 600;
    }
    .action-return.pos { color: var(--green-bright); }
    .action-return.neg { color: var(--red); }

    /* Legs / picks list */
    .legs {
      margin: 10px 0 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .leg {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg-elevated);
      border-radius: 8px;
      font-size: 13px;
    }
    .leg-meta { color: var(--text-dim); font-size: 11px; }
    .leg-horse { font-weight: 600; }
    .leg-odds {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .leg-picks {
      font-size: 12px;
      color: var(--text);
      line-height: 1.5;
    }

    /* Stats grid */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--bg-elevated);
      border-radius: 10px;
      padding: 10px 6px;
      margin-top: 4px;
    }
    .stat {
      text-align: center;
      border-right: 1px solid var(--border);
    }
    .stat:last-child { border-right: 0; }
    .stat-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 18px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat-num.pos { color: var(--green-bright); }
    .stat-num.neg { color: var(--red); }
    .stat-num.purple { color: var(--purple-bright); }
    .stat-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .play-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .play-foot button {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .play-foot button:hover { border-color: var(--purple); color: var(--purple-bright); }
    .past-stat {
      font-size: 11px;
      color: var(--text-dim);
    }
    .past-stat.pos { color: var(--green); }
    .past-stat.neg { color: var(--red); }

    /* Empty / disclaimers */
    .empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
    }
    .disclaimer {
      margin-top: 16px;
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold);
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-dim);
    }
    .responsible {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Yesterday / Today / Tomorrow tab strip */
    .day-tabs {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .day-tab {
      flex: 1;
      padding: 8px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .day-tab.active {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff;
    }

    /* Outcome banner for past-date plays */
    .outcome-banner {
      margin: 8px 0 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .outcome-banner.won {
      background: rgba(34,197,94,0.15);
      border: 1px solid var(--green);
      color: var(--green-bright);
    }
    .outcome-banner.lost {
      background: rgba(248,113,113,0.10);
      border: 1px solid rgba(248,113,113,0.4);
      color: var(--red);
    }
    .outcome-banner.no_result {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .outcome-profit {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 16px;
    }

    /* Toast for clipboard */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-elevated);
      border: 1px solid var(--purple);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      z-index: 100;
      animation: toast-in 0.2s ease-out;
    }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

    /* Cross-page nav strip — same on every page. */
    .page-nav {
      display: flex; justify-content: center; align-items: center;
      gap: 6px; padding: 10px 12px; flex-wrap: wrap;
      background: rgba(10,10,15,0.85);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .page-nav-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 12px; border-radius: 6px;
      font-size: 12px; font-weight: 700; letter-spacing: 0.03em;
      text-decoration: none; color: #9ca3af; white-space: nowrap;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.10);
      transition: all 0.15s ease;
    }
    .page-nav-btn:hover { background: rgba(255,255,255,0.07); color: #fff; }
    .page-nav-btn.edge.active { background: rgba(34,197,94,0.15);  color: #4ade80; border-color: rgba(34,197,94,0.45); }
    .page-nav-btn.hot.active  { background: rgba(249,115,22,0.15); color: #fb923c; border-color: rgba(249,115,22,0.45); }
    .page-nav-btn.funk.active { background: rgba(192,132,252,0.15);color: #c084fc; border-color: rgba(192,132,252,0.45); }
    .page-nav-btn.labs.active   { background: rgba(16,185,129,0.15); color: #34d399; border-color: rgba(16,185,129,0.45); }
    .page-nav-btn.lounge.active { background: rgba(245,200,66,0.16); color: #f5c842; border-color: rgba(245,200,66,0.45); }
    .page-nav-btn.about { font-size: 11px; padding: 6px 9px; color: #6b7280; }
    .page-nav-btn.about:hover { color: #d1d5db; }
    .page-nav-btn.admin { font-size: 11px; padding: 6px 9px; color: #6b7280; }
    .page-nav-btn.admin:hover { color: #d1d5db; }
    /* Spacer is a no-op now — nav buttons centre as one group on every breakpoint. */
    .nav-spacer { display: none; }

    /* Unified brand strip — same on every page, sits above the .page-nav button row. */
    .brand-bar {
      display: flex; align-items: center; justify-content: center;
      gap: 14px; padding: 14px 16px 8px; flex-wrap: wrap;
    }
    .brand-bar-logo {
      display: inline-flex; align-items: center; gap: 8px;
      color: #f5c842; text-decoration: none;
      font-weight: 800; font-size: 17px; letter-spacing: 0.02em;
    }
    .brand-bar-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #f5c842;
    }
    .brand-bar-subtitle {
      color: #9ca3af; font-size: 12px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    /* Mobile: bottom-fixed nav, NRL-style */
    @media (max-width: 760px) {
      .page-nav {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        top: auto;
        background: rgba(10,10,15,0.96);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border-top: 1px solid rgba(255,255,255,0.12);
        border-bottom: none;
        padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
        gap: 2px;
        z-index: 100;
        box-shadow: 0 -4px 16px rgba(0,0,0,0.5);
        justify-content: space-around;
      }
      .nav-spacer { display: none; }
      .page-nav-btn {
        flex: 1; min-width: 0;
        padding: 8px 3px 6px;
        flex-direction: column;
        gap: 3px;
        letter-spacing: 0.02em;
        text-align: center;
        background: transparent;
        border: none;
        border-radius: 6px;
        color: #6b7280;
        justify-content: center;
        white-space: nowrap;
        overflow: hidden;
      }
      .page-nav-btn .nav-ico { font-size: 22px; line-height: 1; }
      .page-nav-btn .nav-lab { font-size: 10px; font-weight: 700; line-height: 1; letter-spacing: 0.04em; }
      .page-nav-btn.about, .page-nav-btn.admin {
        padding: 8px 3px 6px;
        flex: 0 0 auto;
        min-width: 52px;
      }
      .page-nav-btn.about .nav-ico,
      .page-nav-btn.admin .nav-ico { font-size: 18px; }
      .page-nav-btn.about .nav-lab,
      .page-nav-btn.admin .nav-lab { font-size: 9.5px; }
      body { padding-bottom: 86px; }
    }

    /* Unified page header — same on every page. */
    .page-header {
      position: static;
      top: auto;
      z-index: auto;
      background: transparent;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      text-align: center;
      padding: 26px 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 16px;
    }
    .page-header::after {
      content: '';
      display: block;
      width: 80px; height: 3px;
      background: var(--page-accent, #9ca3af);
      border-radius: 2px;
      margin: 14px auto -19px;
    }
    .page-header.lounge { --page-accent: #f5c842; }
    .page-header.edge   { --page-accent: #4ade80; }
    .page-header.hot    { --page-accent: #fb923c; }
    .page-header.funk   { --page-accent: #c084fc; }
    .page-header.labs   { --page-accent: #10b981; }
    .page-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 36px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.5px;
      margin: 0 0 8px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .page-subtitle {
      font-size: 13px;
      color: #9ca3af;
      margin: 0 auto;
      max-width: 600px;
      line-height: 1.4;
    }
    @media (max-width: 600px) {
      .page-title { font-size: 28px; }
    }
  </style>
  <script src="/site-warnings.js" defer></script>
</head>
<body>
  <div class="brand-bar">
    <a href="https://funkyiq.com" class="brand-bar-logo">
      <span class="brand-bar-dot"></span>
      FunkyIQ
    </a>
    <span class="brand-bar-subtitle">Horse Racing</span>
  </div>
  <nav class="page-nav">
    <a href="/"           class="page-nav-btn lounge"><span class="nav-ico">🛋️</span><span class="nav-lab">Lounge</span></a>
    <a href="/edge"       class="page-nav-btn edge"><span class="nav-ico">🎯</span><span class="nav-lab">Edge</span></a>
    <a href="/hotseat"    class="page-nav-btn hot"><span class="nav-ico">🔥</span><span class="nav-lab">Hot Seat</span></a>
    <a href="/funk-me-up" class="page-nav-btn funk active"><span class="nav-ico">🎺</span><span class="nav-lab">Funk Me Up</span></a>
    <a href="/lab"        class="page-nav-btn labs"><span class="nav-ico">🧪</span><span class="nav-lab">Labs</span></a>
    <span class="nav-spacer"></span>
    <a href="/account"    class="page-nav-btn about"><span class="nav-ico">👤</span><span class="nav-lab">Account</span></a>
    <a href="/about"      class="page-nav-btn about"><span class="nav-ico">ℹ️</span><span class="nav-lab">About</span></a>
  </nav>
  <header class="page-header funk">
    <h1 class="page-title">🎺 Funk Me Up <span class="tier-badge tier-pro">Pro</span></h1>
    <p class="page-subtitle" id="pageSubtitle">Today's lower-variance playbook · 🎯 Sharp picks · $10 base stake</p>
  </header>
  <header>
    <div class="day-tabs">
      <button class="day-tab" data-day="yesterday">Yesterday</button>
      <button class="day-tab active" data-day="today">Today</button>
    </div>
    <div id="exposure" class="exposure-row" style="display:none;">
      <div class="exposure-card">
        <div class="exposure-num" id="cashExp">—</div>
        <div class="exposure-label" id="cashExpLabel">Cash exposure</div>
      </div>
      <div class="exposure-card">
        <div class="exposure-num" id="bonusExp">—</div>
        <div class="exposure-label">Bonus credit</div>
      </div>
      <div class="exposure-card">
        <div class="exposure-num" id="expEv">—</div>
        <div class="exposure-label" id="expEvLabel">Est. profit</div>
      </div>
    </div>
  </header>

  <main id="root">
    <div class="empty">Loading today's playbook…</div>
  </main>

<script>
  const API = 'https://web-production-dec62.up.railway.app';

  const KIND_META = {
    lock:          { emoji: '💪' },
    bonus:         { emoji: '⭐' },
    double:        { emoji: '🪜' },
    banker:        { emoji: '🏦' },
    quaddie:       { emoji: '🎰' },
    combo_doubles: { emoji: '🧩' },
    twofunk:       { emoji: '🪩' },
    lab:           { emoji: '🧪' },
    // Legacy kinds kept so historical (yesterday) data still renders
    spine:   { emoji: '🎯' },
    wave:    { emoji: '🌊' },
  };

  function escHtml(s) {
    return (s == null ? '' : String(s))
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fmtMoney(n) {
    if (n == null) return '—';
    const sign = n < 0 ? '-' : '+';
    return `${n >= 0 ? '+' : '-'}$${Math.abs(n).toFixed(2)}`;
  }

  function fmtMoneyPlain(n) {
    if (n == null) return '—';
    return `$${n.toFixed(2)}`;
  }

  function fmtPct(p) {
    if (p == null) return '—';
    const pct = p * 100;
    // Auto-precision: integer for ≥10%, 1 decimal for 1-10%, 2 decimals
    // for <1%. Without this, small multi-bet probabilities like 0.23%
    // would round to "0%" and the card looks broken.
    if (pct >= 10) return `${Math.round(pct)}%`;
    if (pct >= 1)  return `${pct.toFixed(1)}%`;
    if (pct > 0)   return `${pct.toFixed(2)}%`;
    return '0%';
  }

  function fmtJump(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: false });
  }

  // Display-only aliases. Slug stays the same in the API; only renders change.
  const VENUE_DISPLAY_ALIAS = {
    'pioneer-park': 'Alice Springs (Pioneer Park)',
  };
  function venueLabel(v) {
    const key = (v || '').toLowerCase();
    return (VENUE_DISPLAY_ALIAS[key] || (v || '').replace(/-/g, ' ')).toUpperCase();
  }

  function copyPlan(text) {
    if (!navigator.clipboard) return;
    navigator.clipboard.writeText(text).then(() => {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = 'Plan copied to clipboard';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 1800);
    });
  }

  function playToText(p) {
    const parts = [`[${p.title}] ${p.subtitle || ''}`];
    if (p.kind === 'spine' && p.legs) {
      p.legs.forEach((l, i) => {
        parts.push(`  ${i+1}. ${venueLabel(l.venue)} R${l.race_number} · ${l.horse_name} · Top 4`);
      });
      parts.push(`  Multi ~$${p.boosted_multi_odds} (boosted) · stake $${p.stake_dollars}`);
    } else if (p.kind === 'lock' || p.kind === 'bonus') {
      parts.push(`  ${venueLabel(p.venue)} R${p.race_number} · ${p.horse_name} · $${p.best_available_odds}`);
      const stk = p.kind === 'bonus' ? `bonus $${p.bonus_stake_dollars}` : `stake $${p.stake_dollars}`;
      parts.push(`  ${stk} · model ${p.model_pct}% · edge +${p.edge_pct}pts`);
    } else if (p.kind === 'wave' && p.legs) {
      parts.push(`  Venue: ${venueLabel(p.venue)}`);
      p.legs.forEach((l) => {
        const names = (l.picks || []).map(x => x.horse_name).join(' / ');
        parts.push(`  R${l.race_number}: ${names}`);
      });
      parts.push(`  Quaddie 16-perm box · stake $${p.stake_dollars}`);
    } else if (p.kind === 'lab') {
      parts.push(`  ${venueLabel(p.venue)} R${p.race_number} · Trio box`);
      parts.push(`  Box: ${(p.box_horse_names || []).join(' / ')}`);
      parts.push(`  Stake $${p.stake_dollars} · top-3 sum ${p.top3_sum_pct}% · ${p.field_size}-horse field`);
    } else if (p.kind === 'double' && p.legs) {
      p.legs.forEach((l, i) => {
        parts.push(`  ${i+1}. ${venueLabel(l.venue)} R${l.race_number} · ${l.horse_name} · Place`);
      });
      parts.push(`  Place Multi ~$${p.raw_multi_odds} · stake $${p.stake_dollars}`);
    } else if (p.kind === 'combo_doubles' && p.legs) {
      p.legs.forEach((l, i) => {
        parts.push(`  ${i+1}. ${venueLabel(l.venue)} R${l.race_number} · ${l.horse_name} · $${l.best_available_odds ? l.best_available_odds.toFixed(2) : 'TBA'}`);
      });
      parts.push(`  Combo Doubles · 6 pairs × $${p.unit_stake_dollars} = $${p.stake_dollars} total`);
      parts.push(`  ≥1 pair hits ${((p.prob_at_least_1_win || 0)*100).toFixed(1)}% · ≥2 legs ${((p.prob_at_least_2_wins || 0)*100).toFixed(1)}%`);
    } else if (p.kind === 'quaddie' && p.legs) {
      parts.push(`  Venue: ${venueLabel(p.venue)}`);
      p.legs.forEach((l, i) => {
        const second = l.second_horse_name
          ? ` (+ ${l.second_horse_name} ${l.second_model_pct}% for box)`
          : '';
        parts.push(`  Leg ${i+1} (R${l.race_number}): ${l.horse_name} · win ${l.model_pct}%${second}`);
      });
      parts.push(`  Straight: stake $${p.stake_dollars} · hit ${(p.model_hit_probability*100).toFixed(2)}%`);
      if (p.boxed_available) {
        parts.push(`  Boxed (${p.boxed_perms} perms): stake $${p.boxed_stake_dollars} · hit ${(p.boxed_hit_probability*100).toFixed(2)}%`);
      }
    } else if (p.kind === 'twofunk') {
      parts.push(`  ${venueLabel(p.venue)} R${p.race_number} · Quinella`);
      parts.push(`  ${p.horse_name} ($${p.leg1_odds}) + ${p.partner_horse_name} ($${p.partner_odds})`);
      parts.push(`  stake $${p.stake_dollars} · top-2 sum ${p.top2_win_sum_pct}% · gap to rk3 ${p.rank2_rank3_gap_pct}pt`);
    } else if (p.kind === 'banker') {
      parts.push(`  ${venueLabel(p.venue)} R${p.race_number} · ${p.horse_name} · Place ~$${p.place_odds_est}`);
      parts.push(`  stake $${p.stake_dollars} · model place ${Math.round(p.place_prob*100)}%`);
    }
    return parts.join('\n');
  }

  // Earliest jump time across a play's legs/races — used to sort plays
  // by what to place first.
  function _earliestMs(p) {
    let best = Infinity;
    const ts = [];
    if ((p.kind === 'spine' || p.kind === 'wave' || p.kind === 'double' || p.kind === 'quaddie' || p.kind === 'combo_doubles') && p.legs) {
      p.legs.forEach(l => l.scheduled_time && ts.push(l.scheduled_time));
    } else if (p.scheduled_time) {
      ts.push(p.scheduled_time);
    }
    for (const t of ts) {
      const ms = new Date(t).getTime();
      if (!isNaN(ms) && ms < best) best = ms;
    }
    return best;
  }

  // Action verb + product name + path to find on Sportsbet for each play.
  function buildAction(p) {
    if (p.kind === 'lock') {
      return {
        verb: 'PLACE THIS WIN BET',
        product: `$${p.stake_dollars.toFixed(0)} Win on ${p.horse_name}`,
        path: `Sportsbet → Racing → ${venueLabel(p.venue)} → R${p.race_number} → Win`,
        returnIf: `Returns ${fmtMoneyPlain(p.potential_return_dollars)} if it wins`,
      };
    }
    if (p.kind === 'bonus') {
      return {
        verb: 'USE YOUR BONUS BET',
        product: `$${p.bonus_stake_dollars.toFixed(0)} Bonus Bet on ${p.horse_name}`,
        path: `Sportsbet → Racing → ${venueLabel(p.venue)} → R${p.race_number} → Win → use Bonus Bet`,
        returnIf: `Returns ${fmtMoneyPlain(p.potential_return_dollars)} profit if it wins (stake not returned)`,
      };
    }
    if (p.kind === 'spine') {
      return {
        verb: 'BUILD THIS 4-LEG MULTI',
        product: `$${p.stake_dollars.toFixed(0)} Racing Multi · 4 × Top 4`,
        path: `Sportsbet → Multi Builder → tap Top 4 for each horse below → confirm +20% boost shows in betslip`,
        returnIf: `Returns ${fmtMoneyPlain(p.potential_return_dollars)} if all 4 land`,
      };
    }
    if (p.kind === 'wave') {
      return {
        verb: 'PLACE THIS QUADDIE BOX',
        product: `$${p.stake_dollars.toFixed(0)} Quaddie · 2×2×2×2 box (${p.perms} combos)`,
        path: `Sportsbet → Racing → ${venueLabel(p.venue)} → Quaddie → box the 2 horses per leg below`,
        returnIf: `Est. ${fmtMoneyPlain(p.potential_return_dollars)} share of the pool if all 4 winners come from your picks`,
      };
    }
    if (p.kind === 'lab') {
      const names = (p.box_horse_names || []).join(', ');
      return {
        verb: 'PLACE THIS TRIFECTA BOX',
        product: `$${p.stake_dollars.toFixed(0)} Flexi Trifecta Box (3 horses · ${p.perms} perms)`,
        path: `Sportsbet → Racing → ${venueLabel(p.venue)} → R${p.race_number} → Exotics → Trifecta → Box ${names}`,
        returnIf: `Est. ${fmtMoneyPlain(p.potential_return_dollars)} if any order of these 3 fills the trifecta`,
      };
    }
    if (p.kind === 'double') {
      return {
        verb: 'BUILD THIS PLACE MULTI',
        product: `$${p.stake_dollars.toFixed(0)} 2-leg Place Multi`,
        path: `Sportsbet → Multi Builder → tap Place for each horse below → confirm 2 legs in betslip`,
        returnIf: `Returns ${fmtMoneyPlain(p.potential_return_dollars)} if both horses place (top 3)`,
      };
    }
    if (p.kind === 'combo_doubles') {
      return {
        verb: 'PLACE THIS COMBO DOUBLES',
        product: `$${p.stake_dollars} total · $${p.unit_stake_dollars}/pair × 6 doubles`,
        path: `Sportsbet → Multi Builder → add all 4 horses below (one per race) → set to "Combo Multi Doubles" → confirm 6 doubles at $${p.unit_stake_dollars} each`,
        returnIf: `${((p.prob_at_least_2_wins || 0)*100).toFixed(1)}% chance of a paying double (any 2 of 4 legs win)`,
      };
    }
    if (p.kind === 'quaddie') {
      const product = p.boxed_available
        ? `$${p.stake_dollars.toFixed(0)} straight · OR $${p.boxed_stake_dollars} boxed (${p.boxed_perms} perms)`
        : `$${p.stake_dollars.toFixed(0)} Quaddie · 1 horse × 4 legs`;
      const path = p.boxed_available
        ? `Sportsbet → Racing → ${venueLabel(p.venue)} → Quaddie → pick rank-1 only (straight) OR rank-1 + rank-2 in every leg (boxed)`
        : `Sportsbet → Racing → ${venueLabel(p.venue)} → Quaddie → pick the rank-1 horse for each leg below`;
      const ret = p.boxed_available
        ? `Straight hit prob ${(p.model_hit_probability*100).toFixed(2)}% · boxed ${(p.boxed_hit_probability*100).toFixed(2)}%`
        : (p.raw_multi_odds
            ? `Est. ${fmtMoneyPlain(p.potential_return_dollars)} fair return if all 4 land`
            : `4-leg quaddie — odds finalise closer to jump`);
      return {
        verb: 'PLACE THIS EARLY QUADDIE',
        product,
        path,
        returnIf: ret,
      };
    }
    if (p.kind === 'banker') {
      return {
        verb: 'PLACE THIS PLACE BET',
        product: `$${p.stake_dollars.toFixed(0)} Place on ${p.horse_name}`,
        path: `Sportsbet → Racing → ${venueLabel(p.venue)} → R${p.race_number} → Place`,
        returnIf: `Returns ~${fmtMoneyPlain(p.potential_return_dollars)} if it finishes top 3`,
      };
    }
    if (p.kind === 'twofunk') {
      const ret = p.potential_return_dollars
        ? `Est. ${fmtMoneyPlain(p.potential_return_dollars)} if the Quinella lands`
        : `Quinella pays if these two fill 1-2 in any order`;
      return {
        verb: 'PLACE THIS QUINELLA',
        product: `$${p.stake_dollars.toFixed(0)} Quinella · ${p.horse_name} + ${p.partner_horse_name}`,
        path: `Sportsbet → Racing → ${venueLabel(p.venue)} → R${p.race_number} → Exotics → Quinella → tap both horses`,
        returnIf: ret,
      };
    }
    return null;
  }

  function renderPlay(p, isHero, ordinal) {
    const meta = KIND_META[p.kind] || { emoji: '·' };
    const cls = `play${isHero ? ' hero' : ''}`;
    const heroTag = isHero ? '<div class="hero-tag">Today\'s Top Play</div>' : '';
    const action = buildAction(p);

    let legsHtml = '';
    if (p.kind === 'spine' && p.legs) {
      legsHtml = `<div class="legs">${p.legs.map(l => `
        <div class="leg">
          <div>
            <div class="leg-horse">${escHtml(l.horse_name)}</div>
            <div class="leg-meta">${escHtml(venueLabel(l.venue))} R${l.race_number} · Top 4${l.scheduled_time ? ' · ' + fmtJump(l.scheduled_time) : ''}</div>
          </div>
          <div class="leg-odds">$${l.sb_top4_odds_est}</div>
        </div>`).join('')}</div>`;
    } else if (p.kind === 'lock' || p.kind === 'bonus') {
      const stakeLabel = p.kind === 'bonus' ? `$${p.bonus_stake_dollars} bonus` : `$${p.stake_dollars}`;
      legsHtml = `<div class="legs"><div class="leg">
        <div>
          <div class="leg-horse">${escHtml(p.horse_name)}</div>
          <div class="leg-meta">${escHtml(venueLabel(p.venue))} R${p.race_number}${p.scheduled_time ? ' · ' + fmtJump(p.scheduled_time) : ''} · model ${p.model_pct}% · +${p.edge_pct}pt edge</div>
        </div>
        <div class="leg-odds">$${p.best_available_odds}</div>
      </div></div>`;
    } else if (p.kind === 'wave' && p.legs) {
      legsHtml = `<div class="legs">${p.legs.map(l => `
        <div class="leg">
          <div style="flex:1">
            <div class="leg-horse">R${l.race_number}${l.scheduled_time ? ' · ' + fmtJump(l.scheduled_time) : ''}</div>
            <div class="leg-picks">${(l.picks || []).map(x => `${escHtml(x.horse_name)} <span class="leg-meta">(${(x.win_pct || 0).toFixed(0)}%)</span>`).join(' &nbsp;·&nbsp; ')}</div>
          </div>
          <div class="leg-odds">${fmtPct(l.leg_hit_probability)}</div>
        </div>`).join('')}</div>`;
    } else if (p.kind === 'lab') {
      const names = (p.box_horse_names || []).join(' · ');
      legsHtml = `<div class="legs"><div class="leg">
        <div style="flex:1">
          <div class="leg-horse">${escHtml(venueLabel(p.venue))} R${p.race_number}</div>
          <div class="leg-picks">${escHtml(names)}</div>
        </div>
        <div class="leg-odds">Trio</div>
      </div></div>`;
    } else if (p.kind === 'double' && p.legs) {
      legsHtml = `<div class="legs">${p.legs.map(l => `
        <div class="leg">
          <div>
            <div class="leg-horse">${escHtml(l.horse_name)}</div>
            <div class="leg-meta">${escHtml(venueLabel(l.venue))} R${l.race_number} · Place${l.scheduled_time ? ' · ' + fmtJump(l.scheduled_time) : ''} · place ${Math.round(l.place_prob*100)}%</div>
          </div>
          <div class="leg-odds">$${l.place_odds_est}</div>
        </div>`).join('')}</div>`;
    } else if (p.kind === 'banker') {
      legsHtml = `<div class="legs"><div class="leg">
        <div>
          <div class="leg-horse">${escHtml(p.horse_name)}</div>
          <div class="leg-meta">${escHtml(venueLabel(p.venue))} R${p.race_number}${p.scheduled_time ? ' · ' + fmtJump(p.scheduled_time) : ''} · place ${Math.round(p.place_prob*100)}%</div>
        </div>
        <div class="leg-odds">$${p.place_odds_est}</div>
      </div></div>`;
    } else if (p.kind === 'combo_doubles' && p.legs) {
      const legsBody = p.legs.map((l, i) => `
        <div class="leg">
          <div style="flex:1">
            <div class="leg-horse">${i+1}. ${escHtml(l.horse_name)} <span class="leg-meta">(${l.model_pct}%)</span></div>
            <div class="leg-meta">${escHtml(venueLabel(l.venue))} R${l.race_number}${l.scheduled_time ? ' · ' + fmtJump(l.scheduled_time) : ''}</div>
          </div>
          <div class="leg-odds">${l.best_available_odds ? '$' + l.best_available_odds.toFixed(2) : '—'}</div>
        </div>`).join('');
      const p2 = ((p.prob_at_least_2_wins || 0) * 100).toFixed(1);
      const p3 = ((p.prob_at_least_3_wins || 0) * 100).toFixed(1);
      const p4 = ((p.prob_all_4_win || 0) * 100).toFixed(2);
      legsHtml = `<div class="legs">${legsBody}
        <div class="leg" style="background: rgba(168,85,247,0.10); border-color: rgba(168,85,247,0.3);">
          <div style="flex:1">
            <div style="font-size:13px; font-weight:600; color: var(--text-primary)">
              🧩 6 doubles · $${p.unit_stake_dollars}/pair · $${p.stake_dollars} total
            </div>
            <div style="font-size:11px; color: var(--text-muted); margin-top:3px">
              ≥1 pair hits ${((p.prob_at_least_1_win || 0)*100).toFixed(1)}% · ≥2 legs ${p2}% · ≥3 legs ${p3}% · 4/4 ${p4}%
            </div>
          </div>
        </div>
      </div>`;
    } else if (p.kind === 'quaddie' && p.legs) {
      const legsBody = p.legs.map(l => {
        const second = l.second_horse_name
          ? `<div class="leg-picks">+ ${escHtml(l.second_horse_name)} <span class="leg-meta">(${l.second_model_pct}%)</span></div>`
          : '';
        return `
        <div class="leg">
          <div style="flex:1">
            <div class="leg-horse">${escHtml(l.horse_name)} <span class="leg-meta">(${l.model_pct}%)</span></div>
            <div class="leg-meta">${escHtml(venueLabel(l.venue))} R${l.race_number}${l.scheduled_time ? ' · ' + fmtJump(l.scheduled_time) : ''}</div>
            ${second}
          </div>
          <div class="leg-odds">${l.best_available_odds ? '$' + l.best_available_odds.toFixed(2) : '—'}</div>
        </div>`;
      }).join('');
      // Boxed-quaddie footer — shown when rank-2 is available for all 4 legs.
      const boxFooter = p.boxed_available ? `
        <div class="leg" style="background: rgba(168,85,247,0.10); border-color: rgba(168,85,247,0.3);">
          <div style="flex:1">
            <div style="font-size:13px; font-weight:600; color: var(--text-primary)">
              📦 Box rank-1 + rank-2 (${p.boxed_perms} perms)
            </div>
            <div style="font-size:11px; color: var(--text-muted)">
              Hit prob ${(p.boxed_hit_probability * 100).toFixed(2)}% · stake $${p.boxed_stake_dollars}
            </div>
          </div>
        </div>` : '';
      legsHtml = `<div class="legs">${legsBody}${boxFooter}</div>`;
    } else if (p.kind === 'twofunk') {
      const leg1Odds = p.leg1_odds ? `$${p.leg1_odds.toFixed(2)}` : '—';
      const leg2Odds = p.partner_odds ? `$${p.partner_odds.toFixed(2)}` : '—';
      legsHtml = `<div class="legs">
        <div class="leg">
          <div>
            <div class="leg-horse">${escHtml(p.horse_name)}</div>
            <div class="leg-meta">${escHtml(venueLabel(p.venue))} R${p.race_number}${p.scheduled_time ? ' · ' + fmtJump(p.scheduled_time) : ''} · win ${p.model_pct}% · rank 1</div>
          </div>
          <div class="leg-odds">${leg1Odds}</div>
        </div>
        <div class="leg">
          <div>
            <div class="leg-horse">${escHtml(p.partner_horse_name)}</div>
            <div class="leg-meta">Quinella partner · win ${p.partner_win_pct}% · rank 2</div>
          </div>
          <div class="leg-odds">${leg2Odds}</div>
        </div>
        <div class="leg" style="background: rgba(236,72,153,0.10); border-color: rgba(236,72,153,0.3);">
          <div style="font-size:11px; color: var(--text-muted);">
            Top-2 sum ${p.top2_win_sum_pct}% · ${p.rank2_rank3_gap_pct}pt cliff to rank-3
          </div>
        </div>
      </div>`;
    }

    const evCls = (p.expected_value_dollars || 0) >= 0 ? 'pos' : 'neg';
    const stakeShown = p.kind === 'bonus' ? p.bonus_stake_dollars : p.stake_dollars;
    const stakeLabel = p.kind === 'bonus' ? 'Bonus' : 'Stake';

    // Outcome banner (past dates only) — shows what actually happened
    // with this play and the realised P/L.
    const outcome = p.outcome || null;
    const outcomeHtml = outcome ? (() => {
      const status = outcome.status || 'no_result';
      const profit = outcome.profit_dollars || 0;
      return `
        <div class="outcome-banner ${status}">
          <span>${escHtml(outcome.summary || '')}</span>
          ${status !== 'no_result' ? `<span class="outcome-profit">${fmtMoney(profit)}</span>` : ''}
        </div>`;
    })() : '';

    // Prescriptive action block — tells the user EXACTLY what bet to
    // place, where to find it on Sportsbet, and what the return looks like.
    const actionHtml = action ? `
      <div class="action-block">
        <div class="action-head">
          ${ordinal ? `<span class="action-num">${ordinal}</span>` : ''}
          <span class="action-verb">${action.verb}</span>
        </div>
        <div class="action-product">${escHtml(action.product)}</div>
        <div class="action-path">${escHtml(action.path)}</div>
        <div class="action-return ${evCls}">${escHtml(action.returnIf)}</div>
      </div>` : '';

    // Sharp badge — a play qualifies when its selection rules effectively
    // meet the site-wide Sharp niche (high-confidence win-pick band).
    //   - Lock + Spine: always (their selection thresholds exceed Sharp's)
    //   - Wave: when average leg hit probability is high enough that the
    //     2-pick set is genuinely concentrated
    //   - Bonus + Lab Pick: never (Bonus uses value-overlay band below
    //     Sharp's threshold; Lab Pick uses inverse niche)
    const isSharpPlay = (() => {
      // Lock / Spine: explicit confidence + edge thresholds in selection.
      // Double / Banker: place plays use the ≥5pt rank-gap decisiveness
      //   filter so toss-up races are excluded by construction.
      // Wave: variance play — only badge when avg leg hit prob ≥55%.
      // Bonus / Lab Pick: value/inverse niches respectively — not badged.
      if (['lock', 'spine', 'double', 'banker'].includes(p.kind)) return true;
      if (p.kind === 'wave' && Array.isArray(p.legs)) {
        const avg = p.legs.reduce((s, l) => s + (l.leg_hit_probability || 0), 0) / (p.legs.length || 1);
        return avg >= 0.55;
      }
      return false;
    })();
    const sharpBadgeHtml = isSharpPlay
      ? `<span class="sharp-badge" title="Sharp pick — meets our high-confidence niche criteria">🎯 Sharp</span>`
      : '';

    return `
      <div class="${cls}">
        ${heroTag}
        <div class="play-header">
          <div>
            <h3 class="play-title"><span class="emoji">${meta.emoji}</span>${escHtml(p.title)}${p.kind === 'twofunk' ? '<span class="tier-marker tier-labs">Labs</span>' : ''}</h3>
            <div class="play-subtitle">${escHtml(p.subtitle || '')}</div>
          </div>
          <div class="play-header-right">
            ${sharpBadgeHtml}
            <span class="confidence ${p.confidence}" title="Confidence tier — A safer, C high variance">${p.confidence}</span>
          </div>
        </div>
        ${outcomeHtml}
        ${actionHtml}
        ${legsHtml}
        <div class="stats">
          <div class="stat">
            <div class="stat-num purple">${fmtPct(p.model_hit_probability)}</div>
            <div class="stat-label">Hit prob.</div>
          </div>
          <div class="stat">
            <div class="stat-num">${fmtMoneyPlain(stakeShown)}</div>
            <div class="stat-label">${stakeLabel}</div>
          </div>
          <div class="stat">
            <div class="stat-num ${evCls}">${fmtMoney(p.expected_value_dollars)}</div>
            <div class="stat-label">Est. profit</div>
          </div>
        </div>
        <div class="play-foot">
          <span class="past-stat">Potential return: ${fmtMoneyPlain(p.potential_return_dollars)}</span>
          <button data-copy="${p.kind}">Copy plan</button>
        </div>
      </div>`;
  }

  function renderExposure(d) {
    const exp = document.getElementById('exposure');
    document.getElementById('cashExp').textContent = `$${(d.cash_exposure_dollars || 0).toFixed(2)}`;
    document.getElementById('bonusExp').textContent = `$${(d.bonus_exposure_dollars || 0).toFixed(2)}`;
    const evEl = document.getElementById('expEv');
    const evLabelEl = document.getElementById('expEvLabel');
    const cashLabelEl = document.getElementById('cashExpLabel');
    // For past dates, show ACTUAL profit instead of expected
    if (d.is_past) {
      const actual = d.actual_profit_dollars || 0;
      evEl.textContent = fmtMoney(actual);
      evEl.className = `exposure-num ${actual >= 0 ? 'pos' : 'neg'}`;
      if (evLabelEl) evLabelEl.textContent = 'Actual profit';
      if (cashLabelEl) cashLabelEl.textContent = 'Cash staked';
    } else {
      const ev = d.expected_profit_dollars || 0;
      evEl.textContent = fmtMoney(ev);
      evEl.className = `exposure-num ${ev >= 0 ? 'pos' : 'neg'}`;
      if (evLabelEl) evLabelEl.textContent = 'Est. profit';
      if (cashLabelEl) cashLabelEl.textContent = 'Cash exposure';
    }
    exp.style.display = 'grid';
  }

  // Current selected day. Drives the date passed to the API.
  let currentDay = 'today';

  function _dateForDay(day) {
    const now = new Date();
    const parts = now.toLocaleDateString('en-AU', {
      timeZone: 'Australia/Sydney', year: 'numeric', month: '2-digit', day: '2-digit',
    }).split('/');
    const today = `${parts[2]}-${parts[1]}-${parts[0]}`;
    if (day === 'today') return today;
    const [y, m, d] = today.split('-').map(Number);
    const offsetDays = day === 'yesterday' ? -1 : day === 'tomorrow' ? 1 : 0;
    const base = new Date(Date.UTC(y, m - 1, d) + offsetDays * 86400000);
    const yy = base.getUTCFullYear();
    const mm = String(base.getUTCMonth() + 1).padStart(2, '0');
    const dd = String(base.getUTCDate()).padStart(2, '0');
    return `${yy}-${mm}-${dd}`;
  }

  function _subtitleFor(day) {
    if (day === 'yesterday') {
      return "Yesterday's playbook — outcomes resolved.";
    }
    if (day === 'tomorrow') {
      return "Tomorrow's playbook · 🎯 Sharp picks · take prices early before the market shortens.";
    }
    return "Today's lower-variance playbook · 🎯 Sharp picks · place-led · $10 base stake";
  }

  async function load(day) {
    day = day || currentDay;
    currentDay = day;
    const root = document.getElementById('root');
    // Update tab + subtitle styling
    document.querySelectorAll('.day-tab').forEach(b =>
      b.classList.toggle('active', b.dataset.day === day));
    const sub = document.getElementById('pageSubtitle');
    if (sub) sub.textContent = _subtitleFor(day);

    const targetDate = _dateForDay(day);
    root.innerHTML = `<div class="empty">Loading ${day}'s playbook…</div>`;
    try {
      const planRes = await fetch(`${API}/api/funk-me-up/today?date=${targetDate}`);
      if (!planRes.ok) throw new Error('HTTP ' + planRes.status);
      const data = await planRes.json();
      window._funkData = data;
      renderExposure(data);
      if (!data.plays || !data.plays.length) {
        const msg = day === 'tomorrow'
          ? "Tomorrow's plays will appear once predictions are enriched (typically by 08:30 AEST)."
          : day === 'yesterday'
          ? "No yesterday plays to resolve — predictions weren't generated for that date."
          : "No qualifying plays today — try again closer to the first jump.";
        root.innerHTML = `
          <div class="empty">
            <div style="font-size:28px;margin-bottom:8px">📭</div>
            <div>${msg}</div>
          </div>`;
        return;
      }
      const heroKind = data.hero_kind;
      const hero = data.plays.find(p => p.kind === heroKind);
      const others = data.plays.filter(p => p.kind !== heroKind);
      others.sort((a, b) => _earliestMs(a) - _earliestMs(b));
      const ordered = hero ? [hero, ...others] : others;
      const ordinalByKind = {};
      ordered.forEach((p, i) => { ordinalByKind[p.kind] = i + 1; });

      const heroLabel = day === 'yesterday' ? "Top Play that day"
                      : day === 'tomorrow'  ? "Tomorrow's Top Play"
                      : "Today's Top Play — place first";
      const moreLabel = day === 'yesterday' ? "Other Plays — outcomes resolved"
                      : day === 'tomorrow'  ? "Other Plays — in order of jump time"
                      : "More Plays — in order of jump time";
      let html = '';
      if (hero) {
        html += `<div class="section-title">${heroLabel}</div>`;
        html += renderPlay(hero, true, ordinalByKind[hero.kind]);
      }
      if (others.length) {
        html += `<div class="section-title">${moreLabel}</div>`;
        html += others.map(p => renderPlay(p, false, ordinalByKind[p.kind])).join('');
      }
      html += `<div class="disclaimer">${escHtml(data.disclaimer || '')}</div>`;
      html += `<div class="responsible">Gamble responsibly · 1800 858 858 · gamblinghelponline.org.au</div>`;
      root.innerHTML = html;

      root.querySelectorAll('[data-copy]').forEach(btn => {
        btn.addEventListener('click', () => {
          const kind = btn.dataset.copy;
          const p = (window._funkData.plays || []).find(x => x.kind === kind);
          if (p) copyPlan(playToText(p));
        });
      });
    } catch (e) {
      root.innerHTML = `<div class="empty">Could not load: ${escHtml(e.message)}</div>`;
    }
  }

  // Wire tab clicks
  document.querySelectorAll('.day-tab').forEach(btn => {
    btn.addEventListener('click', () => load(btn.dataset.day));
  });

  load('today');
</script>
</body>
</html>
