<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FunkyIQ — Sign In</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #07090f;
      color: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34,197,94,0.06), transparent),
        radial-gradient(ellipse 60% 40% at 90% 90%, rgba(232,160,32,0.04), transparent);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: #0e1220;
      border: 1px solid #1e2840;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .brand-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }
    .brand-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f0f4ff;
    }

    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      line-height: 1;
    }
    .sub {
      font-size: 0.8rem;
      color: #8a9bc4;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: #8a9bc4;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      background: #1a2035;
      border: 1px solid #1e2840;
      border-radius: 10px;
      color: #f0f4ff;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      padding: 13px 16px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }
    input[type="password"]:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.12);
    }
    input[type="password"]::placeholder { color: #4a5a7a; }

    .btn {
      width: 100%;
      background: #22c55e;
      color: #07090f;
      border: none;
      border-radius: 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 14px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { background: #4ade80; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px;
      color: #f87171;
      font-size: 0.8rem;
      padding: 10px 14px;
      margin-bottom: 18px;
      display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-name">FunkyIQ</span>
    </div>
    <h1>Sign In</h1>
    <p class="sub">Private access only. Enter the passphrase to continue.</p>

    <div class="error" id="errMsg"></div>

    <form id="loginForm" autocomplete="on">
      <label for="pwd">Passphrase</label>
      <input
        type="password"
        id="pwd"
        name="password"
        placeholder="Enter passphrase"
        autocomplete="current-password"
        required
        autofocus
      />
      <button class="btn" type="submit" id="submitBtn">Access Site</button>
    </form>
  </div>

  <script>
    function escHtml(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    const params = new URLSearchParams(window.location.search);
    // Only allow same-origin redirect targets
    function safeNext() {
      const next = params.get('next') || '/';
      try {
        const u = new URL(next, window.location.origin);
        if (u.origin === window.location.origin) return u.pathname + u.search;
      } catch(_) {}
      return '/';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('errMsg');
      const password = document.getElementById('pwd').value;

      btn.disabled = true;
      btn.textContent = 'Checking…';
      errEl.classList.remove('show');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
          credentials: 'same-origin',
        });

        if (res.ok) {
          window.location.href = safeNext();
        } else {
          const data = await res.json().catch(() => ({}));
          errEl.textContent = escHtml(data.error || 'Incorrect passphrase. Try again.');
          errEl.classList.add('show');
          document.getElementById('pwd').value = '';
          document.getElementById('pwd').focus();
        }
      } catch (_) {
        errEl.textContent = 'Could not reach server. Check your connection.';
        errEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Access Site';
      }
    });
  </script>
</body>
</html>
