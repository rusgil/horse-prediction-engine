<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FunkyIQ — The Edge</title>
<script src="/theme.js?v=15"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="/sharp.js"></script>
<script src="/pick-card.js?v=28"></script>
<style>
  /* ── Tokens ─────────────────────────────────────────────── */
  :root {
    --bg: #0a0d13;
    --surface: #121722;
    --surface-2: #1a2130;
    --line: #232c3d;
    --text: #e8ecf4;
    --text-2: #a7b1c2;
    --text-3: #6b7688;
    --mint: #38e07b;
    --mint-ink: #06220f;
    --mint-dim: rgba(56,224,123,0.13);
    --amber: #f5a623;
    --amber-dim: rgba(245,166,35,0.14);
    --gold: #f5c842;
    --blue: #60a5fa;
    --blue-dim: rgba(96,165,250,0.14);
    --hot: #fb923c;
    --hot-dim: rgba(251,146,60,0.16);
    --strong: #f472b6;
    --strong-dim: rgba(244,114,182,0.13);
    --red: #f87171;
    --red-dim: rgba(248,113,113,0.13);
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
    --radius: 14px;
  }
  :root[data-theme="light"] {
    --bg: #f2f4f7;
    --surface: #ffffff;
    --surface-2: #eaeef3;
    --line: #d9e0e8;
    --text: #16202e;
    --text-2: #46536b;
    --text-3: #84919f;
    --mint: #0e9e53;
    --mint-ink: #ffffff;
    --mint-dim: rgba(14,158,83,0.11);
    --amber: #b97400;
    --amber-dim: rgba(185,116,0,0.12);
    --gold: #9c7c00;
    --blue: #2563c9;
    --blue-dim: rgba(37,99,201,0.10);
    --hot: #d95f0e;
    --hot-dim: rgba(217,95,14,0.13);
    --strong: #bb2d7f;
    --strong-dim: rgba(187,45,127,0.10);
    --red: #cf4444;
    --red-dim: rgba(207,68,68,0.10);
    --shadow: 0 8px 22px rgba(22,32,46,0.09);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
    transition: background 0.25s, color 0.25s;
  }
  button { font-family: inherit; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  /* ── Header ─────────────────────────────────────────────── */
  header {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .hd-row {
    max-width: 1220px; margin: 0 auto; padding: 10px 16px;
    display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
  }
  .brand {
    font-family: 'Barlow Condensed'; font-weight: 800; font-size: 1.35rem;
    letter-spacing: 0.02em; display: flex; align-items: baseline; gap: 7px;
    white-space: nowrap;
  }
  .brand .lab-tag {
    font-size: 0.6rem; font-family: 'Barlow'; font-weight: 800;
    letter-spacing: 0.14em; color: var(--mint); border: 1px solid var(--mint);
    border-radius: 4px; padding: 1px 6px; transform: translateY(-2px);
  }
  .hd-spacer { display: none; }
  .seg {
    display: inline-flex; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 3px; gap: 2px;
  }
  .seg button {
    background: none; border: none; color: var(--text-2);
    font-weight: 700; font-size: 0.78rem; padding: 6px 13px; border-radius: 8px;
    transition: background 0.15s, color 0.15s; letter-spacing: 0.01em;
  }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 5px rgba(0,0,0,0.3); }
  :root[data-theme="light"] .seg button.on { box-shadow: 0 1px 4px rgba(22,32,46,0.15); }

  .date-row {
    max-width: 1220px; margin: 0 auto; padding: 0 16px 10px;
    display: flex; align-items: stretch; justify-content: center; gap: 8px; overflow-x: auto;
    scrollbar-width: none;
  }
  /* keep the left pill reachable if the row ever overflows on tiny screens
     (center + overflow would clip it otherwise) */
  .date-row > :first-child { margin-left: auto; }
  .date-row > :last-child { margin-right: auto; }
  .date-row::-webkit-scrollbar { display: none; }
  .date-pill {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2);
    border-radius: 999px; padding: 5px 14px; font-size: 0.8rem; font-weight: 700;
    white-space: nowrap; flex-shrink: 0;
    display: inline-flex; flex-direction: row; align-items: center; justify-content: center; gap: 4px;
  }
  .date-pill.on { background: var(--surface); border-color: var(--text-3); color: var(--text); font-weight: 800; }
  .date-pill .dp-stat { font-size: 0.66rem; font-weight: 800; opacity: 0.85; margin-left: 4px; }
  .dr-sep { width: 1px; height: 20px; background: var(--line); flex-shrink: 0; margin: 0 3px; }
  .prev-pill { flex-direction: row; align-items: center; gap: 4px; }
  .prev-pill .dp-arr {
    background: none; border: none; color: inherit; cursor: pointer;
    font-size: 0.95rem; font-weight: 800; padding: 0 3px; line-height: 1;
  }
  .prev-pill .dp-arr:disabled { opacity: 0.3; cursor: default; }
  .prev-pill .dp-mid { background: none; border: none; color: inherit; font: inherit; font-weight: 700; cursor: pointer; padding: 0; }
  .dp-acc { font-weight: 800; font-size: 0.76rem; color: var(--text-3); }
  .dp-acc.elite { color: #c084fc; text-shadow: 0 0 6px rgba(192,132,252,0.35); }
  .dp-acc.great { color: #60a5fa; }
  .dp-acc.good  { color: #10b981; }
  .dp-acc.ok    { color: var(--gold, #b8901f); }
  .dp-acc.bad   { color: #f87171; }
  :root[data-theme="light"] .dp-acc.elite { color: #7c3aed; text-shadow: none; }
  :root[data-theme="light"] .dp-acc.great { color: #245fc4; }
  :root[data-theme="light"] .dp-acc.good  { color: #0a7a41; }
  :root[data-theme="light"] .dp-acc.bad   { color: #c23a3a; }
  .seg.seg-sm button { padding: 3px 10px; font-size: 0.72rem; }
  .ds-best { cursor: pointer; }
  .ds-best b { font-family: 'Barlow', system-ui, sans-serif; font-size: 0.95rem; font-weight: 800; }
  .ds-best:hover b { text-decoration: underline; }
  .date-input {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2);
    border-radius: 999px; padding: 4px 12px; font-size: 0.8rem; font-family: inherit;
    flex-shrink: 0; color-scheme: dark;
  }
  :root[data-theme="light"] .date-input { color-scheme: light; }

  /* ── Day summary strip ──────────────────────────────────── */
  .day-strip {
    max-width: 1220px; margin: 12px auto 0; padding: 0 16px;
    display: none; flex-direction: column; align-items: flex-start; gap: 10px;
  }
  .day-strip.show { display: flex; }
  .ds-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .ds-stat { display: flex; align-items: baseline; gap: 6px; font-size: 0.78rem; color: var(--text-3); }
  .ds-stat b { font-family: 'Barlow Condensed'; font-size: 1.25rem; color: var(--text); font-weight: 800; }
  .ds-stat b.g { color: var(--mint); }
  .ds-stat b.a { color: var(--amber); }
  .ds-divider { width: 1px; height: 18px; background: var(--line); }

  .tn { color: var(--text-3); }
  .tally-lab { font-size: 0.64rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-3); }
  .cell-tally { text-align: center; font-size: 0.72rem; padding: 7px 4px; border-top: 1px solid var(--line); }
  .cell-tally .rs-w, .cell-tally .rs-p { display: block; }
  .cell-tally .rs-p { margin-top: 1px; }

  .hs-filters-bar { display: flex; justify-content: flex-end; margin: 0 0 12px; }
  .filt-row { margin-bottom: 16px; }
  .filt-row .fl { font-weight: 800; color: var(--text-3); letter-spacing: 0.05em; text-transform: uppercase; font-size: 0.64rem; margin-bottom: 7px; }
  .filt-row .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .filt-info { font-size: 0.7rem; color: var(--text-3); line-height: 1.45; margin-top: 7px; }
  .filt-info strong { color: var(--text-2); }
  .filt-info em { color: var(--gold); font-style: normal; font-weight: 700; }
  .filt-clear { margin: 0 0 16px; display: inline-block; }
  .filt-clear:disabled { opacity: 0.4; cursor: default; }
  .filt-note { font-size: 0.7rem; color: var(--text-3); margin-top: 4px; }
  .jcard .when .cd.big {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px;
    line-height: 1; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .jcard .when .wt { font-size: 0.68rem; color: var(--text-3); font-weight: 700; }
  .field-toggle {
    grid-column: 1 / -1; margin-top: 8px; text-align: center; font-size: 0.68rem;
    color: var(--text-3); cursor: pointer; user-select: none; padding: 5px 0 1px;
    border-top: 1px dashed var(--line); font-weight: 700; letter-spacing: 0.03em;
  }
  .field-toggle:active { color: var(--text); }
  .field-table {
    grid-column: 1 / -1; margin-top: 6px; font-size: 0.74rem; width: 100%;
    border-collapse: collapse; font-variant-numeric: tabular-nums;
  }
  .field-table th {
    text-align: right; font-weight: 700; color: var(--text-3); text-transform: uppercase;
    letter-spacing: 0.04em; font-size: 0.58rem; padding: 4px; border-bottom: 1px solid var(--line);
  }
  .field-table th.l { text-align: left; }
  .field-table td { padding: 4px; border-bottom: 1px solid var(--line); color: var(--text-2); }
  .field-table td.name { text-align: left; color: var(--text); font-weight: 600; }
  .field-table td.name .jk { color: var(--text-3); font-weight: 500; font-size: 0.68rem; }
  .field-table td.r { text-align: right; }
  .field-table tr:last-child td { border-bottom: none; }
  .field-table tr.scratched td { text-decoration: line-through; color: var(--text-3); opacity: 0.6; }
  .field-table tr.rank1 td, .field-table tr.rank1 td.name { color: var(--mint); }

  /* ── Legend ─────────────────────────────────────────────── */
  .key { max-width: 1220px; margin: 34px auto 0; padding: 0 16px; }
  .key-title {
    font-family: 'Barlow Condensed'; font-weight: 700; font-size: 1rem;
    color: var(--text-3); letter-spacing: 0.1em; text-transform: uppercase;
    border-top: 1px solid var(--line); padding-top: 18px; margin-bottom: 12px;
  }
  .legend-box {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 12px 22px;
  }
  .lg-item { font-size: 0.77rem; color: var(--text-2); display: flex; gap: 9px; align-items: flex-start; }
  .lg-item b { color: var(--text); font-weight: 700; }
  .lg-chip { flex-shrink: 0; margin-top: 1px; }

  /* ── Chips & badges ─────────────────────────────────────── */
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.66rem; font-weight: 800; letter-spacing: 0.03em;
    border-radius: 5px; padding: 2px 7px; white-space: nowrap;
    border: 1px solid transparent;
  }
  .chip.going-good  { background: var(--mint-dim);  color: var(--mint); }
  .chip.going-soft  { background: var(--amber-dim); color: var(--amber); }
  .chip.going-heavy { background: var(--red-dim);   color: var(--red); }
  .chip.going-synth { background: var(--blue-dim);  color: var(--blue); }
  .chip.going-unknown { background: var(--surface-2); color: var(--text-3); }
  .chip.sharp { background: var(--mint-dim); color: var(--mint); border-color: var(--mint); }
  .chip.place-play { background: var(--blue-dim); color: var(--blue); border-color: var(--blue); position: relative; cursor: help; outline: none; margin-left: 8px; vertical-align: 3px; }
  .chip.place-play .chip-i { opacity: 0.75; margin-left: 1px; font-style: normal; }
  .chip.place-play[data-tip]:hover::after, .chip.place-play[data-tip]:focus::after {
    content: attr(data-tip); position: absolute; right: 0; top: calc(100% + 6px); z-index: 60;
    width: max-content; max-width: min(240px, 76vw); padding: 8px 10px; border-radius: 8px;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
    font-size: 0.68rem; font-weight: 500; line-height: 1.4; letter-spacing: 0; text-transform: none;
    white-space: normal; box-shadow: 0 6px 18px rgba(0,0,0,0.28); }
  .chip.tier-hot    { background: var(--hot-dim);   color: var(--hot); }
  .chip.tier-high   { background: var(--blue-dim);  color: var(--blue); }
  .chip.tier-strong { background: var(--strong-dim); color: var(--strong); }
  .chip.wet-note { background: var(--amber-dim); color: var(--amber); }
  .mcell .wx { font-size: 0.72rem; color: var(--text-3); }
  .rail-item .rv .wx { margin-left: auto; font-size: 0.72rem; color: var(--text-3); font-family: 'Barlow'; font-weight: 500; }

  .watch-btn {
    display: inline-flex; align-items: center; gap: 4px; text-decoration: none;
    font-size: 0.68rem; font-weight: 800; letter-spacing: 0.02em;
    border-radius: 6px; padding: 3px 9px; white-space: nowrap;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2);
    transition: border-color 0.15s, color 0.15s;
  }
  .watch-btn:hover { border-color: var(--mint); color: var(--mint); }
  .watch-btn .wb-src { font-weight: 600; color: var(--text-3); }


  /* Settled-race outcome borders: green = win, amber = place, red = loss */
  .jcard.res-win   { border-color: color-mix(in srgb, var(--mint)  55%, var(--line)); }
  .jcard.res-place { border-color: color-mix(in srgb, var(--amber) 55%, var(--line)); }
  .jcard.res-miss  { border-color: color-mix(in srgb, var(--red)   45%, var(--line)); }
  .brace.res-win   { box-shadow: inset 3px 0 0 var(--mint); }
  .brace.res-place { box-shadow: inset 3px 0 0 var(--amber); }
  .brace.res-miss  { box-shadow: inset 3px 0 0 var(--red); }
  .cell.done.res-win .in   { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mint)  55%, transparent); }
  .cell.done.res-place .in { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--amber) 55%, transparent); }
  .cell.done.res-miss .in  { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--red)   40%, transparent); }
  /* settled cards keep their outcome colour on hover (generic hover is mint) */
  .jcard.res-win:hover   { border-color: var(--mint); }
  .jcard.res-place:hover { border-color: var(--amber); }
  .jcard.res-miss:hover  { border-color: var(--red); }
  .brace.res-win:hover   { background: var(--mint-dim); }
  .brace.res-place:hover { background: var(--amber-dim); }
  .brace.res-miss:hover  { background: var(--red-dim); }
  /* light theme: thicker + stronger — the slim borders wash out on white */
  :root[data-theme="light"] .jcard.res-win   { border: 2px solid color-mix(in srgb, var(--mint)  75%, var(--line)); }
  :root[data-theme="light"] .jcard.res-place { border: 2px solid color-mix(in srgb, var(--amber) 75%, var(--line)); }
  :root[data-theme="light"] .jcard.res-miss  { border: 2px solid color-mix(in srgb, var(--red)   65%, var(--line)); }
  :root[data-theme="light"] .brace.res-win   { box-shadow: inset 5px 0 0 var(--mint); }
  :root[data-theme="light"] .brace.res-place { box-shadow: inset 5px 0 0 var(--amber); }
  :root[data-theme="light"] .brace.res-miss  { box-shadow: inset 5px 0 0 var(--red); }
  :root[data-theme="light"] .cell.done.res-win .in   { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--mint)  70%, transparent); }
  :root[data-theme="light"] .cell.done.res-place .in { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--amber) 70%, transparent); }
  :root[data-theme="light"] .cell.done.res-miss .in  { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--red)   55%, transparent); }

  .res { font-weight: 800; font-size: 0.8rem; }
  .res.win { color: var(--mint); }
  .res.place { color: var(--amber); }
  .res.miss { color: var(--text-3); }

  /* prediction bars — TRUE scale, the number carries precision */
  .pbar-pair { display: flex; flex-direction: column; gap: 4px; min-width: auto; }
  /* Big centred WIN/PLACE stat — the card's focal number (old-edge style). */
  .dual-stat-row { display: flex; gap: 20px; align-items: baseline; justify-content: center; }
  .dual-stat-row .ds { display: flex; flex-direction: column; gap: 1px; align-items: center; }
  .dual-stat-row .ds-num { font-family: 'Barlow Condensed', sans-serif; font-size: 1.7rem; font-weight: 900; line-height: 1; color: var(--text); }
  .dual-stat-row .ds-num.v-win { color: var(--gold); }
  .dual-stat-row .ds-num.v-plc { color: var(--blue); }
  .dual-stat-row .ds-num.v-dim { color: var(--text-3); }
  .dual-stat-row .ds-lbl { font-size: 0.56rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
  .pbar { display: flex; align-items: center; gap: 7px; font-size: 0.7rem; }
  .pbar .lbl { width: 30px; color: var(--text-3); font-weight: 700; flex-shrink: 0; letter-spacing: 0.04em; }
  .pbar .track { display: none; }
  .pbar .fill { display: block; height: 100%; border-radius: 3px; }
  /* Original-Lounge colour language: win = gold, place = blue */
  .pbar .fill.win { background: var(--gold); }
  .pbar .fill.place { background: var(--blue); }
  .pbar .val { width: auto; text-align: left; margin-left: 2px; font-weight: 800; font-size: 1rem; color: var(--text); }
  /* % highlight — win from 30%, place from 50%; otherwise dim */
  .pbar .val.v-win { color: var(--gold); }
  .pbar .val.v-plc { color: var(--blue); }
  .pbar .val.v-dim { color: var(--text-3); font-weight: 700; }

  /* ── Layout shell ───────────────────────────────────────── */
  main { max-width: 1220px; margin: 0 auto; padding: 14px 16px 90px; }
  .view { display: none; }
  .view.on { display: block; }
  .loading { text-align: center; color: var(--text-3); padding: 60px 0; font-size: 0.85rem; }
  .spin {
    width: 22px; height: 22px; border: 2px solid var(--line); border-top-color: var(--mint);
    border-radius: 50%; margin: 0 auto 12px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; color: var(--text-3); padding: 60px 20px; }
  .empty .big { font-size: 2rem; margin-bottom: 8px; }
  .hint { font-size: 0.68rem; color: var(--text-3); margin-top: 9px; }

  /* ── View A: Confidence heat grid ───────────────────────── */
  .grid-wrap {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    overflow-x: auto; box-shadow: var(--shadow);
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .grid-wrap::-webkit-scrollbar { display: none; }
  table.race-grid { border-collapse: collapse; width: 100%; min-width: 740px; }
  .race-grid th, .race-grid td { padding: 0; }
  .race-grid thead th {
    font-family: 'Barlow Condensed'; font-weight: 700; font-size: 0.8rem;
    color: var(--text-3); text-align: center; padding: 10px 4px 8px;
    border-bottom: 1px solid var(--line); letter-spacing: 0.08em;
  }
  .race-grid thead th:first-child { text-align: left; padding-left: 14px; }
  .race-grid tbody tr { border-bottom: 1px solid var(--line); }
  .race-grid tbody tr:last-child { border-bottom: none; }
  .mcell {
    position: sticky; left: 0; background: var(--surface); z-index: 2;
    padding: 10px 12px 10px 14px !important; min-width: 172px; max-width: 215px;
    border-right: 1px solid var(--line);
  }
  .mcell .vname {
    font-family: 'Barlow Condensed'; font-weight: 700; font-size: 1.04rem;
    display: flex; align-items: center; gap: 7px;
  }
  .mcell .vname .st { font-size: 0.6rem; color: var(--text-3); font-family: 'Barlow'; font-weight: 800; }
  .mcell .vmeta { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; align-items: center; }
  .cell {
    text-align: center; min-width: 64px; padding: 7px 3px !important;
    cursor: pointer; transition: filter 0.12s; position: relative;
  }
  .cell:hover { filter: brightness(1.25); }
  :root[data-theme="light"] .cell:hover { filter: brightness(0.96); }
  .cell .in { border-radius: 7px; padding: 4px 2px 5px; margin: 0 2px; }
  .cell .t { font-size: 0.78rem; font-weight: 700; color: var(--text-2); }
  .cell .sub { font-size: 0.64rem; margin-top: 1px; min-height: 14px; display:flex; align-items:center; justify-content:center; gap:3px; }
  /* heat tints — the core idea: cell colour = our confidence */
  .cell.heat-hot .in    { background: var(--hot-dim);  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hot) 45%, transparent); }
  .cell.heat-hot .t     { color: var(--hot); }
  .cell.heat-high .in   { background: var(--blue-dim); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--blue) 35%, transparent); }
  .cell.heat-high .t    { color: var(--blue); }
  .cell.heat-strong .in { background: var(--strong-dim); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--strong) 30%, transparent); }
  .cell.heat-strong .t  { color: var(--strong); }
  .cell.done .t { color: var(--text-3); font-weight: 500; }
  .cell .sub .cell-tier { font-size: 0.48rem; font-weight: 800; letter-spacing: 0.03em; margin-left: 3px; }
  .cell .sub .cell-tier.hot    { color: var(--hot); }
  .cell .sub .cell-tier.high   { color: var(--blue); }
  .cell .sub .cell-tier.strong { color: var(--strong); }
  .cell.blank { cursor: default; }
  .cell.blank:hover { filter: none; }
  .heat-legend {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    font-size: 0.7rem; color: var(--text-3); margin-top: 10px; padding: 0 2px;
  }

  /* ── View B: Race day feed ──────────────────────────────── */
  .venue-chips {

  }
  .venue-chips::-webkit-scrollbar { display: none; }
  .vchip {
    background: var(--surface); border: 1px solid var(--line); color: var(--text-2);
    border-radius: 999px; padding: 5px 13px; font-size: 0.76rem; font-weight: 700;

  .vchip.on { background: var(--surface-2); border-color: var(--text-3); color: var(--text); font-weight: 800; }

  .hero {
    background: var(--surface); border: 1px solid color-mix(in srgb, var(--mint) 45%, var(--line));
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 18px;
    cursor: pointer;

  .hero-top .meta { font-size: 0.74rem; color: var(--text-3); }
  .hero-top .clockbox { margin-left: auto; text-align: right; flex-shrink: 0; }
  .hero-top .clock { font-family: 'Barlow Condensed'; font-weight: 800; font-size: 1.7rem; line-height: 1; }
  .hero-top .cd { font-size: 0.7rem; font-weight: 800; color: var(--mint); }
  .hero-top .cd.big {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px;
    line-height: 1; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .hero-top .wt { font-size: 0.68rem; color: var(--text-3); font-weight: 700; }
  .hero-picks { padding: 6px 18px 12px; }
  .hero-note { padding: 0 18px 14px; font-size: 0.72rem; color: var(--text-3); }
  .hero-field { padding: 0 18px 12px; }
  .hero-field .field-toggle { border-top: 1px dashed var(--line); }
  .hrunner { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .hrunner:last-child { border-bottom: none; }
  .hrunner .saddle {
    width: 28px; height: 28px; border-radius: 7px; background: var(--surface-2);
    display: grid; place-items: center; font-weight: 800; font-size: 0.82rem; flex-shrink: 0;
    font-family: 'Barlow Condensed';
  }

  .hrunner .nm { flex: 1; min-width: 0; }
  .hrunner .nm .h { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hrunner .nm .j { font-size: 0.68rem; color: var(--text-3); }
  .hrunner .hodds { font-weight: 800; font-size: 0.82rem; flex-shrink: 0; }

  .feed-sec-title {
    font-family: 'Barlow Condensed'; font-weight: 700; font-size: 1rem;
    color: var(--text-3); letter-spacing: 0.1em; text-transform: uppercase;
    margin: 20px 2px 10px;
  }
  .jcard {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 15px; margin-bottom: 9px;
    display: grid; grid-template-columns: 104px 1fr auto; gap: 4px 14px; align-items: center;
    cursor: pointer; transition: border-color 0.15s; box-shadow: var(--shadow);
  }
  .jcard:hover { border-color: var(--mint); }
  .jcard .when { text-align: center; grid-row: span 2; }
  .jcard .when .clock { font-family: 'Barlow Condensed'; font-weight: 800; font-size: 1.3rem; line-height: 1; }
  .jcard .when .cd { font-size: 0.64rem; font-weight: 800; margin-top: 3px; color: var(--text-3); }
  /* countdown colour ladder: green while far out → amber inside the hour →
     pulsing red pill at ≤15m */
  .jcard .when .cd.far,  .brace .rt .cd.far,  .hero-top .cd.far  { color: var(--mint); }
  .jcard .when .cd.hour, .brace .rt .cd.hour, .hero-top .cd.hour { color: var(--amber); }
  .jcard .when .cd.soon, .brace .rt .cd.soon, .hero-top .cd.soon {
    display: inline-block; background: var(--red); color: #fff;
    border-radius: 5px; padding: 1px 6px; font-weight: 800;
    animation: soonpulse 1.6s ease-in-out infinite;
  }
  @keyframes soonpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  @media (prefers-reduced-motion: reduce) { .jcard .when .cd.soon, .brace .rt .cd.soon, .hero-top .cd.soon { animation: none; } }
  .jcard .where {
    font-family: 'Barlow Condensed'; font-weight: 700; font-size: 1.05rem;
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap; min-width: 0;
  }
  .jcard .where .rmeta { font-family: 'Barlow'; font-size: 0.7rem; color: var(--text-3); font-weight: 500; }
  .jcard .chips { display: flex; gap: 5px; flex-wrap: wrap; align-self: start; }
  .jcard .pick { grid-row: span 2; text-align: right; min-width: 140px; }
  .jcard .pick .pname {
    font-weight: 700; font-size: 0.84rem; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 160px; margin-left: auto; margin-bottom: 5px;
  }
  .jcard .pick .pname { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .jcard .pick .pname .pn-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jcard .pick .pname .pk-odds { flex-shrink: 0; font-size: 0.76rem; font-weight: 800; color: var(--text-2); }
  .jcard .pick .pname.ghost { color: var(--text-3); font-weight: 500; font-size: 0.74rem; }
  .jcard.settled { opacity: 0.75; }
  .jcard.settled:hover { opacity: 1; }
  @media (max-width: 640px) {
    .jcard { grid-template-columns: 78px 1fr; }
    .jcard .when .cd.big { font-size: 21px; }
    .jcard .pick { grid-row: auto; grid-column: 2; text-align: left; margin-top: 4px; }
    .jcard .pick .pname { margin-left: 0; justify-content: flex-start; }
    .jcard .when { grid-row: span 3; }
    /* smaller time numerals on mobile */

    .hero-top .clock { font-size: 1.3rem; }
    /* heat grid: slim the meeting column — smaller surface chip, weather
       icon wraps to its own line under the chip */

    .mcell .vname { font-size: 0.88rem; }
    .mcell .vmeta { flex-direction: column; align-items: flex-start; gap: 3px; }
    .mcell .vmeta .chip { font-size: 0.54rem; padding: 1px 5px; letter-spacing: 0.02em; }
    .mcell .wx { font-size: 0.66rem; }
  }

  /* ── View C: Meetings rail ──────────────────────────────── */
  .rail-layout { display: grid; grid-template-columns: 285px 1fr; gap: 16px; align-items: start; }
  .rail {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; position: sticky; top: 108px;
    max-height: calc(100vh - 130px); overflow-y: auto;
  }
  .rail-item {
    width: 100%; text-align: left; background: none; border: none; color: var(--text);
    padding: 12px 14px; border-bottom: 1px solid var(--line); display: block;
    transition: background 0.12s; border-left: 3px solid transparent;
  }
  .rail-item:last-child { border-bottom: none; }
  .rail-item:hover { background: var(--surface-2); }
  .rail-item.on { background: var(--surface-2); border-left-color: var(--mint); }
  .rail-item .rv { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 1.08rem; display: flex; align-items: center; gap: 7px; }
  .rail-item .rv .st { font-size: 0.6rem; color: var(--text-3); font-family: 'Barlow'; font-weight: 800; }
  .rail-item .rmeta { display: flex; gap: 5px; margin-top: 5px; align-items: center; flex-wrap: wrap; }
  .rail-item .prog { font-size: 0.66rem; color: var(--text-3); font-weight: 700; }
  .rstat { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; font-size: 0.7rem; font-weight: 700; }
  .rs-w { color: #10b981; }
  .rs-p { color: #60a5fa; }
  .rs-c { color: var(--gold); }
  .rs-c.hi { color: #10b981; }
  .rail-item .progbar { height: 3px; border-radius: 2px; background: var(--surface-2); margin-top: 7px; overflow: hidden; }
  .rail-item .progbar .pf { height: 100%; background: var(--mint); border-radius: 2px; }

  .board {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .board-head { padding: 15px 18px 12px; border-bottom: 1px solid var(--line); }
  .board-head .t { font-family: 'Barlow Condensed'; font-weight: 800; font-size: 1.5rem; display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .board-head .t .st { font-size: 0.72rem; color: var(--text-3); font-family: 'Barlow'; font-weight: 800; }
  .board-head .chips { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .brace {
    display: grid; grid-template-columns: 30px 60px 1fr auto; gap: 12px; align-items: center;
    padding: 11px 18px; border-bottom: 1px solid var(--line); cursor: pointer;
    transition: background 0.12s;
  }
  .brace:last-child { border-bottom: none; }
  .brace:hover { background: var(--surface-2); }
  .brace .rn { font-family: 'Barlow Condensed'; font-weight: 800; font-size: 1rem; color: var(--text-3); }
  .brace .rt { font-size: 0.8rem; font-weight: 700; }
  .brace .rt .cd { display: block; font-size: 0.62rem; color: var(--text-3); font-weight: 700; }
  .brace .rt .cd.soon { margin-top: 2px; }
  .brace .mid { min-width: 0; }
  .brace .mid .pk { font-weight: 700; font-size: 0.86rem; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .brace .mid .pk .pk-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brace .mid .pk .chip { flex-shrink: 0; }
  .brace .mid .pk .pk-odds { flex-shrink: 0; font-size: 0.78rem; font-weight: 800; color: var(--text-2); }
  .chip.cf { background: var(--gold-dim, rgba(245,200,66,0.14)); color: var(--gold, #f5c842); flex-shrink: 0; }
  .chip.tu { background: var(--surface-2); color: var(--text-2); flex-shrink: 0; }
  .chip.quin { background: rgba(184,192,204,0.16); color: #c7ccd6; flex-shrink: 0; }
  .chip.tri  { background: rgba(205,127,50,0.16); color: #d9955a; flex-shrink: 0; }
  .chip.ff   { background: rgba(142,169,255,0.16); color: #8ea9ff; flex-shrink: 0; }
  .brace .mid .sub .wp { font-weight: 800; color: var(--gold, #f5c842); }
  .brace .mid .sub .pp { font-weight: 800; color: var(--blue); }
  .brace .mid .pk.ghost { color: var(--text-3); font-weight: 500; font-size: 0.76rem; }
  .brace .mid .sub { font-size: 0.68rem; color: var(--text-3); margin-top: 1px; }
  .brace .right { display: flex; align-items: center; gap: 10px; }  /* desktop: odds beside bars */
  @media (max-width: 860px) {
    .rail-layout { grid-template-columns: 1fr; }
    .rail { position: static; max-height: none; display: flex; overflow-x: auto; border-radius: 12px; }
    .rail-item { min-width: 180px; border-bottom: none; border-right: 1px solid var(--line); border-left: none; border-top: 3px solid transparent; }
    .rail-item.on { border-top-color: var(--mint); border-left: none; }
    .brace { grid-template-columns: 26px 56px 1fr auto; padding: 11px 13px; gap: 8px; }
  }

  /* ── Race drawer ────────────────────────────────────────── */

  }

    position: fixed; z-index: 150; background: var(--surface);

    display: flex; flex-direction: column;
    left: 0; right: 0; bottom: 0; border-radius: 18px 18px 0 0;

  }

  .runner .odds { text-align: right; flex-shrink: 0; }

  .dw-result { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 13px; }

  .pick-tag { background: var(--surface-2); color: var(--text-2); font-size: 0.56rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.06em; }

  @media (min-width: 641px) {

  function venueBadge(name) {
    const b = VENUE_BADGES[name];
    if (!b || !b.badge || b.badge === 'avoid') return '';

  function wallTime(iso) {            // VIEWER-LOCAL post time (2026-07-30)
    // The ISO carries the track's UTC offset (WA +08:00, AEST +10:00), so
    // parse the real instant and render in the BROWSER's timezone — a WA race
    // at 12:27+08:00 shows 2:27pm to an AEST viewer, matching their clock and
    // the countdown. Falls back to raw digits only if there's no offset.
    if (!iso) return '—';
    if (/T00:00(:00)?/.test(iso)) return 'TBA';

    const t = epochOf(iso);
    if (t == null) return { label: '', soon: false, past: false, urg: '' };
    const diff = t - Date.now();
    if (diff <= 0) return { label: diff > -35 * 60000 ? 'resulting' : '', soon: false, past: true, urg: '' };
    const m = Math.floor(diff / 60000);
    if (m < 60) return { label: `${m}m`, soon: m <= 15, past: false, urg: m <= 15 ? 'soon' : 'hour' };
    const h = Math.floor(m / 60);
    if (h < 24) return { label: `${h}h ${m % 60}m`, soon: false, past: false, urg: 'far' };
    return { label: `${Math.floor(h / 24)}d`, soon: false, past: false, urg: 'far' };
  }

  function goingInfo(tc) {
    // Category word + rating number (e.g. "Good 4" → "SURFACE: GOOD 4").
    const s = (tc || '').trim();
    const l = s.toLowerCase();
    if (!s) return { cls: 'going-unknown', label: 'SURFACE: TBC' };
    const num = (s.match(/\d+/) || [''])[0];
    const suf = num ? ' ' + num : '';
    if (l.startsWith('heavy')) return { cls: 'going-heavy', label: 'SURFACE: HEAVY' + suf };
    if (l.startsWith('soft'))  return { cls: 'going-soft',  label: 'SURFACE: SOFT' + suf };
    if (l.startsWith('synth')) return { cls: 'going-synth', label: 'SURFACE: SYNTHETIC' + suf };
    if (l.startsWith('firm'))  return { cls: 'going-good',  label: 'SURFACE: FIRM' + suf };
    if (l.startsWith('good'))  return { cls: 'going-good',  label: 'SURFACE: GOOD' + suf };
    return { cls: 'going-unknown', label: `SURFACE: ${s.split(/\s/)[0].toUpperCase()}${suf}` };
  }
  const isOffGoing = tc => /^(soft|heavy)/i.test((tc || '').trim());

  function streamFor(state) {

  function tierOf(winProb, off) {
    if (winProb == null) return null;
    const p = winProb * 100;
    if (p >= 46 && !off) return { cls: 'tier-hot',    dot: 'hot',    heat: 'heat-hot',    label: '🔥 HOT' };
    if (p >= 36 && !off) return { cls: 'tier-high',   dot: 'high',   heat: 'heat-high',   label: '⚡ HIGH' };
    if (p >= 30)         return { cls: 'tier-strong', dot: 'strong', heat: 'heat-strong', label: 'STRONG' };
    return null;
  }

  // Outcome class for settled races — drives the green/amber/red borders.
  const resCls = r => r.model_correct === true ? 'res-win'
    : (r.model_correct === false && r.model_placed === true) ? 'res-place'
    : r.model_correct === false ? 'res-miss' : '';
  function resultMark(r) {

    if (r.model_correct === false && r.model_placed === true) return '<span class="res place">✓</span>';

  // from 30% confidence, place % (blue) from 50%; otherwise dimmed.
  function barsHtml(winP, placeP) {
    const w = pc(winP), p = pc(placeP);
    if (w == null) return `<div style="font-size:0.68rem;color:var(--text-3)">No prediction yet</div>`;
    // Big centred WIN/PLACE stat — the card's focal number, like the old edge card.
    return `<div class="dual-stat-row">
      <div class="ds"><span class="ds-num num ${w >= 30 ? 'v-win' : 'v-dim'}">${w}%</span><span class="ds-lbl">win</span></div>
      ${p != null ? `<div class="ds"><span class="ds-num num ${p >= 50 ? 'v-plc' : 'v-dim'}">${p}%</span><span class="ds-lbl">place</span></div>` : ''}

  async function fetchRunners(raceId) {
    // Cache only non-empty successes — caching a transient failure as []
    // made every later click show 'no predictions' for that race.
    if (S.runners[raceId] && S.runners[raceId].length) return S.runners[raceId];
    try {
      const res = await fetch(`${API}/api/races/${raceId}`);

  // Place play — last-2 races at country meetings are excluded from Sharp

  function placeChip(p) {
    const pp = p.place_play;
    if (!pp || !pp.paid_place_pct) return '';
    const tip = `Weak late country field — our win pick is a coin-flip here, so it's not a Sharp win bet. But it still PLACES (pays) about ${pp.paid_place_pct}% of the time — consider a place bet instead.`;
    return `<span class="chip place-play" tabindex="0" onclick="event.stopPropagation()" data-tip="${esc(tip)}">🅿️ PLACE ~${pp.paid_place_pct}% <span class="chip-i">ⓘ</span></span>`;

  function favChip(p) {
    if (p.model_pct == null || p.rank2_pct == null) return '';
    const gap = p.model_pct - p.rank2_pct;
    if (gap >= 5) return '<span class="chip cf">👑 CLEAR FAV</span>';
    if (gap < 2 && p.model_pct >= 25) return '<span class="chip tu">⚖️ TOSS-UP</span>';

  // Clear-exotic chips: each group stands clear of the next runner by ≥4pp —
  // quinella (top-2 vs 3rd), trifecta (top-3 vs 4th), first-4 (top-4 vs 5th).
  // From p.field (rank-sorted win% per runner), mirroring Lounge / Hot Seat.
  function exoticClearChips(p) {
    const f = (p.field || []).filter(r => !r.scratched && r.win_pct != null);
    const GAP = 4;
    let out = '';
    if (f.length >= 3 && (f[1].win_pct - f[2].win_pct) >= GAP) out += '<span class="chip quin">🥈 CLEAR QUINELLA</span>';
    if (f.length >= 4 && (f[2].win_pct - f[3].win_pct) >= GAP) out += '<span class="chip tri">🥉 CLEAR TRIFECTA</span>';
    if (f.length >= 5 && (f[3].win_pct - f[4].win_pct) >= GAP) out += '<span class="chip ff">🎖️ CLEAR FIRST-4</span>';
    return out;
  }
  function tierChip(p) {

    else if (ct === 'high' || (ct == null && conf >= 36 && !p.going_offtrack)) chip = '<span class="chip tier-high2">⚡ HIGH CONFIDENCE</span>';

  /* ── loaders ── */
  async function loadEdge() {

  async function loadTodayResults() {
    try {
      const r = await fetch(API + '/api/edge/yesterday?date=' + aestToday());

  // Fill result gaps from /api/edge's own annotations. The /api/edge/yesterday
  // feed only carries picks >=29.5% win, so a sub-threshold pick (e.g. a 25%
  // Sharp pick) had no result there and showed "pending" — even though
  // /api/edge already knows won/actual_position. Don't clobber a concrete
  // feed result; only fill missing / not-yet-seeded ones. (DIETRICH gap.)
  function seedResultsFromPicks() {
    for (const p of (E.picks || [])) {
      const has = p.won === true || p.won === false || p.placed === true || p.placed === false || typeof p.actual_position === 'number';
      if (!has) continue;
      const cur = E.resultsMap[p.race_id];
      if (cur && !cur.no_result && (cur.winner === true || cur.placed === true || cur.position != null)) continue;
      E.resultsMap[p.race_id] = {
        winner: p.won === true, placed: p.placed === true, position: p.actual_position,
        sp: p.sp, scratched: p.cancelled || false, no_result: false,
      };

  }
  async function loadResultsDate(dateStr) {

  /* ── header pieces ── */
  // Single source of truth for the on-screen settled summary: counts the exact
  // picks the cards render (same applyMode + resultsMap + Sharp mode), so the
  // date-selector label and the stat strip are computed once and can never
  // disagree. Returns null when there is nothing settled to show.
  function edgeVisibleStats() {
    let settled, w, pl;
    if (E.view === 'res') {
      if (!E.resData || E.resData._date !== E.resDate) return null;
      const picks = applyMode(E.resData.picks || []).picks;
      settled = picks.filter(p => !p.scratched && !p.no_result);
      w = settled.filter(p => p.winner).length;
      pl = settled.filter(p => p.placed && !p.winner).length;
    } else {
      const picks = applyMode(E.picks || []).picks;
      settled = picks.filter(p => { const r = E.resultsMap[p.race_id]; return r && !r.scratched && !r.no_result && (r.winner === true || r.placed === true || r.position != null); });
      w = settled.filter(p => E.resultsMap[p.race_id].winner).length;
      pl = settled.filter(p => { const r = E.resultsMap[p.race_id]; return r.placed && !r.winner; }).length;
    }
    if (!settled.length) return null;
    return { settled: settled.length, w, pl };
  }
  function renderStats() {
    const el = document.getElementById('statStrip');
    if (E.parent !== 'wins') { el.innerHTML = ''; return; }
    const s = edgeVisibleStats();

      <div class="ds-divider"></div>

  function renderControls() {

    if (E.paywall) E.mode = 'all';   // non-members can't filter — force off

    el.querySelectorAll('[data-vw]').forEach(b => b.onclick = () => { E.view = b.dataset.vw; renderControls(); renderFeed(); });
    el.querySelectorAll('[data-md]').forEach(b => b.onclick = () => { E.mode = b.dataset.md; localStorage.setItem('edgeModeNew', E.mode); loadEdgePerf(); renderControls(); renderFeed(); });
    el.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { E.sort = b.dataset.st; localStorage.setItem('edgeSortNew', E.sort); renderControls(); renderFeed(); });
    const eb = el.querySelector('#edgeBack'), ef = el.querySelector('#edgeFwd');

  /* ── pick card ── now renders via the shared window.PickCard component.

  function card(p, res) {

      triStrip: () => triStrip(p),

        ? `<div class="edge-line"><span class="${pk.edge_pct >= 0 ? 'pos' : 'neg'}">${pk.edge_pct >= 0 ? 'Model beats market by ' + pk.edge_pct + 'pt' : 'Market prefers by ' + Math.abs(pk.edge_pct) + 'pt'}</span><span class="sub num">model ${pk.win_pct}% vs market ${pk.market_implied_pct}%</span></div>`
        : '',
    });
  }
  function _cardOLD(p, res) {
    const now = Date.now();
    const jump = p.scheduled_time ? new Date(p.scheduled_time).getTime() : null;
    const isPast = jump && jump < now;
    const cd = countdown(p.scheduled_time);
    // SB-style results odds: winner -> win SP, placed -> place odds, missed -> none.
    const settledRes = isPast && res && !res.scratched && !res.no_result;
    let displayOdds, oddsLbl;
    if (settledRes && res.winner) { displayOdds = res.sp; oddsLbl = 'SP'; }
    else if (settledRes && res.placed) { displayOdds = res.place_odds || null; oddsLbl = 'place'; }
    else if (settledRes) { displayOdds = null; oddsLbl = ''; }
    else { displayOdds = p.best_available_odds || (res && res.sp); oddsLbl = 'best odds'; }
    const oddsCls = displayOdds >= 3 ? 'great' : displayOdds >= 2.5 ? 'good' : '';
    const hasResult = res && !res.scratched && !res.no_result && (res.winner === true || res.placed === true || res.position != null);
    const outcome = hasResult ? (res.winner ? 'res-win' : res.placed ? 'res-place' : 'res-miss') : '';
    const dim = (p.cancelled || (res && res.scratched)) ? 'opacity:0.55;filter:grayscale(0.4);' : '';
    const streak = (() => {
      const s = p.streak;
      if (!s || isPast) return '';
      if (s.badge === 'hot') return '<span class="streak hotk" title="Won their most recent race — +18pp historical win-rate lift">🔥 WON LAST</span>';
      if (s.badge === 'warm') return '<span class="streak warm" title="Placed top-3 last start — +11pp lift">🌤 PLACED LAST</span>';
      return '';
    })();
    const posLbl = res && res.position ? (res.position === 2 ? '2nd' : res.position === 3 ? '3rd' : res.position < 90 ? res.position + 'th' : '') : '';
    let verdict = '';
    if (p.cancelled) verdict = '<div class="verdict-line"><span class="vn">⚠️ Race abandoned</span></div>';
    else if (res && res.scratched) verdict = '<div class="verdict-line"><span class="vn">Scratched — no bet</span></div>';
    else if (isPast && hasResult) {
      const winner = (!res.winner && res.winner_name) ? `<span class="winner">Winner: <b>${esc(res.winner_name)}</b></span>` : '';
      if (res.winner) {
        verdict = `<div class="verdict-line"><span class="vw">✓ Won${res.sp ? ' at $' + res.sp.toFixed(2) : ''}</span></div>`;
      } else if (res.placed) verdict = `<div class="verdict-line"><span class="vp">~ Placed${posLbl ? ' ' + posLbl : ''}</span>${winner}</div>`;
      else verdict = `<div class="verdict-line"><span class="vl">✗ Did not place${posLbl ? ' (' + posLbl + ')' : ''}</span>${winner}</div>`;
    } else if (isPast) verdict = '<div class="verdict-line"><span class="vn">Result pending…</span></div>';
    const edgeLine = (!isPast && p.edge_pct != null && displayOdds)
      ? `<div class="edge-line"><span class="${p.edge_pct >= 0 ? 'pos' : 'neg'}">${p.edge_pct >= 0 ? 'Model beats market by ' + p.edge_pct + 'pt' : 'Market prefers by ' + Math.abs(p.edge_pct) + 'pt'}</span><span class="sub num">model ${p.model_pct}% vs market ${p.market_implied_pct}%</span></div>`
      : '';
    const l10 = p.form_figures
      ? ` · <b class="ff">form ${p.form_figures}</b>`
      : ((p.wins_last_10 != null && p.places_last_10 != null)
        ? ` · last ${p.starts_last_10 && p.starts_last_10 < 10 ? p.starts_last_10 : 10}: ${p.wins_last_10}W/${p.places_last_10} top-3` : '');
    return `<div class="jcard pcard ${outcome} ${!isPast && (p.confidence_tier === 'hot' || p.hot_pick) ? 'hot' : ''} ${isPremium(p) ? 'prem' : ''}" style="${dim}" data-open="${esc(p.race_id)}" data-horse="${esc(p.horse_name)}">
      <div class="when">
        ${isPast
          ? `<div class="clock num">${wallTime(p.scheduled_time)}</div><div class="cd">${hasResult ? (res.winner ? '<span class="res win">✓</span>' : res.placed ? '<span class="res place">✓' + (posLbl ? ' ' + posLbl : '') + '</span>' : '<span class="res miss">✗</span>') : ''}</div>`
          : `<div class="cd big ${cd.urg || ''}">${cd.label || ''}</div><div class="wt num">${wallTime(p.scheduled_time)}</div>`}
      </div>
      <div class="mid">
        <div class="pk-venue">${esc(p.venue)} <b>R${p.race_number}</b>${venueBadgeOnce(p.venue)}</div>
        <div class="pk-horse">${esc(p.horse_name)}${streak}${!isPast ? placeChip(p) : ''}</div>
        <div class="pk-sub num">${[p.distance ? p.distance + 'm' : '', p.barrier ? 'B' + p.barrier : '', p.weight ? p.weight + 'kg' : ''].filter(Boolean).join(' · ')}${l10}</div>
        <div class="pk-sub">${p.jockey ? 'J: ' + esc(p.jockey) : ''}${p.trainer ? (p.jockey ? ' · ' : '') + 'T: ' + esc(p.trainer) : ''}</div>
        <div class="pk-chips">${tierChip(p)}${isPremium(p) ? '<span class="chip prem">💎 PREMIUM</span>' : ''}${sharpOf(p) ? '<span class="chip sharp">🎯 SHARP</span>' : ''}${!isPast ? favChip(p) : ''}${!isPast ? exoticClearChips(p) : ''}${p.sportsbet_available === false ? '<span class="chip nosb">🚫 Not on Sportsbet</span>' : ''}</div>
      </div>
      <div class="right">
        ${barsHtml((p.model_pct || 0) / 100, p.place_probability != null ? p.place_probability / 100 : null)}
        ${displayOdds ? `<div class="odds-pill ${oddsCls}"><b class="num">$${(+displayOdds).toFixed(2)}</b>${oddsLbl}</div>` : '<div class="odds-pill">TBA</div>'}
        ${settledRes && res.winner && res.place_odds ? `<div class="odds-pill"><b class="num" style="font-size:1rem;color:var(--blue)">$${(+res.place_odds).toFixed(2)}</b>place</div>` : ''}
        ${!isPast ? `<div class="spark-slot" id="spark-${p.race_id.replace(/[^a-z0-9]/gi, '-')}"></div>` : ''}
      </div>
      ${edgeLine}${verdict}${triStrip(p)}
    </div>`;
  }

  // TrifectaPro / First 4 strip — per-pick p.trifecta (ported from the Trad edge).
  function triStrip(p) {
    const tri = p.trifecta;
    if (!tri || !tri.legs || !tri.legs.length) return '';
    const posLabel = pos => pos === 1 ? '1st' : pos === 2 ? '2nd' : pos === 3 ? '3rd' : pos === 4 ? '4th' : pos ? pos + 'th' : '—';
    const legHtml = l => {
      const pos = l.position;
      const inTop = pos && pos <= (tri.first_four ? 4 : 3) && !l.scratched;
      const col = l.scratched ? 'var(--text-3)' : pos != null ? (inTop ? 'var(--mint)' : 'var(--red)') : 'var(--text-2)';
      return `<span style="color:${col};font-weight:700">${l.tab_number || '?'}</span>`
        + (l.place_pct != null ? `<span style="color:var(--text-3);font-size:0.65rem"> (${l.place_pct}%)</span>` : '')
        + (pos != null ? `<span style="color:${col};font-size:0.7rem"> ${posLabel(pos)}</span>` : '');
    };
    const dot = ' <span style="color:var(--line)">·</span> ';
    const triNums = tri.legs.map(legHtml).join(dot);
    const triNames = tri.legs.map(l => esc(l.horse_name)).join(' · ');
    const triPct = tri.combined_pct != null ? `<span class="tri-combined">~${tri.combined_pct}%</span>` : '';
    const vd = tri.hit != null ? (tri.hit ? '<span class="tri-hit">✓ HIT</span>' : '<span class="tri-miss">✗ Missed</span>') : '';
    const ffPart = (tri.first_four && tri.first_four.length) ? (() => {
      const ffNums = tri.first_four.map(legHtml).join(dot);
      const ffNames = tri.first_four.map(l => esc(l.horse_name)).join(' · ');
      const ffPct = tri.first_four_combined_pct != null ? `<span class="tri-combined">~${tri.first_four_combined_pct}%</span>` : '';
      const ffVd = tri.first_four_hit != null ? (tri.first_four_hit ? '<span class="tri-hit">✓ HIT</span>' : '<span class="tri-miss">✗ Missed</span>') : '';
      return `<div class="tri-ff-row"><span class="tri-ff-label">First 4</span><span class="tri-ff-legs">${ffNums}</span>${ffPct}${ffVd}<span class="tri-ff-names">${ffNames}</span></div>`;
    })() : '';
    return `<div class="trifecta-strip">`
      + `<span class="tri-label">🎯 Trifecta<span class="tier-marker tier-pro">Pro</span></span>`
      + `<span class="tri-legs">${triNums}</span>${triPct}${vd}`
      + `<span class="tri-names">${triNames}</span>${ffPart}</div>`;
  }

  /* ── feeds ── */
  function applyMode(picks) {
    if (E.mode !== 'sharp') return { picks, fallback: false };
    const sp = picks.filter(sharpOf);
    if (!sp.length && picks.length) return { picks, fallback: true };
    return { picks: sp, fallback: false };
  }
  function renderFeed() {
    const el = document.getElementById('feed');
    _edgeBadgeSeen = new Set();
    // Publish gate: hold TODAY's picks (live view) behind a splash until ready.
    // Past results (E.view==='res') are exempt.
    if (E.view === 'up') {
      if (!TODAY_CHECKED) {
        checkTodayGate(renderFeed);
        el.innerHTML = '<div class="loading"><div class="spin"></div>Loading…</div>';
        return;
      }
      if (!todayGateReady()) {
        const ss = document.getElementById('statStrip'); if (ss) ss.innerHTML = '';
        el.innerHTML = todaySplashHTML();
        startTodayPoll(renderFeed);
        return;
      }
      stopTodayPoll();
    } else {
      stopTodayPoll();
    }
    if (E.parent === 'exotics') return renderExotics(el);
    if (E.view === 'res') return renderResults(el);
    if (!E.picks) { el.innerHTML = '<div class="loading"><div class="spin"></div>Loading picks…</div>'; return; }
    const m = applyMode(E.picks);
    const picks = m.picks;
    if (!picks.length) {
      el.innerHTML = `<div class="empty"><div class="big">🔍</div>No high-confidence picks right now.<br>The model hasn't found races at ≥${E.threshold}% confidence — check back after the morning update.</div>`;
      return;
    }
    const byDate = {};
    picks.forEach(p => (byDate[p.date] = byDate[p.date] || []).push(p));
    const today = aestToday(), tomorrow = aestToday(1);
    let html = (E.paywall && E.paywall.trophy ? window.PickCard.trophyBanner(E.paywall.trophy) : '')
      + (E.paywall && E.paywall.active ? window.PickCard.paywallBanner(E.paywall) : '');
    html += (m.fallback && !E.paywall) ? '<div class="banner-sharp"><b>🎯 No Sharp picks available</b><br>Sharp thresholds were not met for any race in the window — showing all picks.</div>' : '';
    Object.keys(byDate).sort().forEach(d => {
      const now = Date.now();
      const ps = [...byDate[d]].sort((a, b) => {
        // Free teaser pick is always pinned to the top of the list.
        const ate = a.is_teaser ? 1 : 0, bte = b.is_teaser ? 1 : 0;
        if (ate !== bte) return bte - ate;
        if (E.sort === 'next') {
          const at = a.scheduled_time ? new Date(a.scheduled_time).getTime() : 9e15;
          const bt = b.scheduled_time ? new Date(b.scheduled_time).getTime() : 9e15;
          const au = at > now, bu = bt > now;
          if (au !== bu) return au ? -1 : 1;
          return au ? at - bt : bt - at;
        }
        const ap = isPremium(a) ? 1 : 0, bp = isPremium(b) ? 1 : 0;
        if (bp !== ap) return bp - ap;
        return (b.model_pct || 0) - (a.model_pct || 0);
      });
      const settled = ps.filter(p => { const r = E.resultsMap[p.race_id]; return r && !r.scratched && !r.no_result && (r.winner === true || r.placed === true || r.position != null); });
      const w = settled.filter(p => E.resultsMap[p.race_id].winner).length;
      const pl = settled.filter(p => { const r = E.resultsMap[p.race_id]; return r.placed && !r.winner; }).length;
      const label = d === today ? 'Today' : d === tomorrow ? 'Tomorrow' : fmtDate(d);
      html += `<div class="day-head"><span class="t">${label}</span><span class="c num">${ps.length} pick${ps.length === 1 ? '' : 's'}</span>
        ${settled.length ? `<span class="pnl num"><b>${settled.length}</b> settled · <b style="color:var(--mint)">${w}</b> won (${Math.round(w / settled.length * 100)}%)${pl ? ` · <b style="color:var(--amber)">${pl}</b> more placed (${Math.round((w + pl) / settled.length * 100)}% placed incl. wins)` : ''}</span>` : ''}</div>`;
      html += ps.map(p => card(p, E.resultsMap[p.race_id])).join('');
    });
    el.innerHTML = html;
    bindCards(el);
    window.PickCard.fetchSparklines(picks);   // streaming odds (shared)
  }
  function renderResults(el) {
    if (!E.resDate) E.resDate = aestToday(-1);
    const nav = '';  // date nav now lives in the controls bar (edgeDateBarHTML)
    if (!E.resData || E.resData._date !== E.resDate) {
      el.innerHTML = nav + '<div class="loading"><div class="spin"></div>Loading results…</div>';
      bindResNav(el);
      const want = E.resDate;
      loadResultsDate(want)
        .then(() => { if (E.resDate === want && E.resData) { E.resData._date = want; renderResults(document.getElementById('feed')); } })
        .catch(e => { if (E.resDate === want) { el.innerHTML = nav + `<div class="empty"><div class="big">⚠️</div>Could not load results — ${esc(e.message)}</div>`; bindResNav(el); } });
      return;
    }
    const m = applyMode(E.resData.picks || []);
    const picks = m.picks;
    const cards = picks.map(p => card(p, p)).join('')
      || `<div class="empty"><div class="big">🐎</div>No ${E.mode === 'sharp' ? 'Sharp ' : ''}picks recorded for this date.</div>`;
    el.innerHTML = nav + (m.fallback && !E.paywall ? '<div class="banner-sharp"><b>🎯 No Sharp picks this day</b> — showing all picks.</div>' : '') + cards;
    renderControls();   // rebuild the date-bar + strip from the now-loaded data so both match
    bindResNav(el);
    bindCards(el);
  }
  function bindResNav(el) {
    const pv = el.querySelector('#resPrev'), nx = el.querySelector('#resNext');
    const shift = days => {
      E.resDate = new Date(new Date(E.resDate + 'T12:00:00').getTime() + days * 86400000).toLocaleDateString('en-CA');
      E.resData = null;
      renderResults(document.getElementById('feed'));
    };
    if (pv) pv.onclick = () => shift(-1);
    if (nx) nx.onclick = () => { if (!nx.disabled) shift(1); };
  }
  function renderExotics(el) {
    if (!E.exotics) {
      el.innerHTML = '<div class="loading"><div class="spin"></div>Loading exotic picks…</div>';
      loadExotics().then(() => renderExotics(document.getElementById('feed')))
        .catch(e => { el.innerHTML = `<div class="empty"><div class="big">⚠️</div>Could not load exotics — ${esc(e.message)}</div>`; });
      return;
    }
    const picks = E.exotics.picks || [];
    if (!picks.length) { el.innerHTML = '<div class="empty"><div class="big">🎰</div>No exotic picks in the current window.</div>'; return; }
    el.innerHTML = picks.map(p => {
      const cd = countdown(p.scheduled_time);
      const isPast = p.scheduled_time && new Date(p.scheduled_time).getTime() < Date.now();
      const tier = p.tier === 'hot' ? '<span class="chip tier-hot2">🔥 HOT EXOTIC</span>' : p.tier === 'high' ? '<span class="chip tier-high2">⚡ HIGH CONFIDENCE</span>' : '<span class="chip tier-strong2">STRONG EXOTIC</span>';
      const rk = ['①', '②', '③', '④'];
      const legs = [...(p.legs || [])];
      if (p.first_four && p.first_four.length === 4 && !legs.find(l => l.horse_name === p.first_four[3].horse_name)) legs.push(p.first_four[3]);
      const legRows = legs.map((l, i) => {
        const fin = l.position != null ? `<span class="fin ${l.position <= (i < 3 ? 3 : 4) && !l.scratched ? 'in' : 'out'}">${l.scratched ? 'SCR' : l.position === 1 ? '1st' : l.position === 2 ? '2nd' : l.position === 3 ? '3rd' : l.position + 'th'}</span>` : '';
        return `<div class="exo-leg"><span class="rk">${rk[i] || ''} #${l.tab_number ?? '?'}</span><span class="nm">${esc(l.horse_name)}</span>${l.place_pct != null ? `<span class="pp num">${l.place_pct}% top-3</span>` : ''}${fin}</div>`;
      }).join('');
      const verdicts = [];
      if (p.hit != null) verdicts.push(p.hit ? '<span class="vw">✓ Trifecta HIT</span>' : '<span class="vl">✗ Trifecta missed</span>');
      if (p.first_four_hit != null) verdicts.push(p.first_four_hit ? '<span class="vw">✓ First-4 HIT</span>' : '<span class="vl">✗ First-4 missed</span>');
      const outcome = (p.hit === true || p.first_four_hit === true) ? 'res-win' : (p.hit === false || p.first_four_hit === false) ? 'res-miss' : '';
      return `<div class="jcard pcard ${outcome}">
        <div class="when">${isPast
          ? `<div class="clock num">${wallTime(p.scheduled_time)}</div>`
          : `<div class="cd big ${cd.urg || ''}">${cd.label || ''}</div><div class="wt num">${wallTime(p.scheduled_time)}</div>`}</div>
        <div class="mid">
          <div class="pk-horse">${esc(p.venue)} R${p.race_number}</div>
          <div class="pk-sub num">${[p.distance ? p.distance + 'm' : '', p.field_size ? p.field_size + ' runners' : '', p.state || ''].filter(Boolean).join(' · ')}</div>
          <div class="pk-chips">${tier}${(() => {
            const a = p.exotic_alignment;
            if (a === 'full' || a === 'aligned') return '<span class="chip nosb" title="The exotic legs agree with our win pick for this race">matches win pick</span>';
            if (a === 'partial') return '<span class="chip nosb" title="Some exotic legs differ from our win pick">partly matches win pick</span>';
            return '';
          })()}</div>
        </div>
        <div class="right">${p.combined_pct != null ? `<div class="odds-pill"><b class="num">~${p.combined_pct}%</b>tri box est.</div>` : ''}${p.first_four_combined_pct != null ? `<div class="odds-pill"><b class="num" style="font-size:1rem">~${p.first_four_combined_pct}%</b>first-4 est.</div>` : ''}</div>
        <div class="exo-legs">${legRows}</div>
        ${verdicts.length ? `<div class="verdict-line">${verdicts.join('')}</div>` : ''}
      </div>`;
    }).join('');
  }

  /* ── full-field drawer ── */
  function bindCards(root) {
    root.querySelectorAll('[data-open]').forEach(n => n.onclick = () => openField(n.dataset.open, n.dataset.horse));
  }
  const drawer = document.getElementById('drawer');
  const ovl = document.getElementById('ovl');

  // Finishing order for settled races — same as the Lounge drawer.
  const _resultsCache = {};
  async function fetchVenueResults(dateStr, vc) {
    const key = `${dateStr}/${vc}`;
    if (_resultsCache[key]) return _resultsCache[key];
    _resultsCache[key] = {};
    try {
      const d = await (await fetch(`${API}/api/meetings/${dateStr}/${vc}/results`)).json();
      for (const rr of (d.races || [])) _resultsCache[key][rr.race_number] = rr;
    } catch (e) {}
    return _resultsCache[key];
  }
  // resultBlock now lives in the shared pick-card.js (window.PickCard.resultBlock).
  function closeDrawer() { drawer.classList.remove('open'); ovl.classList.remove('open'); }
  document.getElementById('dwClose').onclick = closeDrawer;
  ovl.onclick = closeDrawer;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

  async function openField(raceId, ourHorse) {
    const p = (E.picks || []).find(x => x.race_id === raceId)
      || ((E.resData && E.resData.picks) || []).find(x => x.race_id === raceId);
    document.getElementById('dwTitle').innerHTML = p ? `${esc(p.venue)} <b class="dw-rnum">R${p.race_number}</b>` : 'Race';
    document.getElementById('dwSub').innerHTML = p ? `${esc(p.race_name || '')}${p.race_name ? ' · ' : ''}<span class="num">${p.distance ? p.distance + 'm · ' : ''}${wallTime(p.scheduled_time)}</span>` : '';
    document.getElementById('dwChips').innerHTML = p ? (tierChip(p) + (sharpOf(p) ? '<span class="chip sharp">🎯 SHARP</span>' : placeChip(p)) + watchBtn(p.state)) : '';
    const body = document.getElementById('dwBody');
    body.innerHTML = '<div class="loading"><div class="spin"></div>Loading full field…</div>';
    drawer.classList.add('open'); ovl.classList.add('open');
    // Completed race? show the actual finishing order (1st–4th) — shared Lounge format.
    let resultHtml = '';
    const _jump = (p && p.scheduled_time) ? new Date(p.scheduled_time).getTime() : null;
    if (_jump && _jump < Date.now()) {
      const vc = vcOf(p || { venue: raceId.split('_')[1] });
      const vres = await fetchVenueResults(raceId.slice(0, 10), vc);
      const rnum = p ? p.race_number : parseInt((raceId.split('_R')[1] || ''), 10);
      const rr = vres[rnum];
      const fin = (rr && rr.runners) ? rr.runners.filter(x => x.position >= 1 && x.position <= 4).sort((a, b) => a.position - b.position) : [];
      resultHtml = window.PickCard.resultBlock(fin, ourHorse || (p && p.horse_name));
    }
    const rs = (await fetchRunners(raceId)).filter(x => !x.cancelled)
      .sort((a, b) => (a.model_rank || 99) - (b.model_rank || 99) || (b.win_probability || 0) - (a.win_probability || 0));
    if (!rs.length) { body.innerHTML = resultHtml + '<div class="empty" style="padding:30px 0"><div class="big">🐎</div>No runner predictions available for this race.</div>'; return; }
    body.innerHTML = resultHtml + rs.map((x, i) => `<div class="runner ${i === 0 ? 'top1' : ''}">
      <div class="saddle num">${x.tab_number ?? '–'}</div>
      <div class="info">
        <div class="hn">${esc(x.horse_name)}${(ourHorse && x.horse_name && x.horse_name.toLowerCase() === ourHorse.toLowerCase()) ? ' <span class="pick-tag">OUR PICK</span>' : ''}</div>
        <div class="jk">${x.jockey ? `J: ${esc(x.jockey)}` : ''}${x.jockey_overall_rate != null ? ` <b>${(+x.jockey_overall_rate).toFixed(0)}%</b>` : ''}${x.trainer ? ` · T: ${esc(x.trainer)}` : ''}${x.trainer_overall_rate != null ? ` <b>${(+x.trainer_overall_rate).toFixed(0)}%</b>` : ''}</div>
        <div class="jk">${x.barrier ? `barrier ${x.barrier}` : ''}${x.weight ? ` · ${x.weight}kg` : ''}${x.form_figures ? ` · <b class="ff">form ${x.form_figures}</b>` : (x.starts_last_10 != null ? ` · last ${x.starts_last_10 < 10 ? x.starts_last_10 : 10}: ${x.wins_last_10 ?? 0}W / ${x.places_last_10 ?? 0} top-3` : '')}</div>
        ${(x.key_flags || []).length ? `<div class="rflags">${(x.key_flags || []).slice(0, 3).map(f => `<span class="rflag">${esc(f)}</span>`).join('')}</div>` : ''}
        <div class="rbars">${window.PickCard.winPlace(x.win_probability, x.place_probability)}</div>
      </div>
      <div class="odds">${x.best_available_odds ? `<div class="o num">$${(+x.best_available_odds).toFixed(2)}</div><div class="ol">best odds</div>` : ''}${x.place_odds_at_jump ? `<div class="o num" style="font-size:0.95rem;color:var(--blue)">$${(+x.place_odds_at_jump).toFixed(2)}</div><div class="ol">place @ jump</div>` : ''}</div>
    </div>`).join('');
  }

  /* ── toggle ── */
  document.querySelectorAll('#edgeVerSeg button').forEach(b => b.onclick = () => {
    if (b.dataset.lv === 'trad') {
      try { localStorage.setItem('fiqEdgeView', 'trad'); } catch (e) {}
      location.href = '/edge';
    }
  });

  /* ── boot ── */
  async function loadBilling() {
    try {
      const r = await fetch(`${API}/api/config/public`);
      if (r.ok) window.PickCard.configureBilling((await r.json()).billing);
    } catch (e) {}
    window.PickCard.bindUnlock();
  }
  async function boot() {
    renderControls();
    loadBilling();
    loadEdgePerf();
    try {
      await loadEdge();
    } catch (e) {
      document.getElementById('feed').innerHTML = `<div class="empty"><div class="big">⚠️</div>Could not load picks — ${esc(e.message)}</div>`;
      return;
    }
    renderStats();
    renderFeed();
    loadTodayResults().then(() => { renderStats(); if (E.parent === 'wins' && E.view === 'up') renderFeed(); });
    setInterval(() => { if (E.parent === 'wins' && E.view === 'up') renderFeed(); }, 45000);
    setInterval(() => { loadEdge().then(() => { renderStats(); seedResultsFromPicks(); if (E.parent === 'wins' && E.view === 'up') renderFeed(); }).catch(() => {}); }, 5 * 60 * 1000);
    setInterval(() => { loadTodayResults().then(() => { renderStats(); if (E.parent === 'wins' && E.view === 'up') renderFeed(); }); }, 4 * 60 * 1000);
  }
  boot();
</script>
</body>
</html>
