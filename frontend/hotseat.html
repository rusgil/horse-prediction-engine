<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>body{visibility:hidden}</style>
  <script>
    fetch('/api/check', {credentials:'include'})
      .then(function(r){
        if(r.ok){ document.body.style.visibility='visible'; }
        else{ window.location.replace('/login?next='+encodeURIComponent(location.pathname)); }
      })
      .catch(function(){ document.body.style.visibility='visible'; });
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <title>🔥 Hot Seat — Live Picks | FunkyIQ</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base:      #07090f;
      --bg-card:      #0e1220;
      --bg-elevated:  #1a2035;
      --border:       #1e2840;
      --gold:         #e8a020;
      --green:        #22c55e;
      --green-bright: #4ade80;
      --blue:         #60a5fa;
      --red:          #f87171;
      --text:         #e6e9f0;
      --text-dim:     #8a93a8;
      --text-muted:   #5c6478;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text);
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Sticky header */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(180deg, #0a0d18 0%, rgba(10,13,24,0.92) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
      padding-top: calc(14px + env(safe-area-inset-top));
    }
    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 0.5px;
      margin: 0;
    }
    .title .flame { display: inline-block; }
    .subtitle {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .refresh-status {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .refresh-status .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Filter pills */
    .filter-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-pill {
      flex: 0 0 auto;
      padding: 6px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-pill.active {
      background: rgba(232,160,32,0.15);
      border-color: var(--gold);
      color: var(--gold);
    }
    .filter-pill:active {
      transform: scale(0.96);
    }

    /* Main list */
    main {
      padding: 12px 12px 80px;
      max-width: 560px;
      margin: 0 auto;
    }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }
    .empty-emoji {
      font-size: 48px;
      margin-bottom: 12px;
    }

    /* Pick card */
    .pick {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 14px 12px;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }
    .pick.imminent {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px var(--gold);
    }
    .pick.hot {
      background: linear-gradient(135deg, var(--bg-card) 0%, rgba(232,160,32,0.06) 100%);
    }

    /* Top row: countdown + meta */
    .pick-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .countdown {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 30px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
      color: var(--blue);
    }
    .countdown.imminent { color: var(--gold); }
    .countdown.now { color: var(--red); animation: pulse 1.5s ease-in-out infinite; }
    .race-meta {
      text-align: right;
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.35;
    }
    .race-meta strong {
      display: block;
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* Horse name */
    .horse {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.3px;
      margin: 0 0 8px;
      line-height: 1.1;
      color: var(--text);
    }
    .horse-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .horse-meta strong {
      color: var(--text-dim);
      font-weight: 500;
    }

    /* Stats row: win% | place% | odds */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      background: var(--bg-elevated);
      border-radius: 10px;
      padding: 10px 6px;
    }
    .stat {
      text-align: center;
      border-right: 1px solid var(--border);
    }
    .stat:last-child { border-right: 0; }
    .stat-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 22px;
      line-height: 1;
      letter-spacing: 0.3px;
      font-variant-numeric: tabular-nums;
    }
    .stat-num.win { color: var(--green-bright); }
    .stat-num.win.high { color: var(--gold); }
    .stat-num.place { color: var(--blue); }
    .stat-num.odds { color: var(--text); }
    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    /* Badge for premium (place_rank >= 2) */
    .badge {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 7px;
      border-radius: 4px;
      background: rgba(232,160,32,0.18);
      color: var(--gold);
      border: 1px solid var(--gold);
    }

    /* Desktop: slightly bigger */
    @media (min-width: 600px) {
      .title { font-size: 36px; }
      .pick { padding: 18px 18px 16px; }
      .countdown { font-size: 38px; }
      .horse { font-size: 26px; }
      .stat-num { font-size: 26px; }
    }

    a.dash-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 11px;
    }
    a.dash-link:hover { color: var(--text-dim); }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <div>
        <h1 class="title"><span class="flame">🔥</span> Hot Seat</h1>
        <div class="subtitle">Next races · sorted by jump time</div>
      </div>
      <div>
        <div class="refresh-status"><span class="dot"></span><span id="refreshLabel">Loading…</span></div>
        <div style="margin-top:4px;text-align:right"><a href="/edge.html" class="dash-link">Edge view →</a></div>
      </div>
    </div>
    <div class="filter-row">
      <button class="filter-pill active" data-filter="all">All ≥20%</button>
      <button class="filter-pill" data-filter="standard">≥30% Standard+</button>
      <button class="filter-pill" data-filter="hot">≥40% Hot picks</button>
    </div>
  </header>

  <main id="list">
    <div class="empty">
      <div class="empty-emoji">⏳</div>
      <div>Loading picks…</div>
    </div>
  </main>

<script>
  const API = 'https://web-production-dec62.up.railway.app';
  let state = {
    picks: [],
    filter: 'all',
    lastFetch: 0,
  };

  function escHtml(s) {
    return (s == null ? '' : String(s))
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formatCountdown(scheduledIso) {
    if (!scheduledIso) return { text: '—', cls: '' };
    // Placeholder midnight values (T00:00:00) → unknown time
    if (typeof scheduledIso === 'string' && /T00:00:00/.test(scheduledIso)) {
      return { text: 'TBA', cls: '' };
    }
    const jumpMs = new Date(scheduledIso).getTime();
    const now = Date.now();
    const diffSec = Math.floor((jumpMs - now) / 1000);
    if (diffSec <= -60) return { text: 'OFF', cls: 'now' };
    if (diffSec <= 0) return { text: 'NOW', cls: 'now' };
    const mins = Math.floor(diffSec / 60);
    const secs = diffSec % 60;
    let cls = '';
    if (mins < 5) cls = 'imminent';
    if (mins < 60) {
      return { text: `${mins}m ${secs.toString().padStart(2,'0')}`, cls };
    }
    const hours = Math.floor(mins / 60);
    const rmins = mins % 60;
    return { text: `${hours}h ${rmins}m`, cls };
  }

  function isUpcoming(iso) {
    if (!iso) return false;
    if (typeof iso === 'string' && /T00:00:00/.test(iso)) return false;
    return new Date(iso).getTime() > Date.now() - 90 * 1000;  // 90s grace period after jump
  }

  function applyFilters(picks, filter) {
    let out = picks.filter(p => isUpcoming(p.scheduled_time));
    if (filter === 'standard') {
      out = out.filter(p => p.model_pct >= 30);
    } else if (filter === 'hot') {
      out = out.filter(p => p.model_pct >= 40);
    }
    // default 'all' shows everything the API returns (>= 20% from /api/edge)
    out.sort((a, b) => {
      const at = new Date(a.scheduled_time).getTime();
      const bt = new Date(b.scheduled_time).getTime();
      return at - bt;
    });
    return out;
  }

  function renderList() {
    const main = document.getElementById('list');
    const picks = applyFilters(state.picks, state.filter);

    if (!picks.length) {
      main.innerHTML = `
        <div class="empty">
          <div class="empty-emoji">📭</div>
          <div>No upcoming picks match this filter.</div>
          <div style="font-size:12px;margin-top:8px;color:var(--text-muted)">
            Try a different filter, or check back closer to race time.
          </div>
        </div>`;
      return;
    }

    main.innerHTML = picks.map(p => {
      const cd = formatCountdown(p.scheduled_time);
      const isImminent = cd.cls === 'imminent' || cd.cls === 'now';
      const isHot = p.model_pct >= 40;
      const winColor = p.model_pct >= 35 ? 'win high' : 'win';
      const oddsTxt = p.best_available_odds && p.best_available_odds > 1.0
        ? '$' + p.best_available_odds.toFixed(2) : '—';
      const placeTxt = p.place_probability != null ? p.place_probability.toFixed(0) + '%' : '—';
      const venueLabel = p.venue ? p.venue.replace(/-/g, ' ').toUpperCase() : '—';
      // "Premium" badge = high model confidence + high calibrated rate
      const isPremium = p.model_pct >= 30 && (p.calibrated_win_rate ?? 0) >= 45;

      const horseMeta = [];
      if (p.barrier) horseMeta.push(`B${p.barrier}`);
      if (p.weight) horseMeta.push(`${p.weight}kg`);
      if (p.jockey) horseMeta.push(`J: ${escHtml(p.jockey)}`);
      if (p.starts_last_10 != null) {
        const label = p.starts_last_10 < 10 ? `L${p.starts_last_10}` : 'L10';
        horseMeta.push(`${label}: ${p.wins_last_10 ?? 0}W/${p.places_last_10 ?? 0}p`);
      }

      return `
        <div class="pick ${isImminent ? 'imminent' : ''} ${isHot ? 'hot' : ''}">
          ${isPremium ? '<div class="badge">Premium</div>' : ''}
          <div class="pick-top">
            <div class="countdown ${cd.cls}">${cd.text}</div>
            <div class="race-meta">
              <strong>${escHtml(venueLabel)} R${p.race_number}</strong>
              ${p.distance ? escHtml(p.distance) + 'm · ' : ''}${p.track_condition ? escHtml(p.track_condition) : ''}
            </div>
          </div>
          <h2 class="horse">${escHtml(p.horse_name)}</h2>
          ${horseMeta.length ? `<div class="horse-meta">${horseMeta.join(' · ')}</div>` : ''}
          <div class="stats">
            <div class="stat">
              <div class="stat-num ${winColor}">${p.model_pct}%</div>
              <div class="stat-label">Win</div>
            </div>
            <div class="stat">
              <div class="stat-num place">${placeTxt}</div>
              <div class="stat-label">Place</div>
            </div>
            <div class="stat">
              <div class="stat-num odds">${oddsTxt}</div>
              <div class="stat-label">Odds</div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  async function loadPicks() {
    document.getElementById('refreshLabel').textContent = 'Refreshing…';
    try {
      const r = await fetch(`${API}/api/edge`, { credentials: 'include' });
      const data = await r.json();
      state.picks = data.picks || [];
      state.lastFetch = Date.now();
      renderList();
    } catch (e) {
      console.error(e);
    } finally {
      updateRefreshLabel();
    }
  }

  function updateRefreshLabel() {
    if (!state.lastFetch) return;
    const ageSec = Math.floor((Date.now() - state.lastFetch) / 1000);
    let label;
    if (ageSec < 5) label = 'Just now';
    else if (ageSec < 60) label = `${ageSec}s ago`;
    else label = `${Math.floor(ageSec / 60)}m ago`;
    document.getElementById('refreshLabel').textContent = label;
  }

  // Tick the countdowns + refresh-age label every second
  setInterval(() => {
    renderList();
    updateRefreshLabel();
  }, 1000);

  // Fetch new picks every 30 seconds (the /api/edge cache is 5 min + prewarmed,
  // so this just refreshes our local state — almost always hits warm cache)
  setInterval(loadPicks, 30000);

  // Filter pills
  document.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.filter = btn.dataset.filter;
      renderList();
    });
  });

  loadPicks();
</script>
</body>
</html>
