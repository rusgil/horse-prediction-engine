  <style>
    :root {
      --bg-base:       #07090f;
      --bg-card:       #0e1220;
      --bg-hover:      #131828;
      --bg-elevated:   #1a2035;
      --border:        #1e2840;

      --gold:          #e8a020;
      --gold-light:    #f5b83a;
      --gold-dim:      rgba(232,160,32,0.12);
      --gold-mid:      rgba(232,160,32,0.28);

      --blue:          #3b82f6;
      --blue-dim:      rgba(59,130,246,0.14);

      --green:         #22c55e;
      --green-dim:     rgba(34,197,94,0.12);

      --red:           #ef4444;
      --red-dim:       rgba(239,68,68,0.12);

      --text-primary:  #f0f4ff;
      --text-secondary:#8a9bc4;
      --text-dim:      #4a5a7a;

      --radius:        12px;
      --radius-sm:     8px;
      --radius-lg:     18px;
      --shadow:        0 4px 24px rgba(0,0,0,0.5);
      --transition:    all 0.18s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(232,160,32,0.06), transparent),
        radial-gradient(ellipse 60% 40% at 90% 90%, rgba(59,130,246,0.04), transparent);
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Nav ─────────────────────────────────────────────────── */
    .nav {
      background: rgba(7,9,15,0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      padding: 0 14px;
    }
    .nav-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; height: 52px; gap: 12px;
    }
    .nav-brand {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem; font-weight: 900;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-primary); text-decoration: none;
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }
    .nav-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--gold); box-shadow: 0 0 8px var(--gold);
    }
    .nav-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.95rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-secondary); flex: 1;
    }
    .nav-date {
      font-size: 0.8rem; color: var(--text-dim);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600; letter-spacing: 0.05em;
      cursor: pointer; white-space: nowrap;
    }
    .nav-date:hover { border-color: var(--gold); color: var(--gold); }

    @media (min-width: 768px) {
      .nav { padding: 0 24px; }
      .nav-inner { height: 64px; gap: 16px; }
      .nav-brand { font-size: 1.35rem; }
      .nav-dot { width: 10px; height: 10px; }
      .nav-title { font-size: 1.05rem; }
      .nav-date { font-size: 0.85rem; padding: 6px 14px; }
    }

    /* ── Page ────────────────────────────────────────────────── */
    .page {
      max-width: 1100px; margin: 0 auto;
      padding: 16px 12px 80px;
    }

    @media (min-width: 768px) {
      .page { padding: 28px 24px 64px; }
    }

    /* ── Hero ────────────────────────────────────────────────── */
    .hero {
      margin-bottom: 22px;
    }
    .hero-label {
      font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 6px;
    }
    .hero-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.6rem; font-weight: 800;
      letter-spacing: 0.04em; text-transform: uppercase;
      line-height: 1;
    }
    .hero-powered {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 8px;
      font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-dim);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px;
    }
    .hero-powered span { color: var(--gold); }
    .hero-sub {
      font-size: 0.82rem; color: var(--text-dim);
      margin-top: 6px;
    }

    @media (min-width: 768px) {
      .hero { margin-bottom: 28px; display: flex; align-items: flex-end; justify-content: space-between; }
      .hero-title { font-size: 2.4rem; }
      .hero-sub { font-size: 0.88rem; margin-top: 6px; }
    }

    /* ── Section label ───────────────────────────────────────── */
    .section-label {
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 10px;
    }

    /* ── Scrollable pills row ────────────────────────────────── */
    .pills-scroller {
      position: relative; margin-bottom: 20px;
    }
    .pills-row {
      display: flex; gap: 8px;
      overflow-x: auto; padding-bottom: 4px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      cursor: grab;
      user-select: none;
    }
    .pills-row::-webkit-scrollbar { display: none; }
    .pills-fade-right {
      position: absolute; right: 0; top: 0; bottom: 4px;
      width: 48px; pointer-events: none;
      background: linear-gradient(to right, transparent, var(--bg-base) 90%);
    }

    .pill {
      display: flex; flex-direction: column; align-items: flex-start;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 14px;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap; flex-shrink: 0;
      position: relative;
    }
    .pill:hover { border-color: var(--gold-mid); background: var(--bg-hover); }
    .pill.active {
      border-color: var(--gold);
      background: var(--gold-dim);
    }
    .pill-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--text-primary);
    }
    .pill.active .pill-name { color: var(--gold-light); }
    .pill-sub {
      font-size: 0.68rem; color: var(--text-dim);
      font-weight: 500; letter-spacing: 0.04em;
      margin-top: 1px;
    }
    .pill-stat {
      font-size: 0.65rem; color: var(--gold);
      font-weight: 700; margin-top: 2px; min-height: 0.8em;
    }
    .pill-wx {
      font-size: 0.68rem; color: var(--text-secondary);
      margin-top: 2px;
    }
    .abandoned-tag {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase;
      background: rgba(251,146,60,0.15);
      color: #fb923c;
      border: 1px solid rgba(251,146,60,0.35);
      border-radius: 5px;
      padding: 1px 7px;
      margin-top: 3px;
    }

    /* Date pills */
    .date-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 16px;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap; flex-shrink: 0;
      text-align: center;
    }
    .date-pill:hover { border-color: var(--gold-mid); background: var(--bg-hover); }
    .date-pill.active { border-color: var(--gold); background: var(--gold-dim); }
    .date-pill-day {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--text-primary); display: block;
    }
    .date-pill.active .date-pill-day { color: var(--gold-light); }
    .date-pill-date {
      font-size: 0.68rem; color: var(--text-dim);
      font-weight: 500; display: block; margin-top: 1px;
    }
    .date-pill-acc {
      font-size: 0.68rem; font-weight: 700; display: block; margin-top: 2px;
    }
    .date-pill-acc.good { color: #10b981; }
    .date-pill-acc.ok   { color: var(--gold); }
    .date-pill-acc.bad  { color: #f87171; }
    .date-pill.past { opacity: 0.8; }

    /* Day accuracy banner (shown on past dates) */
    .day-accuracy-bar {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
    }
    .day-acc-stat { display: flex; flex-direction: column; gap: 1px; }
    .day-acc-val {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.3rem; font-weight: 700; line-height: 1;
    }
    .day-acc-val.good { color: #10b981; }
    .day-acc-val.ok   { color: var(--gold); }
    .day-acc-val.bad  { color: #f87171; }
    .day-acc-label { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }

    /* Race pills (simpler) */
    .race-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap; flex-shrink: 0;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--text-secondary);
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    }
    .race-pill-main {
      display: flex; align-items: center; gap: 6px;
    }
    .race-pill:hover { border-color: var(--gold-mid); color: var(--text-primary); }
    .race-pill.active { border-color: var(--gold); background: var(--gold-dim); color: var(--gold-light); }
    .race-pill .enriched-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-secondary); opacity: 0.6;
    }
    .race-pill .result-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .race-pill .result-dot.correct { background: #10b981; box-shadow: 0 0 5px #10b981; }
    .race-pill .result-dot.placed  { background: #f59e0b; box-shadow: 0 0 5px #f59e0b; }
    .race-pill .result-dot.wrong   { background: #f87171; box-shadow: 0 0 5px #f87171; }
    .race-pill-pct {
      font-size: 0.65rem; font-weight: 800; color: var(--gold);
      background: rgba(245,200,66,0.15); border-radius: 3px;
      padding: 0 3px; margin-left: 2px;
    }
    .race-pill-place {
      font-size: 0.65rem; font-weight: 800; color: #60a5fa;
      background: rgba(59,130,246,0.15); border-radius: 3px;
      padding: 0 3px; margin-left: 1px;
    }
    .race-pill-time {
      font-size: 0.68rem; color: var(--text-dim);
      font-weight: 600; letter-spacing: 0.02em;
      text-transform: none; font-family: 'Outfit', sans-serif;
    }
    .race-pill.active .race-pill-time { color: rgba(245,200,66,0.6); }

    /* ── Info bar (meeting context) ──────────────────────────── */
    .info-bar {
      display: flex; align-items: center; gap: 10px;
      flex-wrap: wrap;
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 18px;
      font-size: 0.8rem; color: var(--text-secondary);
    }
    .info-chip {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 8px;
      background: var(--bg-elevated);
      border-radius: 999px;
      font-size: 0.75rem; color: var(--text-dim);
    }
    .info-chip strong { color: var(--text-secondary); }
    .info-chip.race-num {
      background: var(--gold-dim);
      border: 1px solid var(--gold-mid);
      color: var(--gold-light);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 0.06em;
      padding: 3px 12px;
    }
    .info-chip.countdown {
      background: var(--gold-dim);
      border: 1px solid var(--gold-mid);
      color: var(--gold-light);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700; font-size: 0.85rem;
      letter-spacing: 0.04em;
    }
    .info-chip.countdown strong { color: var(--gold-light); }

    @media (min-width: 768px) {
      .info-bar { padding: 12px 16px; gap: 14px; }
    }

    /* ── Runner cards ─────────────────────────────────────────── */
    .runners-list { display: flex; flex-direction: column; gap: 12px; }

    .runner-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }
    .runner-card:hover {
      border-color: rgba(232,160,32,0.3);
      transform: translateY(-1px);
    }
    .runner-card.top-pick { border-color: rgba(232,160,32,0.5); }

    /* Card header */
    .runner-header {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 12px 10px;
      border-bottom: 1px solid var(--border);
    }
    .rank-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.2rem; font-weight: 900;
      width: 36px; height: 36px;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; line-height: 1;
    }
    .rank-badge.r1 { background: rgba(245,200,66,0.18); color: #f5c842; border: 1px solid rgba(245,200,66,0.35); }
    .rank-badge.r2 { background: rgba(192,192,192,0.12); color: #c0c0c0; border: 1px solid rgba(192,192,192,0.25); }
    .rank-badge.r3 { background: rgba(205,127,50,0.12); color: #cd7f32; border: 1px solid rgba(205,127,50,0.25); }
    .rank-badge.rn { background: var(--bg-elevated); color: var(--text-dim); border: 1px solid var(--border); }

    .runner-main { flex: 1; min-width: 0; }
    .runner-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.25rem; font-weight: 900;
      letter-spacing: 0.02em; text-transform: uppercase;
      color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .runner-details {
      font-size: 0.75rem; color: var(--text-dim);
      margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap;
    }
    .runner-detail-chip {
      display: inline-flex; align-items: center; gap: 3px;
      background: rgba(255,255,255,0.04); border-radius: 4px;
      padding: 1px 6px; margin-right: 4px;
    }

    .win-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.4rem; font-weight: 900;
      color: var(--gold-light); line-height: 1;
      flex-shrink: 0; text-align: right;
    }
    .win-badge small {
      display: block; font-size: 0.65rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-dim); text-align: right;
    }

    @media (min-width: 768px) {
      .runner-header { padding: 16px 20px 14px; gap: 14px; }
      .rank-badge { width: 42px; height: 42px; font-size: 1.4rem; }
      .runner-name { font-size: 1.5rem; }
      .runner-details { font-size: 0.8rem; gap: 12px; margin-top: 4px; }
      .win-badge { font-size: 1.7rem; }
      .win-badge small { font-size: 0.68rem; }
    }

    /* Probability bars */
    .prob-section {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .prob-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 6px;
    }
    .prob-row:last-child { margin-bottom: 0; }
    .prob-label {
      font-size: 0.68rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-dim); width: 36px; flex-shrink: 0;
    }
    .prob-track {
      flex: 1; height: 7px;
      background: var(--bg-elevated); border-radius: 999px; overflow: hidden;
    }
    .prob-fill {
      height: 100%; border-radius: 999px;
      transition: width 0.8s cubic-bezier(.4,0,.2,1);
    }
    .prob-fill.win  { background: linear-gradient(90deg, var(--gold), var(--gold-light)); }
    .prob-fill.place { background: linear-gradient(90deg, var(--blue), #60a5fa); }
    .prob-pct {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.95rem; font-weight: 700;
      width: 36px; text-align: right; flex-shrink: 0;
    }
    .prob-pct.win { color: var(--gold-light); }
    .prob-pct.place { color: #93c5fd; }

    @media (min-width: 768px) {
      .prob-section { padding: 14px 20px; }
      .prob-row { gap: 12px; margin-bottom: 8px; }
      .prob-label { font-size: 0.72rem; width: 40px; }
      .prob-track { height: 8px; }
      .prob-pct { font-size: 1rem; width: 40px; }
    }

    /* Stats row */
    .stats-row {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .stat-chip {
      display: flex; align-items: center; gap: 4px;
      font-size: 0.75rem; color: var(--text-dim);
    }
    .stat-chip strong { color: var(--text-secondary); font-weight: 600; }
    .stat-chip .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border); }

    @media (min-width: 768px) {
      .stats-row { padding: 12px 20px; gap: 12px; }
      .stat-chip { font-size: 0.8rem; }
    }

    /* Flags row */
    .flags-row {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; gap: 6px; overflow-x: auto;
      scrollbar-width: none;
    }
    .flags-row::-webkit-scrollbar { display: none; }
    .flags-row:empty { display: none; }
    .flag-chip {
      font-size: 0.72rem; font-weight: 600;
      padding: 3px 8px; border-radius: 999px;
      white-space: nowrap; flex-shrink: 0;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    @media (min-width: 768px) {
      .flags-row { padding: 10px 20px; gap: 8px; }
      .flag-chip { font-size: 0.75rem; padding: 4px 10px; }
    }

    /* Narrative */
    .narrative-section { border-top: 1px solid var(--border); }
    .narrative-toggle {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 9px 12px;
      background: none; border: none; cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-dim);
      transition: var(--transition);
    }
    .narrative-toggle:hover { color: var(--text-secondary); }
    .narrative-toggle-icon {
      font-size: 0.65rem; transition: transform 0.2s ease;
    }
    .narrative-toggle.open .narrative-toggle-icon { transform: rotate(180deg); }
    .narrative-body {
      display: none;
      padding: 0 12px 12px;
    }
    .narrative-body.open { display: block; }
    .narrative-text {
      font-size: 0.85rem; color: var(--text-secondary);
      line-height: 1.7; font-style: italic;
    }

    @media (min-width: 768px) {
      .narrative-toggle { padding: 10px 20px; font-size: 0.75rem; }
      .narrative-body { padding: 0 20px 16px; }
      .narrative-text { font-size: 0.9rem; }
    }

    /* ── Analyse / Enrich panel ──────────────────────────────── */
    .enrich-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 24px;
      text-align: center;
    }
    .enrich-icon { font-size: 3rem; margin-bottom: 16px; }
    .enrich-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.6rem; font-weight: 900;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .enrich-desc {
      font-size: 0.88rem; color: var(--text-dim);
      max-width: 360px; margin: 0 auto 28px; line-height: 1.6;
    }
    .btn-analyse {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--gold); color: #07090f;
      border: none; cursor: pointer;
      padding: 14px 32px; border-radius: var(--radius-sm);
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem; font-weight: 700;
      letter-spacing: 0.02em;
      transition: var(--transition);
    }
    .btn-analyse:hover { background: var(--gold-light); transform: translateY(-1px); }
    .btn-analyse:disabled { background: var(--bg-elevated); color: var(--text-dim); cursor: not-allowed; transform: none; }

    /* ── Loading / Error / Empty ─────────────────────────────── */
    .loading-state, .error-state, .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 60px 24px; text-align: center;
    }
    .loading-ring {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text { font-size: 0.88rem; color: var(--text-dim); }
    .error-state { color: var(--red); }
    .error-state p { color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; }
    .empty-state { color: var(--text-dim); font-size: 0.9rem; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .runner-card { animation: fadeUp 0.3s ease both; }
    .runner-card:nth-child(2) { animation-delay: 0.04s; }
    .runner-card:nth-child(3) { animation-delay: 0.08s; }
    .runner-card:nth-child(4) { animation-delay: 0.12s; }
    .runner-card:nth-child(5) { animation-delay: 0.16s; }
    .runner-card:nth-child(6) { animation-delay: 0.20s; }

    /* ── Bottom nav (mobile) ─────────────────────────────────── */
    .bottom-nav {
      display: flex; position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(7,9,15,0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-tab {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px; text-decoration: none;
      color: var(--text-dim); transition: var(--transition);
      padding: 6px 0; background: none; border: none; cursor: pointer;
      font-family: 'Outfit', sans-serif;
    }
    .bottom-tab.active { color: var(--gold); }
    .bottom-tab-icon { font-size: 1.2rem; line-height: 1; }
    .bottom-tab-label { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }

    @media (min-width: 768px) {
      .bottom-nav { display: none; }
      .page { padding-bottom: 64px; }
    }

    /* ── Market rank comparison badge ──────────────────────────── */
    .rank-compare {
      font-size: 0.7rem; font-weight: 600;
      padding: 2px 7px; border-radius: 999px;
      letter-spacing: 0.04em;
    }
    .rank-compare.better { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34,197,94,0.25); }
    .rank-compare.worse  { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(239,68,68,0.25); }
    .rank-compare.same   { background: var(--bg-elevated); color: var(--text-dim); border: 1px solid var(--border); }

    /* ── Odds pill ────────────────────────────────────────────── */
    .odds-pill {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.88rem; font-weight: 700;
      padding: 2px 8px; border-radius: 999px;
      background: var(--gold-dim); color: var(--gold);
      border: 1px solid var(--gold-mid);
      transition: background 0.3s, color 0.3s;
    }
    .odds-pill.value-bet {
      background: rgba(16,185,129,0.18); color: #10b981;
      border-color: #10b981;
    }

    /* ── Value badge ─────────────────────────────────────────── */
    .value-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em;
      padding: 2px 7px; border-radius: 999px;
      background: rgba(16,185,129,0.18); color: #10b981;
      border: 1px solid #10b981;
    }

    /* ── Performance strip ───────────────────────────────────── */
    .perf-strip {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 0 16px 20px;
    }
    .perf-strip-header {
      padding: 0 16px 8px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-dim);
    }
    .perf-card {
      flex: 1; min-width: 90px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .perf-date { font-size: 0.72rem; color: var(--text-dim); }
    .perf-win-rate {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.4rem; font-weight: 700; line-height: 1;
    }
    .perf-win-rate.good { color: #10b981; }
    .perf-win-rate.ok   { color: var(--gold); }
    .perf-win-rate.bad  { color: #f87171; }
    .perf-sub { font-size: 0.72rem; color: var(--text-dim); }
    .perf-pnl { font-size: 0.78rem; font-weight: 600; }
    .perf-pnl.pos { color: #10b981; }
    .perf-pnl.neg { color: #f87171; }

    /* ── Result badge on runner cards ───────────────────────── */
    .result-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.75rem; font-weight: 700;
      padding: 2px 8px; border-radius: 999px;
      margin-left: 4px;
    }
    .result-badge.won        { background: rgba(234,179,8,0.15); color: var(--gold); border: 1px solid var(--gold-mid); }
    .result-badge.pick-won   { background: rgba(16,185,129,0.18); color: #10b981; border: 1px solid #10b981; }
    .result-badge.pick-placed{ background: rgba(234,179,8,0.15); color: var(--gold); border: 1px solid var(--gold-mid); }
    .result-badge.placed     { background: rgba(234,179,8,0.15); color: var(--gold); border: 1px solid var(--gold-mid); }
    .result-badge.unplaced   { background: var(--bg-elevated); color: var(--text-dim); border: 1px solid var(--border); }
    .result-badge.pick-miss  { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
    .model-verdict {
      font-size: 0.8rem; font-weight: 600;
      padding: 6px 14px; border-radius: 8px;
      margin: 0 16px 10px;
      text-align: center;
    }
    .model-verdict.correct { background: rgba(16,185,129,0.12); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
    .model-verdict.placed  { background: rgba(245,158,11,0.1);  color: #f59e0b; border: 1px solid rgba(245,158,11,0.25); }
    .model-verdict.wrong   { background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.25); }

    /* ── Live odds bar ───────────────────────────────────────── */
    .live-odds-bar {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; color: var(--text-dim);
      padding: 8px 16px 4px;
    }
    .live-dot {
      display: inline-block; width: 7px; height: 7px;
      border-radius: 50%; background: #10b981;
      box-shadow: 0 0 6px #10b981;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
    }

    /* ── Results summary section ─────────────────────────────── */
    .results-section {
      margin: 0 0 20px;
    }
    .results-section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-dim);
      padding: 0 4px 8px; border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .result-race-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.8rem;
    }
    .result-race-row:last-child { border-bottom: none; }
    .result-race-num {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
      font-size: 0.75rem; color: var(--text-dim);
      min-width: 24px; padding-top: 1px;
    }
    .result-model-dot {
      width: 8px; height: 8px; border-radius: 50%;
      margin-top: 4px; flex-shrink: 0;
    }
    .result-model-dot.correct { background: #10b981; box-shadow: 0 0 4px #10b981; }
    .result-model-dot.placed  { background: #f59e0b; box-shadow: 0 0 4px #f59e0b; }
    .result-model-dot.wrong   { background: #f87171; box-shadow: 0 0 4px #f87171; }
    .result-model-dot.none    { background: var(--border); }
    .result-finishers { display: flex; flex-wrap: wrap; gap: 4px; }
    .result-finisher {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.78rem; font-weight: 600;
      padding: 2px 7px; border-radius: 6px;
      border: 1px solid var(--border);
      color: var(--text-secondary); background: var(--bg-elevated);
    }
    .result-finisher.win  { background: rgba(232,160,32,0.12); color: var(--gold); border-color: var(--gold-mid); }
    .result-finisher.place{ background: rgba(232,160,32,0.07); color: var(--gold-light); opacity: 0.75; border-color: var(--border); }
    .result-finisher.pick { outline: 1px solid #10b981; outline-offset: 1px; }
    .result-pos-label {
      font-size: 0.65rem; font-weight: 600; opacity: 0.7; margin-right: 2px;
    }
    .result-sp { font-size: 0.68rem; opacity: 0.6; margin-left: 2px; }

    /* ── Inline spinner ───────────────────────────────────────── */
    .spin-inline {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(7,9,15,0.3);
      border-top-color: #07090f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
  </style>
</head>

      <span style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:#f59e0b;box-shadow:0 0 5px #f59e0b;display:inline-block"></span>Place</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:#f87171;box-shadow:0 0 5px #f87171;display:inline-block"></span>Loss</span>

<script>
  const API = 'https://web-production-dec62.up.railway.app';

  // ── Countdown ─────────────────────────────────────────────────────────────
  let _countdownInterval = null;

  function startCountdown(timeStr) {
    if (_countdownInterval) clearInterval(_countdownInterval);
    const tick = () => {
      const el = document.getElementById('race-countdown');
      if (!el) { clearInterval(_countdownInterval); return; }
      const diff = new Date(timeStr) - Date.now();
      if (diff <= 0) {
        el.className = 'info-chip countdown';
        el.textContent = '🏇 In Running';
        clearInterval(_countdownInterval);
        return;
      }
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      const parts = [];
      if (h > 0) parts.push(`${h}h`);
      parts.push(`${String(m).padStart(2,'0')}m`);
      parts.push(`${String(s).padStart(2,'0')}s`);
      el.innerHTML = `Race in <strong>${parts.join(' ')}</strong>`;
    };
    tick();
    _countdownInterval = setInterval(tick, 1000);
  }

  // ── State ─────────────────────────────────────────────────────────────────
  const S = {
    date: todayISO(),
    meetings: [],
    selectedMeeting: null,
    races: [],
    enrichedRaceIds: new Set(),
    selectedRaceId: null,
    runners: [],
    enriching: false,
    loadingRace: false,
    liveOdds: {},
    liveOddsTimer: null,
    perfByDate: {},   // date → {win_rate, place_rate, wins, races, value_pnl, value_bets}
    meetingStats: {}, // venue_code → {wins, total} for win% pills
    statsLoadGen: 0,  // incremented on date change to cancel stale _loadMeetingWinRate callbacks
  };

  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function addDays(iso, n) {
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function formatDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }

  function formatDayLabel(iso) {
    const today = todayISO();
    if (iso === today) return 'Today';
    if (iso === addDays(today, 1)) return 'Tomorrow';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-AU', { weekday: 'short' });
  }

  function formatShortDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
  }

  function renderDatePills() {
    const container = document.getElementById('datePills');
    container.innerHTML = '';
    const today = todayISO();
    let todayEl = null;
    // 5 past days → today → 2 future days
    for (let i = -5; i <= 2; i++) {
      const iso = addDays(today, i);
      const isPast = i < 0;
      const el = document.createElement('div');
      el.className = 'date-pill' + (S.date === iso ? ' active' : '') + (isPast ? ' past' : '');
      const perf = isPast ? S.perfByDate[iso] : null;
      let accHtml = '';
      if (perf) {
        const complete = perf.data_complete !== false;
        const pct = Math.round(perf.win_rate * 100);
        const placePct = Math.round((perf.place_rate || 0) * 100);
        const cls = pct >= 50 ? 'good' : pct >= 38 ? 'ok' : 'bad';
        const winLabel = `${pct}%`;
        const placeLabel = `${placePct}%`;
        accHtml = `<span class="date-pill-acc ${cls}" title="${complete ? 'Win rate' : 'Win rate (partial)'}">${winLabel}</span><span class="date-pill-acc" style="color:#60a5fa;background:rgba(59,130,246,0.12);border-color:rgba(59,130,246,0.25);opacity:${complete ? 1 : 0.75}" title="${complete ? 'Place rate' : 'Place rate (partial)'}">${placeLabel}</span>`;
      }
      el.innerHTML = `<span class="date-pill-day">${formatDayLabel(iso)}</span><span class="date-pill-date">${formatShortDate(iso)}</span>${accHtml}`;
      el.addEventListener('click', () => selectDate(iso));
      container.appendChild(el);
      if (i === 0) todayEl = el;
    }
    // Scroll today into view (horizontally)
    if (todayEl) setTimeout(() => todayEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }), 50);
  }

  async function selectDate(iso) {
    if (S.date === iso) return;
    S.date = iso;
    S.meetings = [];
    S.selectedMeeting = null;
    S.races = [];
    S.selectedRaceId = null;
    S.runners = [];
    renderDatePills();
    const dayBanner = document.getElementById('dayAccuracyBanner');
    if (dayBanner) dayBanner.innerHTML = '';
    document.getElementById('meetingsSection').style.display = 'none';
    document.getElementById('racesSection').style.display = 'none';
    document.getElementById('raceContent').innerHTML = '';
    document.getElementById('navDate').textContent = formatDate(iso);
    await loadMeetingsForDate(iso);
  }

  // ── API calls ─────────────────────────────────────────────────────────────

  async function fetchMeetings(date) {
    const r = await fetch(`${API}/api/meetings/${date}`);
    if (!r.ok) throw new Error(`Meetings fetch failed: ${r.status}`);
    return r.json();
  }

  async function fetchMeeting(date, venue) {
    const r = await fetch(`${API}/api/meetings/${date}/${venue}`);
    if (!r.ok) throw new Error(`Meeting fetch failed: ${r.status}`);
    return r.json();
  }

  async function fetchRace(raceId) {
    const r = await fetch(`${API}/api/races/${raceId}`);
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(`Race fetch failed: ${r.status}`);
    return r.json();
  }

  async function enrichRace(raceId) {
    const r = await fetch(`${API}/api/races/${raceId}/enrich`, { method: 'POST' });
    if (!r.ok) throw new Error(`Enrich failed: ${r.status}`);
    return r.json();
  }

  async function fetchLiveOdds(raceId) {
    const r = await fetch(`${API}/api/races/${raceId}/live-odds`);
    if (!r.ok) return null;
    return r.json();
  }

  async function loadPerformanceStrip() {
    try {
      const r = await fetch(`${API}/api/performance?days=7`);
      if (!r.ok) return;
      const data = await r.json();
      if (!data.summary || !data.summary.length) return;

      // Store per-date for date pills and day banners
      S.perfByDate = {};
      for (const d of data.summary) S.perfByDate[d.date] = d;
      renderDatePills(); // re-render with accuracy annotations
    } catch (e) { /* silent */ }
  }

  function formatShortDate(iso) {
    try {
      const d = new Date(iso + 'T12:00:00');
      return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
    } catch { return iso; }
  }

  function startLiveOddsPolling(raceId) {
    stopLiveOddsPolling();
    const tick = async () => {
      if (S.selectedRaceId !== raceId) return;
      try {
        const data = await fetchLiveOdds(raceId);
        if (data) {
          S.liveOdds = {};
          for (const row of (data.runners || [])) S.liveOdds[row.horse_name] = row;
          updateLiveOddsDisplay(data);
        }
      } catch (e) { /* silent */ }
    };
    tick();
    S.liveOddsTimer = setInterval(tick, 120_000);
  }

  function stopLiveOddsPolling() {
    if (S.liveOddsTimer) { clearInterval(S.liveOddsTimer); S.liveOddsTimer = null; }
    S.liveOdds = {};
  }

  function updateLiveOddsDisplay(data) {
    const fetchedAt = typeof data === 'string' ? data : data?.fetched_at;
    const settled = data?.settled;
    const modelCorrect = data?.model_correct;
    const modelPlaced = data?.model_placed;

    const bar = document.getElementById('live-odds-bar');
    if (bar) {
      const t = fetchedAt ? new Date(fetchedAt + 'Z').toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: true }) : '';
      bar.innerHTML = settled
        ? `<span style="color:var(--text-dim);font-size:0.78rem">Results in</span>`
        : `<span class="live-dot"></span> Live Odds${t ? ` · Updated ${t}` : ''}`;
      bar.style.display = '';
    }

    // Model verdict banner for settled races
    const verdictEl = document.getElementById('model-verdict');
    if (verdictEl && settled && modelCorrect !== null) {
      if (modelCorrect) {
        verdictEl.textContent = '✓ Top pick won';
        verdictEl.className = 'model-verdict correct';
      } else if (modelPlaced === true) {
        verdictEl.textContent = '~ Top pick placed (not 1st)';
        verdictEl.className = 'model-verdict placed';
      } else {
        verdictEl.textContent = '✗ Top pick didn\'t place';
        verdictEl.className = 'model-verdict wrong';
      }
      verdictEl.style.display = '';
    }

    S.runners.forEach(r => {
      const live = S.liveOdds[r.horse_name];
      if (!live) return;

      const oddsEl = document.getElementById(`lo-odds-${r.tab_number}`);
      if (oddsEl && live.current_tote_win) {
        oddsEl.textContent = `$${live.current_tote_win.toFixed(1)}`;
        oddsEl.title = `Overlay: ${(live.overlay * 100).toFixed(1)}%`;
        oddsEl.className = 'odds-pill' + (live.value ? ' value-bet' : '');
        oddsEl.style.display = '';
      }
      const valEl = document.getElementById(`lo-val-${r.tab_number}`);
      if (valEl) valEl.style.display = live.value ? '' : 'none';

      // Show finish position badge for settled races
      const resEl = document.getElementById(`lo-res-${r.tab_number}`);
      if (resEl && live.actual_position) {
        const pos = live.actual_position;
        const posLabel = pos === 1 ? '1st' : pos === 2 ? '2nd' : pos === 3 ? '3rd' : `${pos}th`;
        let cls, label;
        if (live.is_top_pick) {
          // Model pick: green if won, gold if placed, red if missed
          cls = pos === 1 ? 'pick-won' : pos <= 3 ? 'pick-placed' : 'pick-miss';
          label = pos === 1 ? `✓ Model pick — ${posLabel}` : `Model pick — ${posLabel}`;
        } else {
          // Other runners: winner shown in gold, placed in gold, rest dim
          cls = pos === 1 ? 'won' : pos <= 3 ? 'placed' : 'unplaced';
          label = pos === 1 ? `${posLabel} Winner` : posLabel;
        }
        resEl.textContent = label;
        resEl.className = `result-badge ${cls}`;
        resEl.style.display = '';
      }
    });
  }

  // ── Init ──────────────────────────────────────────────────────────────────

  function renderDayAccuracyBanner(iso) {
    const el = document.getElementById('dayAccuracyBanner');
    if (!el) return;
    const perf = S.perfByDate[iso];
    if (!perf || iso >= todayISO()) { el.innerHTML = ''; return; }
    const complete = perf.data_complete !== false;
    const pct = Math.round(perf.win_rate * 100);
    const placePct = Math.round(perf.place_rate * 100);
    const rateClass = pct >= 50 ? 'good' : pct >= 38 ? 'ok' : 'bad';
    const winDisplay = `${pct}%`;
    const placeDisplay = `${placePct}%`;
    const pnlClass = perf.value_pnl >= 0 ? 'good' : 'bad';
    const pnlStr = perf.value_pnl >= 0 ? `+$${perf.value_pnl.toFixed(1)}` : `-$${Math.abs(perf.value_pnl).toFixed(1)}`;
    el.innerHTML = `
      <div class="day-accuracy-bar">
        <div class="day-acc-stat">
          <span class="day-acc-val ${rateClass}" title="Win rate">${winDisplay} <span style="font-size:0.7em;opacity:0.6">win</span></span>
        </div>
        <div class="day-acc-stat">
          <span class="day-acc-val" style="color:${complete ? '#60a5fa' : 'var(--text-dim)'};opacity:${complete ? 1 : 0.75}" title="Place rate (top 3)">${placeDisplay} <span style="font-size:0.7em;opacity:0.6">plc</span></span>
        </div>
        <div class="day-acc-stat">
          <span class="day-acc-val" title="Wins / qualifying picks">${perf.wins}/${perf.races} <span style="font-size:0.7em;opacity:0.6">picks</span></span>
        </div>
        ${perf.value_bets ? `
        <div class="day-acc-stat">
          <span class="day-acc-val ${pnlClass}" title="${perf.value_bets} value bets P&L">${pnlStr} <span style="font-size:0.7em;opacity:0.6">val</span></span>
        </div>` : ''}
        ${!complete ? `<div class="day-acc-stat"><span style="color:var(--text-dim);font-size:0.72rem" title="Not all results seeded yet">partial</span></div>` : ''}
      </div>`;
  }

  async function init() {
    document.getElementById('navDate').textContent = formatDate(S.date);
    renderDatePills();
    loadPerformanceStrip();
    await loadMeetingsForDate(S.date);
  }

  async function loadMeetingsForDate(iso) {
    const label = document.getElementById('meetingsLabel');
    if (label) label.textContent = formatDayLabel(iso) + "'s Meetings";
    document.getElementById('heroSub').textContent = `Loading meetings for ${formatDate(iso)}…`;

    try {
      S.meetingStats = {};
      S.statsLoadGen++;
      const data = await fetchMeetings(iso);
      S.meetings = data.meetings || [];

      if (!S.meetings.length) {
        document.getElementById('heroSub').textContent = `No Australian thoroughbred meetings on ${formatDate(iso)}.`;
        document.getElementById('meetingsSection').style.display = 'none';
        return;
      }

      document.getElementById('heroSub').textContent =
        `${S.meetings.length} meeting${S.meetings.length > 1 ? 's' : ''} — ${formatDate(iso)}`;

      renderMeetingPills();
      renderDayAccuracyBanner(iso);
      document.getElementById('meetingsSection').style.display = '';

      const firstActive = S.meetings.find(m => !m.cancelled);
      if (firstActive) {
        await selectMeeting(firstActive);
      } else {
        document.getElementById('raceContent').innerHTML = '<div style="padding:32px;text-align:center;color:var(--text-dim)">All meetings abandoned for this date.</div>';
      }

    } catch (e) {
      document.getElementById('heroSub').textContent = 'Failed to load meetings.';
      console.error(e);
    }
  }

  // ── Meeting selection ─────────────────────────────────────────────────────

  function renderMeetingPills() {
    const container = document.getElementById('meetingPills');
    container.innerHTML = '';
    S.meetings.forEach(m => {
      const el = document.createElement('div');
      el.className = 'pill' + (S.selectedMeeting?.venue_code === m.venue_code ? ' active' : '');
      const statKey = m.venue_code;
      const cached = S.meetingStats[statKey];
      let statHtml;
      if (cached && cached.total > 0) {
        const placedSpan = cached.placed > cached.wins ? ` <span style="color:#60a5fa;font-size:0.72rem">· ${cached.placed} placed</span>` : '';
        statHtml = `<span class="pill-stat" id="pill-stat-${statKey}"><span style="color:#10b981">${cached.wins}/${cached.total} wins</span>${placedSpan}</span>`;
      } else if (cached && cached.enriched > 0) {
        statHtml = `<span class="pill-stat" id="pill-stat-${statKey}" style="opacity:0.45">${cached.enriched} races</span>`;
      } else {
        statHtml = `<span class="pill-stat" id="pill-stat-${statKey}"></span>`;
      }
      const confColor = (cached && cached.maxConf >= 40) ? 'var(--green)' : 'var(--gold)';
      const confHtml = (cached && cached.maxConf >= 25)
        ? `<span class="pill-stat" id="pill-conf-${statKey}" style="color:${confColor}">${cached.maxConf}% best pick</span>`
        : `<span class="pill-stat" id="pill-conf-${statKey}" style="display:none"></span>`;
      const w = m.weather;
      let wxHtml = '';
      if (w) {
        const parts = [w.icon];
        if (w.temp_max !== null) parts.push(w.temp_max + '°C');
        if (w.wind_kmh) parts.push('💨' + w.wind_kmh + 'km/h');
        if (w.rain_mm > 0) parts.push('🌧️ ' + w.rain_mm + 'mm rain');
        wxHtml = `<span class="pill-wx">${parts.join(' ')}</span>`;
      }
      if (m.cancelled) {
        el.style.cssText = 'opacity:0.55;filter:grayscale(0.4);pointer-events:none;cursor:default;';
        el.innerHTML = `
          <span class="pill-name">${escHtml(m.venue || '')}</span>
          <span class="abandoned-tag">Abandoned</span>
        `;
      } else {
        el.innerHTML = `
          <span class="pill-name">${escHtml(m.venue || '')}</span>
          <span class="pill-sub">${escHtml(m.state || '')}${m.rail_position && typeof m.rail_position === 'string' ? ' · ' + escHtml(m.rail_position.substring(0,20)) : ''}</span>
          ${wxHtml}
          ${statHtml}
          ${confHtml}
        `;
        el.addEventListener('click', () => selectMeeting(m));
      }
      container.appendChild(el);
    });
    // Background-load win% for active meetings only
    S.meetings.filter(m => !m.cancelled).forEach(m => _loadMeetingWinRate(m));
  }

  async function _loadMeetingWinRate(m) {
    const key = m.venue_code;
    if (S.meetingStats[key]) return; // already cached
    const gen = S.statsLoadGen;
    try {
      const data = await fetchMeeting(S.date, key);
      if (S.statsLoadGen !== gen) return; // date changed while in flight
      const races = data.races || [];
      const enriched = races.filter(r => r.enriched_at);
      const settled = races.filter(r => r.model_correct !== null && r.model_correct !== undefined);
      const maxConf = enriched.reduce((max, r) => {
        const pct = r.top_win_probability ? Math.round(r.top_win_probability * 100) : 0;
        return Math.max(max, pct);
      }, 0);
      const settledWithPlace = races.filter(r => r.model_placed !== null && r.model_placed !== undefined);
      S.meetingStats[key] = {
        wins: settled.filter(r => r.model_correct).length,
        placed: settledWithPlace.filter(r => r.model_placed).length,
        total: settled.length,
        enriched: enriched.length, maxConf
      };

      const statEl = document.getElementById(`pill-stat-${key}`);
      if (statEl) {
        if (settled.length) {
          const wins = settled.filter(r => r.model_correct === true).length;
          const placed = settledWithPlace.filter(r => r.model_placed === true).length;
          statEl.innerHTML = `<span style="color:#10b981">${wins}/${settled.length} wins</span>${placed > wins ? ` <span style="color:#60a5fa;font-size:0.72rem">· ${placed} placed</span>` : ''}`;
        } else if (enriched.length) {
          statEl.textContent = `${enriched.length} races`;
          statEl.style.opacity = '0.45';
        }
      }

      const confEl = document.getElementById(`pill-conf-${key}`);
      if (confEl && maxConf >= 25) {
        confEl.textContent = `${maxConf}% best pick`;
        confEl.style.color = maxConf >= 40 ? 'var(--green)' : 'var(--gold)';
        confEl.style.display = '';
      }
    } catch (_) {}
  }

  async function selectMeeting(m) {
    stopLiveOddsPolling();
    S.selectedMeeting = m;
    S.selectedRaceId = null;
    S.races = [];
    S.runners = [];
    document.getElementById('resultsSection').style.display = 'none';

    renderMeetingPills();
    document.getElementById('racesSection').style.display = '';
    document.getElementById('raceContent').innerHTML = renderLoadingHTML('Loading races&hellip;');
    document.getElementById('infoBar').innerHTML = renderInfoBar(m);

    try {
      const data = await fetchMeeting(S.date, m.venue_code);
      S.races = data.races || [];
      S.enrichedRaceIds = new Set(
        S.races.filter(r => r.enriched_at).map(r => r.race_id)
      );
      renderRacePills();
      document.getElementById('raceContent').innerHTML = '';

      // Load results in background for today's meetings
      if (S.date === todayISO()) loadMeetingResults(m);

      // Auto-select first race
      if (S.races.length) await selectRace(S.races[0]);

    } catch (e) {
      document.getElementById('raceContent').innerHTML = renderErrorHTML('Failed to load races.', e.message);
    }
  }

  async function loadMeetingResults(m) {
    try {
      const r = await fetch(`${API}/api/meetings/${S.date}/${m.venue_code}/results`, {credentials: 'include'});
      if (!r.ok) return;
      const data = await r.json();
      const completed = (data.races || []).filter(r => r.has_result);
      if (!completed.length) return;

      // Update race pills with fresh model_correct data from RA results
      completed.forEach(res => {
        const race = S.races.find(r => r.race_id === res.race_id);
        if (race) {
          race.model_correct = res.model_correct;
          race.model_placed = res.model_placed;
        }
      });
      renderRacePills();

      // Recount wins directly from S.races and update the pill-stat
      const key = m.venue_code;
      const settled = S.races.filter(r => r.model_correct !== null && r.model_correct !== undefined);
      const wins = settled.filter(r => r.model_correct === true).length;
      const placed = S.races.filter(r => r.model_placed === true).length;
      S.meetingStats[key] = { ...(S.meetingStats[key] || {}), wins, placed, total: settled.length };
      const statEl = document.getElementById(`pill-stat-${key}`);
      if (statEl && settled.length) {
        statEl.innerHTML = `<span style="color:#10b981">${wins}/${settled.length} wins</span>${placed > wins ? ` <span style="color:#60a5fa;font-size:0.72rem">· ${placed} placed</span>` : ''}`;
      }

      // Render results summary section
      renderResultsSection(completed, m);
    } catch (_) {}
  }

  function renderResultsSection(completed, m) {
    const el = document.getElementById('resultsSection');
    if (!el || !completed.length) return;

    const rows = completed.map(race => {
      const topPick = (race.top_pick || '').toLowerCase();
      const runners = race.runners || [];
      const finishers = runners.slice(0, 4).map((r, i) => {
        const nameLower = r.name.toLowerCase();
        const isPick = topPick && nameLower === topPick;
        const cls = r.position === 1 ? 'win' : r.position <= 3 ? 'place' : '';
        const pickCls = isPick ? ' pick' : '';
        const posLabel = r.position === 1 ? '1st' : r.position === 2 ? '2nd' : r.position === 3 ? '3rd' : `${r.position}th`;
        const sp = r.sp ? ` <span class="result-sp">$${r.sp.toFixed(1)}</span>` : '';
        return `<span class="result-finisher ${cls}${pickCls}"><span class="result-pos-label">${posLabel}</span>${escHtml(r.name)}${sp}</span>`;
      }).join('');

      let dotCls = 'none';
      if (race.model_correct === true) dotCls = 'correct';
      else if (race.model_correct === false && race.model_placed === true) dotCls = 'placed';
      else if (race.model_correct === false) dotCls = 'wrong';

      const tc = race.track_condition ? ` <span style="color:var(--text-dim);font-size:0.7rem">${escHtml(race.track_condition)}</span>` : '';

      return `
        <div class="result-race-row">
          <div class="result-race-num">R${race.race_number}</div>
          <div class="result-model-dot ${dotCls}" title="${dotCls === 'correct' ? 'Model pick won' : dotCls === 'placed' ? 'Model pick placed' : dotCls === 'wrong' ? 'Model pick missed' : 'No prediction'}"></div>
          <div class="result-finishers">${finishers}${tc}</div>
        </div>`;
    }).join('');

    el.innerHTML = `
      <div class="results-section">
        <div class="results-section-title">Today's Results</div>
        ${rows}
      </div>`;
    el.style.display = '';
  }

  function renderInfoBar(m) {
    return `
      <span class="info-chip"><strong>${escHtml(m.venue || '')}</strong></span>
      ${m.state ? `<span class="info-chip">${escHtml(m.state)}</span>` : ''}
      ${m.rail_position ? `<span class="info-chip">Rail: <strong>${escHtml(m.rail_position)}</strong></span>` : ''}
      <span class="info-chip">${formatDate(S.date)}</span>
    `;
  }

  // ── Race selection ────────────────────────────────────────────────────────

  function renderRacePills() {
    const container = document.getElementById('racePills');
    container.innerHTML = '';
    S.races.forEach(r => {
      const raceId = r.race_id;
      const enriched = S.enrichedRaceIds.has(raceId);
      const el = document.createElement('div');
      el.className = 'race-pill' + (S.selectedRaceId === raceId ? ' active' : '');
      let dotHtml = '';
      if (r.model_correct === true)                                  dotHtml = '<span class="result-dot correct"></span>';
      else if (r.model_correct === false && r.model_placed === true) dotHtml = '<span class="result-dot placed"></span>';
      else if (r.model_correct === false)                            dotHtml = '<span class="result-dot wrong"></span>';
      else if (enriched)                                             dotHtml = '<span class="enriched-dot"></span>';
      const topPct = r.top_win_probability != null ? Math.round(r.top_win_probability * 100) : null;
      const placePct = r.top_place_probability != null ? Math.round(r.top_place_probability * 100) : null;
      const pctHtml = topPct >= 25 ? ` <span class="race-pill-pct">Win: ${topPct}%</span>` : '';
      const placeHtml = placePct >= 25 ? ` <span class="race-pill-place">Place: ${placePct}%</span>` : '';
      const tStr = r.scheduled_time || r.time ? formatTime(r.scheduled_time || r.time) : 'time not avail.';
      el.innerHTML = `<div class="race-pill-main">R${r.race_number}${pctHtml}${placeHtml}${dotHtml ? ' ' + dotHtml : ''}</div><span class="race-pill-time">${tStr}</span>`;
      el.addEventListener('click', () => selectRace(r));
      container.appendChild(el);
    });
  }

  async function selectRace(race) {
    stopLiveOddsPolling();
    S.selectedRaceId = race.race_id;
    S.loadingRace = true;
    renderRacePills();

    const startTime = race.scheduled_time || race.time || '';
    const raceInfo = `
      <span class="info-chip race-num">R${race.race_number}<span style="font-size:0.75rem;font-weight:600;opacity:0.8;margin-left:5px">${startTime ? formatTime(startTime) : 'time not avail.'}</span></span>
      ${race.race_name ? `<span class="info-chip">${escHtml(race.race_name)}</span>` : ''}
      ${race.distance ? `<span class="info-chip">${escHtml(String(race.distance))}m</span>` : ''}
      ${race.track_condition ? `<span class="info-chip">${escHtml(race.track_condition)}</span>` : ''}
      ${race.field_size ? `<span class="info-chip">${escHtml(String(race.field_size))} runners</span>` : ''}
      ${startTime ? `<span class="info-chip countdown" id="race-countdown">…</span>` : ''}
    `;
    document.getElementById('infoBar').innerHTML = renderInfoBar(S.selectedMeeting) + raceInfo;
    if (startTime) startCountdown(startTime);

    document.getElementById('raceContent').innerHTML = renderLoadingHTML('Loading predictions&hellip;');

    try {
      const data = await fetchRace(race.race_id);
      S.loadingRace = false;

      if (!data) {
        // Not enriched yet
        document.getElementById('raceContent').innerHTML = renderEnrichPanel(race);
        const enrichBtn = document.getElementById('enrichBtn');
        if (enrichBtn) enrichBtn.addEventListener('click', () => doEnrich(enrichBtn.dataset.raceId));
      } else {
        S.runners = data.runners || [];
        S.enrichedRaceIds.add(race.race_id);
        renderRacePills();
        document.getElementById('raceContent').innerHTML = renderRunners(race);
        startLiveOddsPolling(race.race_id);
      }
    } catch (e) {
      S.loadingRace = false;
      document.getElementById('raceContent').innerHTML = renderErrorHTML('Failed to load predictions.', e.message);
    }
  }

  // ── Enrich ────────────────────────────────────────────────────────────────

  function renderEnrichPanel(race) {
    return `
      <div class="enrich-panel">
        <div class="enrich-icon">🔬</div>
        <div class="enrich-title">Race Not Yet Analysed</div>
        <div class="enrich-desc">
          R${race.race_number}${race.race_name ? ` — ${race.race_name}` : ''}${race.distance ? `, ${race.distance}m` : ''}.
          Run the AI model to generate win probabilities, rankings, and insights for every runner.
        </div>
        <button class="btn-analyse" id="enrichBtn" data-race-id="${escHtml(race.race_id)}">
          Analyse This Race
        </button>
      </div>
    `;
  }

  async function doEnrich(raceId) {
    const btn = document.getElementById('enrichBtn');
    if (!btn) return;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin-inline"></span> Analysing&hellip;';

    try {
      await enrichRace(raceId);
      const data = await fetchRace(raceId);
      if (data) {
        S.runners = data.runners || [];
        S.enrichedRaceIds.add(raceId);
        renderRacePills();
        const race = S.races.find(r => r.race_id === raceId) || { race_id: raceId };
        document.getElementById('raceContent').innerHTML = renderRunners(race);
        startLiveOddsPolling(raceId);
      }
    } catch (e) {
      btn.disabled = false;
      btn.innerHTML = 'Analyse This Race';
      alert('Analysis failed: ' + e.message);
    }
  }

  // ── Render runners ────────────────────────────────────────────────────────

  function renderRunners(race) {
    if (!S.runners.length) {
      return `<div class="empty-state">No runners found for this race.</div>`;
    }

    const raceTime = race.scheduled_time || race.time || '';
    const cards = S.runners.map((r, i) => renderRunnerCard(r, i, raceTime)).join('');
    return `
      <div id="live-odds-bar" class="live-odds-bar" style="display:none"></div>
      <div id="model-verdict" class="model-verdict" style="display:none"></div>
      <div class="runners-list">${cards}</div>`;
  }

  function renderRunnerCard(r, i, raceTime) {
    const rank = r.model_rank || (i + 1);
    const rankClass = rank === 1 ? 'r1' : rank === 2 ? 'r2' : rank === 3 ? 'r3' : 'rn';
    const isTop = rank === 1;

    const winPct = Math.round((r.win_probability || 0) * 100);
    const placePct = Math.round((r.place_probability || 0) * 100);

    // Market vs model rank comparison
    let rankCompareHtml = '';
    if (r.market_rank && r.model_rank) {
      const diff = r.market_rank - r.model_rank;
      if (diff >= 2) {
        rankCompareHtml = `<span class="rank-compare better">Model beats market by ${diff}</span>`;
      } else if (diff <= -2) {
        rankCompareHtml = `<span class="rank-compare worse">Market prefers by ${Math.abs(diff)}</span>`;
      }
    }

    // Odds — id'd so live-odds polling can update in-place
    const oddsVal = r.best_available_odds && r.best_available_odds > 1 ? `$${r.best_available_odds.toFixed(1)}` : '';
    const oddsHtml = oddsVal
      ? `<span class="odds-pill" id="lo-odds-${r.tab_number}">${oddsVal}</span>` : `<span id="lo-odds-${r.tab_number}" style="display:none" class="odds-pill"></span>`;
    const valueBadgeHtml = `<span id="lo-val-${r.tab_number}" class="value-badge" style="display:none">VALUE</span>`;
    const resultBadgeHtml = `<span id="lo-res-${r.tab_number}" class="result-badge" style="display:none"></span>`;

    // Details row 1: barrier, jockey+rate, trainer+rate, weight
    const jRate = r.jockey_overall_rate != null ? ` <strong style="color:var(--gold-light)">${r.jockey_overall_rate.toFixed(0)}%</strong>` : '';
    const tRate = r.trainer_overall_rate != null ? ` <strong style="color:var(--gold-light)">${r.trainer_overall_rate.toFixed(0)}%</strong>` : '';
    const detailChips1 = [
      r.barrier ? `<span class="runner-detail-chip">🚪 B${r.barrier}</span>` : null,
      r.jockey ? `<span class="runner-detail-chip">Jockey: ${escHtml(r.jockey)}${jRate}</span>` : null,
      r.trainer ? `<span class="runner-detail-chip">Trainer: ${escHtml(r.trainer)}${tRate}</span>` : null,
      r.weight ? `<span class="runner-detail-chip">⚖ ${r.weight}kg</span>` : null,
    ].filter(Boolean).join('');

    // Details row 2: prep runs, distance win rate, class drop
    const distPct = r.win_rate_distance != null && r.win_rate_distance > 0
      ? `<span class="runner-detail-chip">${(r.win_rate_distance * 100).toFixed(0)}% at distance</span>` : null;
    const prepRuns = r.runs_this_prep != null
      ? `<span class="runner-detail-chip">Run ${r.runs_this_prep + 1} this prep</span>` : null;
    const classDrop = r.class_change === 1 ? `<span class="runner-detail-chip">↓ Class drop</span>` : null;
    const detailChips2 = [prepRuns, distPct, classDrop].filter(Boolean).join('');

    // Stats
    const statsItems = [
      r.speed_map_position ? { label: 'Speed', val: capitalize(r.speed_map_position.replace('_', ' ')) } : null,
      r.distance_aptitude ? { label: 'Apt', val: capitalize(r.distance_aptitude) } : null,
      r.sire_name && r.sire_name !== 'Unknown' ? { label: 'Sire', val: r.sire_name } : null,
      r.form_score != null ? { label: 'Form', val: (r.form_score * 100).toFixed(0) + '%' } : null,
      r.starts_last_10 > 0 ? { label: 'Last 10', val: `${r.wins_last_10}W / ${r.starts_last_10}` } : null,
      r.days_since_last_run != null && r.days_since_last_run < 999
        ? { label: 'Last run', val: `${r.days_since_last_run}d ago` } : null,
    ].filter(Boolean);

    const statsHtml = statsItems.map(s =>
      `<span class="stat-chip"><span class="dot"></span>${s.label}: <strong>${s.val}</strong></span>`
    ).join('');

    // Flags
    const FLAG_TIPS = {
      'VALUE OVERLAY': 'Model win probability is significantly higher than the implied market probability — potential value bet.',
      'Outstanding recent form': 'Weighted form score ≥ 0.75 — horse has been finishing near the front consistently.',
      'Ideal barrier': 'Inside or middle draw suits the horse\'s likely speed map position.',
      'Blinkers on first time': 'First-time blinkers often sharpen focus and produce improved sectionals.',
      'Dropping in class': 'Easier assignment than last start — likely to be more competitive.',
      'Resuming after': 'Horse is returning from a spell — watch for first-up fitness and trainer/sire record fresh.',
      'Race debutant': 'No prior race starts on record — unknown quantity, rely on market and trainer signals.',
      'International form': 'Overseas form can be hard to assess — watch how they handle Australian conditions.',
      'Wet track specialist': 'Strong record on soft or heavy going — an advantage if track conditions deteriorate.',
      'Stable in form': 'Multiple runners from this stable winning recently — yard is firing.',
      'Track bias advantage': 'Current rail position or track prep favours this horse\'s likely running position.',
      'Speed map advantage': 'Expected to find a comfortable position in the run based on field dynamics.',
      'Pure speed pedigree': 'Sire line suggests explosive early speed — well-suited to this trip.',
    };
    function _flagTip(f) {
      for (const key of Object.keys(FLAG_TIPS)) {
        if (f.includes(key)) return FLAG_TIPS[key];
      }
      return '';
    }
    const flags = r.key_flags || [];
    const flagsHtml = flags.map(f => {
      const tip = _flagTip(f);
      return tip
        ? `<span class="flag-chip" title="${escHtml(tip)}">${escHtml(f)}</span>`
        : `<span class="flag-chip">${escHtml(f)}</span>`;
    }).join('');

    // Narrative (collapsible, collapsed by default)
    const nid = `narr-${rank}-${r.tab_number}`;
    const narrativeHtml = r.narrative ? `
      <div class="narrative-section">
        <button class="narrative-toggle" onclick="toggleNarrative('${nid}', this)">
          Commentary
          <span class="narrative-toggle-icon">▼</span>
        </button>
        <div class="narrative-body" id="${nid}">
          <div class="narrative-text">${escHtml(r.narrative)}</div>
        </div>
      </div>` : '';

    return `
      <div class="runner-card${isTop ? ' top-pick' : ''}">
        <div class="runner-header">
          <div class="rank-badge ${rankClass}">${rank}</div>
          <div class="runner-main">
            <div class="runner-name">${escHtml(r.horse_name)}</div>
            <div class="runner-details">
              <span class="runner-detail-chip">#${r.tab_number}</span>
              ${detailChips1}
              ${rankCompareHtml}
              ${oddsHtml}
              ${valueBadgeHtml}
              ${resultBadgeHtml}
            </div>
            ${detailChips2 ? `<div class="runner-details" style="margin-top:2px;opacity:0.75">${detailChips2}</div>` : ''}
          </div>
          <div class="win-badge">
            ${winPct}%
            <small>Win</small>
          </div>
        </div>

        ${winPct >= 45 ? `<div style="margin:4px 0 2px;font-size:0.72rem;font-weight:700;color:#f97316">🔥 Hot Pick</div>`
          : winPct >= 35 ? `<div style="margin:4px 0 2px;font-size:0.72rem;font-weight:700;color:#60a5fa">⚡ High Confidence</div>`
          : winPct >= 30 ? `<div style="margin:4px 0 2px;font-size:0.72rem;font-weight:600;color:var(--text-secondary)">📈 Strong Pick</div>`
          : ''}

        <div class="prob-section">
          <div class="prob-row">
            <span class="prob-label">Win</span>
            <div class="prob-track"><div class="prob-fill win" style="width:${Math.min((winPct / 70) * 100, 100)}%"></div></div>
            <span class="prob-pct win">${winPct}%</span>
          </div>
          <div class="prob-row">
            <span class="prob-label">Place</span>
            <div class="prob-track"><div class="prob-fill place" style="width:${Math.min((placePct / 70) * 100, 100)}%"></div></div>
            <span class="prob-pct place">${placePct}%</span>
          </div>
        </div>

        ${statsHtml ? `<div class="stats-row">${statsHtml}</div>` : ''}
        ${flagsHtml ? `<div class="flags-row">${flagsHtml}</div>` : ''}
        ${narrativeHtml}
      </div>
    `;
  }

  // ── Util ──────────────────────────────────────────────────────────────────

  function renderLoadingHTML(msg) {
    return `<div class="loading-state"><div class="loading-ring"></div><div class="loading-text">${msg}</div></div>`;
  }

  function renderErrorHTML(title, detail) {
    return `<div class="error-state"><strong>${title}</strong>${detail ? `<p>${escHtml(detail)}</p>` : ''}</div>`;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function capitalize(s) {
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
  }

  function formatTime(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      return d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Australia/Sydney' });
    } catch { return iso.substring(11,16); }
  }

  function toggleNarrative(id, btn) {
    const body = document.getElementById(id);
    if (!body) return;
    const open = body.classList.toggle('open');
    btn.classList.toggle('open', open);
  }

  function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function scrollToRaces() {
    const el = document.getElementById('racesSection');
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  }

  // ── Drag-to-scroll for pills rows (desktop mouse users) ──────────────────
  (function addDragScroll() {
    let isDown = false, startX = 0, scrollLeft = 0, target = null;
    document.addEventListener('mousedown', e => {
      const row = e.target.closest('.pills-row');
      if (!row) return;
      isDown = true; target = row;
      startX = e.pageX - row.offsetLeft;
      scrollLeft = row.scrollLeft;
      row.style.cursor = 'grabbing';
      e.preventDefault();
    });
    document.addEventListener('mouseup', () => {
      if (target) target.style.cursor = '';
      isDown = false; target = null;
    });
    document.addEventListener('mouseleave', () => {
      if (target) target.style.cursor = '';
      isDown = false; target = null;
    });
    document.addEventListener('mousemove', e => {
      if (!isDown || !target) return;
      const x = e.pageX - target.offsetLeft;
      target.scrollLeft = scrollLeft - (x - startX);
    });
  })();

  // ── Start ─────────────────────────────────────────────────────────────────
  init();
</script>
</body>
</html>
