  let reviewsLoaded = false;
  let reviewsCache = [];          // list of review summaries from /api/admin/nightly-reviews
  let openReviews = new Set();    // 'YYYY-MM-DD::python' keys currently expanded
  let reviewDetails = {};         // key → full review (suggestions)
  let reviewFilter = 'all';       // 'all' | 'pending' | 'assessed' | 'applied' | 'dismissed'

  function buildReviewsPlaceholder() {
    return `
      <div class="nr-generate">
        <button class="btn" id="nrRunBtn" onclick="generateReviewNow()">Generate Weekly Review</button>
        <input type="date" id="nrGenDate" class="nr-notes" style="width:auto;margin:0;min-height:0;padding:6px 10px" title="Week-ending date (defaults to yesterday)"/>
        <button class="btn" onclick="generateReviewNow(true)">Run for week ending above</button>
        <span class="btn-status" id="nrStatus"></span>
      </div>

        <button class="nr-filter-btn"        data-filter="pending"  onclick="setReviewFilter('pending')">Has pending</button>
        <button class="nr-filter-btn"        data-filter="assessed" onclick="setReviewFilter('assessed')">Has assessed</button>
        <button class="nr-filter-btn"        data-filter="applied"  onclick="setReviewFilter('applied')">Has applied</button>
        <button class="nr-filter-btn"        data-filter="dismissed"onclick="setReviewFilter('dismissed')">Has dismissed</button>

      <div id="nrReviewsList" class="nr-empty">Loading…</div>
    `;
  }

  async function loadReviews() {
    reviewsLoaded = true;
    try {
      const url = reviewFilter === 'all'
        ? `${API}/api/admin/nightly-reviews?limit=60`
        : `${API}/api/admin/nightly-reviews?limit=60&status_filter=${reviewFilter}`;
      const res = await fetch(url, { headers: { 'x-cron-secret': adminSecret } });
      if (!res.ok) {
        document.getElementById('nrReviewsList').innerHTML =
          `<div class="nr-empty">Failed to load reviews (${res.status})</div>`;
        return;
      }
      const data = await res.json();
      // Weekly-only: filter out legacy nightly/claude reviews.
      reviewsCache = (data.reviews || []).filter(r => r.source === 'weekly');
      renderReviewsList();
    } catch (e) {
      document.getElementById('nrReviewsList').innerHTML =
        `<div class="nr-empty">${e.message}</div>`;
    }
  }

  function renderReviewsList() {
    const wrap = document.getElementById('nrReviewsList');
    if (!reviewsCache.length) {
      wrap.className = 'nr-empty';
      wrap.innerHTML = `No weekly reviews yet. Click <strong>Generate Weekly Review</strong> above.`;
      return;
    }
    wrap.className = '';
    wrap.innerHTML = reviewsCache.map(r => {
      const key = `${r.review_date}::${r.source}`;
      const isOpen = openReviews.has(key);
      const counts = r.status_counts || {};
      const chips = ['pending','assessed','applied','dismissed']
        .filter(k => counts[k])
        .map(k => `<span class="nr-status-chip ${k}">${counts[k]} ${k}</span>`)
        .join('');
      const wp = r.headline_stats?.rank1_win_pct;
      const pp = r.headline_stats?.rank1_place_pct;
      const races = r.headline_stats?.rank1_races_with_result ?? 0;
      const headlineLine = races
        ? `${races} rank-1 races · ${wp?.toFixed(1) ?? '—'}% win · ${pp?.toFixed(1) ?? '—'}% placed`
        : 'No rank-1 races on this date';
      return `
        <div class="nr-review ${isOpen ? 'open' : ''}" id="nr-${key.replace(/[^a-z0-9_-]/gi,'_')}">
          <div class="nr-review-header" onclick="toggleReview('${key}')">
            <div>
              <div class="nr-review-date">${r.review_date}
                <span class="nr-source-pill ${r.source}">${r.source}</span>
              </div>
              <div class="nr-review-meta">${headlineLine}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:0.72rem;color:var(--text-dim);margin-bottom:6px">${r.suggestion_count} suggestion${r.suggestion_count===1?'':'s'}</div>
              <div class="nr-status-counts">${chips}</div>
            </div>
          </div>
          <div class="nr-review-body" id="nr-body-${key.replace(/[^a-z0-9_-]/gi,'_')}">
            ${isOpen ? renderReviewBody(key) : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  async function toggleReview(key) {
    if (openReviews.has(key)) {
      openReviews.delete(key);
      renderReviewsList();
      return;
    }
    openReviews.add(key);
    if (!reviewDetails[key]) {
      const [date, source] = key.split('::');
      try {
        const res = await fetch(`${API}/api/admin/nightly-reviews/${date}?source=${source}`,
          { headers: { 'x-cron-secret': adminSecret } });
        if (res.ok) reviewDetails[key] = await res.json();
      } catch (e) { /* render-time will show placeholder */ }
    }
    renderReviewsList();
  }

  function renderReviewBody(key) {
    const detail = reviewDetails[key];
    if (!detail) return `<div class="nr-empty" style="padding:14px">Loading…</div>`;
    const head = detail.headline_stats || {};
    const hs = head.rank1_races_with_result
      ? `<strong>${head.rank1_wins}/${head.rank1_races_with_result}</strong> rank-1 wins
         (${head.rank1_win_pct?.toFixed(1) ?? '—'}%) ·
         <strong>${head.rank1_places}</strong> placed (${head.rank1_place_pct?.toFixed(1) ?? '—'}%)`
      : 'No rank-1 races settled on this date';
    const suggestions = (detail.suggestions || []).map(renderSuggestion).join('');
    return `
      <div class="nr-headline">${hs}</div>
      ${detail.suggestions?.length ? suggestions : `<div class="nr-empty">No suggestions on this date.</div>`}
    `;
  }

  function renderSuggestion(s) {
    const safeId = (s.id || '').replace(/[^a-z0-9_]/gi,'_');
    const statuses = ['pending','assessed','applied','dismissed'];
    const buttons = statuses.map(st =>
      `<button class="nr-action-btn ${s.status === st ? 'active ' + st : ''}"
               onclick="setSuggestionStatus('${s.id}', '${st}', this)">${st}</button>`
    ).join('');
    const evidence = (s.evidence && s.evidence.length)
      ? `<details class="nr-evidence"><summary>Evidence (${s.evidence.length})</summary>
         <pre>${escapeHtml(JSON.stringify(s.evidence, null, 2))}</pre></details>`
      : '';
    const codePtr = s.code_pointer
      ? `<div class="nr-sug-code">→ ${escapeHtml(s.code_pointer)}</div>`
      : '';
    return `
      <div class="nr-suggestion ${s.severity}" id="nr-sug-${safeId}" data-suggestion-id="${escapeAttr(s.id)}">
        <div class="nr-sug-head">
          <div>
            <div class="nr-sug-title">${escapeHtml(s.title)}</div>
            <div class="nr-sug-pattern">${escapeHtml(s.pattern_id)}</div>
          </div>
          <span class="nr-sug-sev ${s.severity}">${s.severity}</span>
        </div>
        <div class="nr-sug-body">${escapeHtml(s.rationale)}</div>
        ${codePtr}
        ${evidence}
        <div class="nr-paste-block" id="nr-paste-${safeId}">${escapeHtml(s.paste_prompt || '(no paste prompt)')}<button class="nr-paste-copy" onclick="copyPaste('${safeId}', this)">Copy</button></div>
        <div class="nr-sug-actions">${buttons}</div>
        <textarea class="nr-notes" placeholder="Notes — what did you change, what did you measure?"
                  onchange="updateNotes('${s.id}', this.value)">${escapeHtml(s.notes || '')}</textarea>
      </div>
    `;
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                     .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/"/g,'&quot;'); }

  function copyPaste(safeId, btn) {
    const blk = document.getElementById('nr-paste-' + safeId);
    if (!blk) return;
    const text = blk.childNodes[0]?.textContent || blk.innerText || '';
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
    }).catch(() => { btn.textContent = 'Failed'; });
  }

  async function setSuggestionStatus(suggestionId, status, btn) {
    const review = btn.closest('.nr-review');
    if (!review) return;
    // Read date + source from the visible header — the DOM id is a sanitised slug, not parseable.
    const date = review.querySelector('.nr-review-date')?.firstChild?.textContent?.trim();
    const source = review.querySelector('.nr-source-pill')?.textContent?.trim() || 'python';
    if (!date) return;
    try {
      const res = await fetch(
        `${API}/api/admin/nightly-reviews/${date}/suggestions/${encodeURIComponent(suggestionId)}?source=${source}`,
        {
          method: 'PATCH',
          headers: { 'x-cron-secret': adminSecret, 'Content-Type': 'application/json' },
          body: JSON.stringify({ status }),
        }
      );
      if (!res.ok) throw new Error(`${res.status}`);
      const data = await res.json();
      // Update local cache so re-render shows the new state.
      const cacheKey = `${date}::${source}`;
      if (reviewDetails[cacheKey]) {
        const idx = reviewDetails[cacheKey].suggestions.findIndex(s => s.id === suggestionId);
        if (idx >= 0) reviewDetails[cacheKey].suggestions[idx] = data.suggestion;
      }
      // Update the parent review's status_counts in the list.
      await loadReviews();
    } catch (e) {
      alert('Failed to update: ' + e.message);
    }
  }

      try {
        await fetch(
          `${API}/api/admin/nightly-reviews/${date}/suggestions/${encodeURIComponent(suggestionId)}?source=${source}`,
          {
            method: 'PATCH',
            headers: { 'x-cron-secret': adminSecret, 'Content-Type': 'application/json' },

          }

  async function runExoticBacktest() {
    const btn    = document.getElementById('eBacktestBtn');
    const status = document.getElementById('exoticStatus');
    const results = document.getElementById('exoticResults');

    btn.disabled = true;
    results.innerHTML = '<div class="loading"><div class="loading-spinner" style="border-top-color:var(--teal)"></div>Starting backtest…</div>';

    try {
      const startRes = await fetch(`${API}/api/admin/backtest-exotic/run`, {
        method: 'POST',
        headers: { 'x-cron-secret': adminSecret }
      });
      if (startRes.status === 403) {
        status.textContent = 'Unauthorised — check secret.';
        results.innerHTML = '';
        btn.disabled = false;
        return;
      }
      const startData = await startRes.json();
      if (startData.status === 'already_running') {
        status.textContent = 'Already running — ' + startData.progress;
      }

      // Poll status every 5s until done
      const startedAt = Date.now();
      await new Promise((resolve, reject) => {
        const poll = setInterval(async () => {
          try {
            const st = await fetch(`${API}/api/admin/backtest-exotic/status`, {
              headers: { 'x-cron-secret': adminSecret }
            });
            const s = await st.json();
            status.textContent = s.progress || 'Running…';
            results.innerHTML = `<div class="loading"><div class="loading-spinner" style="border-top-color:var(--teal)"></div>${s.progress || 'Training…'}</div>`;
            if (!s.running) {
              clearInterval(poll);
              if (s.error) reject(new Error(s.error));
              else resolve();
            }
          } catch (e) { clearInterval(poll); reject(e); }
        }, 5000);
      });

      // Load results from DB
      const [lastRes2, histRes2, dailyRes2] = await Promise.all([
        fetch(`${API}/api/admin/backtest-exotic/last`, { headers: { 'x-cron-secret': adminSecret } }),
        fetch(`${API}/api/admin/backtest-exotic/history?limit=14`, { headers: { 'x-cron-secret': adminSecret } }),
        fetch(`${API}/api/admin/exotic-daily-performance?days=14`, { headers: { 'x-cron-secret': adminSecret } }),
      ]);
      const { data, ran_at } = await lastRes2.json();
      if (!data) throw new Error('No results saved');
      const histData  = histRes2.ok  ? await histRes2.json()  : { history: [], drift: false };
      const dailyData = dailyRes2.ok ? await dailyRes2.json() : { summary: [] };
      status.textContent = `Done — best window: ${data.best_window}d, box hit rate: ${data.best_holdout_box_hit_rate}%`;
      results.innerHTML = renderExoticResults(data, ran_at, histData, dailyData);
      mountExoticCharts(histData, dailyData);
    } catch (e) {
      status.textContent = 'Error: ' + e.message;
      results.innerHTML = '';
    } finally {
      btn.disabled = false;
    }
  }

    // Best window tier breakdown
    const bestRow = d.window_results.find(w => w.window_days === d.best_window);

                <div class="tier-card-label">⚡ High (top 60%)</div>

          <td>${w.window_days}d${isBest ? '<span class="best-badge">Best</span>' : ''}</td>
          <td>${w.training_races?.toLocaleString() ?? '—'}</td>
          <td>${w.training_box_hit_rate ?? '—'}%</td>

    const trendHtml = hist.history?.length > 2 ? `
      <div class="section">
        <div class="section-title">Box Hit Rate Trend &nbsp;<span style="font-size:0.7rem;color:var(--gold-light)">● drift flagged</span> &nbsp;<span style="font-size:0.7rem;color:var(--blue)">● healthy</span></div>
        <div class="chart-card">
          <div class="chart-wrap" style="height:200px"><canvas id="exoticTrendChart"></canvas></div>
        </div>
      </div>` : '';

    // Daily performance charts
    daily = daily || { summary: [] };
    const perfHtml = daily.summary?.length ? `
      <div class="section">
        <div class="section-title">Last 14 Days — Daily Performance</div>
        <div class="two-col">

            <div class="chart-card-title">Box Hit Rate %</div>

              <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:rgba(239,68,68,0.4);margin-right:4px;vertical-align:middle"></span>&lt; 10% — below target</span>
            </div>
            <div class="chart-wrap"><canvas id="exoticHitRateChart"></canvas></div>
          </div>
          <div class="chart-card">
            <div class="chart-card-title">Daily Boxes — Hits vs Eligible</div>
            <div style="display:flex;gap:12px;margin-bottom:10px;font-size:0.7rem;color:var(--text-dim)">
              <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:rgba(20,184,166,0.6);margin-right:4px;vertical-align:middle"></span>Box hits</span>

            </div>
            <div class="chart-wrap"><canvas id="exoticHitsChart"></canvas></div>
            <div style="font-size:0.68rem;color:var(--text-dim);margin-top:10px;line-height:1.5">
              Races where the model's top-3 exotic picks exactly matched the actual trifecta box (positions 1–2–3). Hover to see counts per day.
            </div>
          </div>
        </div>
      </div>` : '';

    return statsHtml + trendHtml + perfHtml + tierHtml + windowHtml + ablationHtml + histHtml;
  }

  // Per-strategy hit stats across multiple time windows. Replaces the
  // earlier 'tomorrow's picks' widget — the dashboard's job is reflection
  // on what the algorithm has done, not predictions (those live on /lab).
  async function loadLabStats() {
    const target = document.getElementById('labStatsContent');
    if (!target) return;
    const WINDOWS = [
      { key: 7,   label: 'Last 7d' },
      { key: 30,  label: 'Last 30d' },
      { key: 365, label: 'All-time' },
    ];
    try {
      const responses = await Promise.all(WINDOWS.map(w =>
        fetch(`${API}/api/bet-insights/strategy-stats?days=${w.key}`)
          .then(r => r.ok ? r.json() : { strategies: [] })
      ));
      // Build {strategy_key: {window_key: stats}} matrix
      const data = {};
      WINDOWS.forEach((w, i) => {
        for (const s of (responses[i].strategies || [])) {
          if (!data[s.strategy]) data[s.strategy] = { label: s.label, windows: {} };
          data[s.strategy].windows[w.key] = s;
        }
      });
      // Stable order — Trio (default) first, then Stack, Quad, Spread,
      // then legacy strategies.
      const order = { trio: 0, stack: 1, quad: 2, spread: 3, sweep: 10, net: 11 };
      const strategyKeys = Object.keys(data).sort((a, b) =>
        (order[a] ?? 99) - (order[b] ?? 99)
      );
      if (!strategyKeys.length) {
        target.innerHTML = `<div style="padding:8px 0;color:var(--text-muted)">No paper-trading data yet. Bets are generated hourly during racing hours.</div>`;
        return;
      }
      const fmtPct = (v) => (v == null ? '—' : v.toFixed(1) + '%');
      const fmtMoney = (v) => (v == null ? '—' : '$' + Math.round(v).toLocaleString());
      const fmtRoi = (v) => {
        if (v == null) return '<span style="color:var(--text-muted)">—</span>';
        const col = v >= 0 ? 'var(--green-bright)' : '#f87171';
        const sign = v >= 0 ? '+' : '';
        return `<span style="color:${col};font-weight:700">${sign}${v.toFixed(1)}%</span>`;
      };
      // Header: one column per window, three rows per window: Races, Hit %, ROI
      const headerCells = WINDOWS.map(w =>
        `<th colspan="3" style="text-align:center;padding:6px 4px;border-bottom:1px solid var(--border);color:var(--text-dim);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.4px">${escHtml(w.label)}</th>`
      ).join('');
      const subHeader = WINDOWS.map(() => `
        <th style="text-align:right;padding:3px 6px;color:var(--text-muted);font-size:0.6rem;font-weight:500;text-transform:uppercase">Races</th>
        <th style="text-align:right;padding:3px 6px;color:var(--text-muted);font-size:0.6rem;font-weight:500;text-transform:uppercase">Hit %</th>
        <th style="text-align:right;padding:3px 6px;color:var(--text-muted);font-size:0.6rem;font-weight:500;text-transform:uppercase">ROI</th>
      `).join('');
      const bodyRows = strategyKeys.map(k => {
        const s = data[k];
        const cells = WINDOWS.map(w => {
          const stats = s.windows[w.key] || {};
          const races = stats.races_bet ?? 0;
          const hitRate = stats.race_hit_rate_pct;
          const roi = stats.roi_pct;
          const stake = stats.total_stake_dollars ?? 0;
          return `
            <td style="text-align:right;padding:6px 6px;font-variant-numeric:tabular-nums">${races}</td>
            <td style="text-align:right;padding:6px 6px;color:var(--text);font-weight:700;font-variant-numeric:tabular-nums">${fmtPct(hitRate)}</td>
            <td style="text-align:right;padding:6px 6px;font-variant-numeric:tabular-nums">${fmtRoi(roi)}</td>
          `;
        }).join('');
        return `
          <tr style="border-bottom:1px solid var(--border)">
            <td style="padding:8px 6px">
              <div style="font-weight:700;color:var(--text)">${escHtml(s.label)}</div>
              <div style="font-size:0.62rem;color:var(--text-muted)">${k === 'spread' ? '5 boxes/race ($10)' : k === 'sweep' ? '1 box/race ($2)' : ''}</div>
            </td>
            ${cells}
          </tr>`;
      }).join('');
      target.innerHTML = `
        <table style="width:100%;border-collapse:collapse;font-size:0.8rem">
          <thead>
            <tr>
              <th style="text-align:left;padding:6px 6px;border-bottom:1px solid var(--border);color:var(--text-dim);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.4px">Strategy</th>
              ${headerCells}
            </tr>
            <tr>
              <th></th>
              ${subHeader}
            </tr>
          </thead>
          <tbody>${bodyRows}</tbody>
        </table>
        <div style="font-size:0.65rem;margin-top:10px;color:var(--text-muted);line-height:1.4">
          Hit % = % of bet races where any box hit. ROI = (payout − stake) / stake on bets where the dividend has been entered.
          Until dividends start flowing for both strategies, ROI shows —.
        </div>`;
    } catch (e) {
      console.error('[labStats]', e);
      target.innerHTML = `<div style="color:var(--text-muted)">Could not load — ${escHtml(e.message)}</div>`;
    }
  }

  // Tiny escape used by loadTomorrowPicks — the rest of the dashboard uses
  // its own; defining a local one here keeps the snippet self-contained.
  function escHtml(s) {
    return (s == null ? '' : String(s))
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Init
  if (adminSecret) {
    loadDashboard();
  } else {
    document.getElementById('dashContent').style.display = 'none';
    document.getElementById('loginGate').style.display = '';
  }
</script>
</body>
</html>
