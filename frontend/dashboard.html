<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model Dashboard | FunkyIQ</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg-base:       #07090f;
      --bg-card:       #0e1220;
      --bg-elevated:   #1a2035;
      --border:        #1e2840;
      --gold:          #e8a020;
      --gold-light:    #f5b83a;
      --gold-dim:      rgba(232,160,32,0.12);
      --gold-mid:      rgba(232,160,32,0.28);
      --blue:          #3b82f6;
      --blue-dim:      rgba(59,130,246,0.14);
      --green:         #22c55e;
      --green-bright:  #4ade80;
      --green-dim:     rgba(34,197,94,0.12);
      --red:           #ef4444;
      --red-dim:       rgba(239,68,68,0.12);
      --purple:        #a855f7;
      --purple-dim:    rgba(168,85,247,0.12);
      --purple-bright: #c084fc;
      --teal:          #14b8a6;
      --teal-dim:      rgba(20,184,166,0.12);
      --text-primary:  #f0f4ff;
      --text-secondary:#8a9bc4;
      --text-dim:      #4a5a7a;
      --radius:        12px;
      --radius-sm:     8px;
      --shadow:        0 4px 24px rgba(0,0,0,0.5);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Nav ─────────────────────────────────────────────── */
    .nav {
      background: rgba(7,9,15,0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      padding: 0 16px;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; height: 52px; gap: 12px;
    }
    .nav-brand {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem; font-weight: 900;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-primary); text-decoration: none;
      display: flex; align-items: center; gap: 8px;
    }
    .nav-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 8px var(--blue); }
    .nav-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.9rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-dim);
    }
    .nav-back {
      font-size: 0.75rem; color: var(--text-dim);
      text-decoration: none;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600; letter-spacing: 0.05em;
      margin-left: auto;
    }
    .nav-back:hover { border-color: var(--blue); color: var(--blue); }

    /* ── Page ────────────────────────────────────────────── */
    .page { max-width: 1200px; margin: 0 auto; padding: 24px 16px 80px; }

    /* ── Login gate ──────────────────────────────────────── */
    .login-gate {
      max-width: 400px; margin: 80px auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
    }
    .login-gate-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.4rem; font-weight: 900;
      letter-spacing: 0.06em; text-transform: uppercase;
      margin-bottom: 8px;
    }
    .login-gate-sub { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 20px; }
    .login-input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      padding: 10px 14px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }
    .login-input:focus { border-color: var(--blue); }
    .login-btn {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none; cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 10px;
      border-radius: var(--radius-sm);
      transition: opacity 0.15s;
    }
    .login-btn:hover { opacity: 0.85; }
    .login-error { font-size: 0.75rem; color: #f87171; margin-top: 8px; }

    /* ── Model tabs ──────────────────────────────────────── */
    .model-tabs {
      display: flex; gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .model-tab {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 10px 20px;
      border: none; border-bottom: 2px solid transparent;
      background: none; cursor: pointer;
      color: var(--text-dim);
      transition: all 0.15s;
      margin-bottom: -1px;
    }
    .model-tab:hover { color: var(--text-secondary); }
    .model-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
    .model-tab.exotic.active { color: var(--teal); border-bottom-color: var(--teal); }
    .model-tab.reviews.active { color: var(--purple-bright); border-bottom-color: var(--purple-bright); }

    /* ── Nightly review styles ─────────────────────────────── */
    .nr-review { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
                 margin-bottom: 14px; overflow: hidden; }
    .nr-review-header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                        padding: 14px 16px; cursor: pointer; user-select: none;
                        background: linear-gradient(180deg, rgba(168,85,247,0.04), transparent); }
    .nr-review-header:hover { background: linear-gradient(180deg, rgba(168,85,247,0.08), transparent); }
    .nr-review-date { font-family: 'Barlow Condensed', sans-serif; font-size: 1.05rem; font-weight: 700;
                      letter-spacing: 0.04em; color: var(--text-primary); }
    .nr-review-meta { font-size: 0.72rem; color: var(--text-dim); }
    .nr-source-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.62rem;
                      font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
                      margin-left: 6px; }
    .nr-source-pill.python { background: rgba(59,130,246,0.18); color: var(--blue); }
    .nr-source-pill.claude { background: rgba(168,85,247,0.18); color: var(--purple-bright); }
    .nr-source-pill.weekly { background: rgba(34,197,94,0.16);  color: var(--green-bright); }
    .nr-status-counts { display: flex; gap: 6px; font-size: 0.7rem; }
    .nr-status-chip { padding: 3px 8px; border-radius: 10px; font-weight: 600; }
    .nr-status-chip.pending  { background: rgba(245,184,58,0.14); color: var(--gold-light); }
    .nr-status-chip.assessed { background: rgba(59,130,246,0.14); color: var(--blue); }
    .nr-status-chip.applied  { background: rgba(34,197,94,0.16);  color: var(--green-bright); }
    .nr-status-chip.dismissed{ background: rgba(74,90,122,0.20);  color: var(--text-secondary); }
    .nr-review-body { display: none; padding: 0 16px 16px 16px; border-top: 1px solid var(--border); }
    .nr-review.open .nr-review-body { display: block; }
    .nr-headline { margin: 14px 0 16px 0; padding: 10px 12px; background: var(--bg-elevated);
                   border-radius: var(--radius-sm); font-size: 0.78rem; color: var(--text-secondary); }
    .nr-headline strong { color: var(--text-primary); font-weight: 700; }
    .nr-suggestion { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm);
                     padding: 12px 14px; margin-bottom: 10px; }
    .nr-suggestion.high   { border-left: 3px solid var(--red); }
    .nr-suggestion.medium { border-left: 3px solid var(--gold-light); }
    .nr-suggestion.low    { border-left: 3px solid var(--text-dim); }
    .nr-sug-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
                   margin-bottom: 8px; flex-wrap: wrap; }
    .nr-sug-title { font-weight: 700; font-size: 0.92rem; color: var(--text-primary); }
    .nr-sug-pattern { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--text-dim);
                      margin-top: 2px; }
    .nr-sug-sev { font-size: 0.62rem; font-weight: 700; padding: 2px 8px; border-radius: 10px;
                  text-transform: uppercase; letter-spacing: 0.06em; }
    .nr-sug-sev.high   { background: rgba(239,68,68,0.18);  color: var(--red); }
    .nr-sug-sev.medium { background: rgba(245,184,58,0.18); color: var(--gold-light); }
    .nr-sug-sev.low    { background: rgba(74,90,122,0.25);  color: var(--text-secondary); }
    .nr-sug-body { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.55; }
    .nr-sug-code { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-dim);
                   margin-top: 6px; }
    .nr-paste-block { position: relative; margin-top: 10px; background: #07090f; border: 1px solid var(--border);
                      border-radius: var(--radius-sm); padding: 10px 12px; font-family: 'JetBrains Mono', monospace;
                      font-size: 0.72rem; color: var(--text-primary); line-height: 1.5;
                      max-height: 200px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
    .nr-paste-copy { position: absolute; top: 6px; right: 6px; background: var(--bg-elevated);
                     border: 1px solid var(--border); color: var(--text-secondary);
                     padding: 4px 10px; border-radius: 6px; font-size: 0.68rem; cursor: pointer; }
    .nr-paste-copy:hover { color: var(--text-primary); border-color: var(--purple); }
    .nr-paste-copy.copied { color: var(--green-bright); border-color: var(--green-bright); }
    .nr-evidence { margin-top: 8px; font-size: 0.7rem; }
    .nr-evidence summary { cursor: pointer; color: var(--text-dim); }
    .nr-evidence pre { margin-top: 6px; padding: 8px; background: #07090f; border-radius: var(--radius-sm);
                      font-size: 0.65rem; color: var(--text-secondary); overflow: auto; max-height: 180px; }
    .nr-sug-actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
    .nr-action-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary);
                     padding: 5px 12px; border-radius: 6px; font-size: 0.72rem; cursor: pointer; font-weight: 600; }
    .nr-action-btn:hover { color: var(--text-primary); border-color: var(--blue); }
    .nr-action-btn.active.pending  { color: var(--gold-light); border-color: var(--gold-light); background: rgba(245,184,58,0.10); }
    .nr-action-btn.active.assessed { color: var(--blue);       border-color: var(--blue);       background: rgba(59,130,246,0.10); }
    .nr-action-btn.active.applied  { color: var(--green-bright);border-color: var(--green-bright);background: rgba(34,197,94,0.12); }
    .nr-action-btn.active.dismissed{ color: var(--text-secondary); border-color: var(--text-secondary); background: rgba(74,90,122,0.18); }
    .nr-notes { width: 100%; margin-top: 10px; background: var(--bg-card); border: 1px solid var(--border);
                color: var(--text-primary); padding: 8px 10px; border-radius: var(--radius-sm); font-family: inherit;
                font-size: 0.78rem; resize: vertical; min-height: 36px; }
    .nr-filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0 16px 0; }
    .nr-filter-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary);
                     padding: 6px 12px; border-radius: 6px; font-size: 0.74rem; cursor: pointer; }
    .nr-filter-btn.active { color: var(--purple-bright); border-color: var(--purple-bright); background: rgba(168,85,247,0.10); }
    .nr-empty { padding: 30px 16px; text-align: center; color: var(--text-dim); font-size: 0.85rem; }
    .nr-generate { margin: 0 0 16px 0; display: flex; gap: 10px; flex-wrap: wrap; }

    /* ── Section ─────────────────────────────────────────── */
    .section { margin-bottom: 32px; }
    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem; font-weight: 800;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    /* ── Drift banner ────────────────────────────────────── */
    .drift-banner {
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 28px;
      font-size: 0.82rem;
    }
    .drift-banner.ok   { background: var(--green-dim);  border: 1px solid rgba(34,197,94,0.25); }
    .drift-banner.warn { background: rgba(232,160,32,0.1); border: 1px solid var(--gold-mid); }
    .drift-banner-icon { font-size: 1.2rem; }
    .drift-banner-text { flex: 1; line-height: 1.5; }
    .drift-banner-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.95rem; font-weight: 800;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .drift-banner.ok   .drift-banner-title { color: var(--green); }
    .drift-banner.warn .drift-banner-title { color: var(--gold-light); }
    .drift-banner-sub  { color: var(--text-secondary); font-size: 0.75rem; margin-top: 2px; }

    /* ── Stat grid ───────────────────────────────────────── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }
    .stat-card-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem; font-weight: 900;
      line-height: 1; margin-bottom: 4px;
    }
    .stat-card-label {
      font-size: 0.68rem; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .stat-card-sub {
      font-size: 0.7rem; color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ── Chart card ──────────────────────────────────────── */
    .chart-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .chart-card-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    .chart-wrap { position: relative; height: 220px; }

    /* ── Two col ─────────────────────────────────────────── */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

    /* ── Window table ────────────────────────────────────── */
    .window-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .window-table th {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.7rem; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-dim);
      padding: 6px 10px; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .window-table td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(30,40,64,0.5);
      color: var(--text-secondary);
    }
    .window-table tr:last-child td { border-bottom: none; }
    .window-table tr.best td { color: var(--text-primary); }
    .window-table .best-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.65rem; font-weight: 800;
      letter-spacing: 0.08em; text-transform: uppercase;
      background: var(--green-dim); color: var(--green);
      border: 1px solid rgba(34,197,94,0.25);
      border-radius: 999px; padding: 1px 7px;
      margin-left: 6px;
    }

    /* ── History table ───────────────────────────────────── */
    .history-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .history-table th {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.7rem; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-dim);
      padding: 6px 10px; text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .history-table td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(30,40,64,0.5);
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .history-table tr:last-child td { border-bottom: none; }
    .drift-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .drift-dot.ok   { background: var(--green); }
    .drift-dot.warn { background: var(--gold); }

    /* ── Drift explainer ─────────────────────────────────── */
    .drift-explainer {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-top: 12px;
    }
    .drift-explainer-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem; font-weight: 800;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--gold-light); margin-bottom: 10px;
    }
    .drift-explainer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px; margin-bottom: 12px;
    }
    .drift-explainer-item {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 0.75rem; color: var(--text-secondary); line-height: 1.5;
    }
    .drift-explainer-item strong { color: var(--text-primary); display: block; margin-bottom: 2px; font-size: 0.78rem; }
    .drift-explainer-note {
      font-size: 0.75rem; color: var(--text-dim); line-height: 1.6;
      border-top: 1px solid var(--border); padding-top: 10px;
    }
    .drift-explainer-note em { color: var(--text-secondary); font-style: normal; }

    /* ── Loading ─────────────────────────────────────────── */
    .loading {
      text-align: center; padding: 60px 20px;
      color: var(--text-dim);
    }
    .loading-spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Action bar ──────────────────────────────────────── */
    .action-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
    .btn {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.82rem; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 16px;
      cursor: pointer;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--blue); color: var(--blue); }
    .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn.primary:hover { opacity: 0.85; }
    .btn.teal { background: var(--teal); color: #fff; border-color: var(--teal); }
    .btn.teal:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-status { font-size: 0.72rem; color: var(--text-dim); align-self: center; }
    .action-explainers { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
    .action-explain { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 0.8rem; line-height: 1.6; color: var(--text-secondary); }
    .action-explain strong:first-child { display: block; color: var(--text-primary); font-size: 0.82rem; margin-bottom: 4px; }

    /* ── Exotic placeholder ──────────────────────────────── */
    .exotic-placeholder {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
    }
    .exotic-placeholder-icon { font-size: 2.5rem; margin-bottom: 14px; }
    .exotic-placeholder-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem; font-weight: 900;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--teal); margin-bottom: 8px;
    }
    .exotic-placeholder-sub { font-size: 0.8rem; color: var(--text-dim); line-height: 1.6; max-width: 420px; margin: 0 auto 20px; }

    /* ── Ablation verdict badges ─────────────────────────── */
    .verdict-valuable      { color: var(--green); font-weight: 600; }
    .verdict-noisy         { color: var(--red); font-weight: 600; }
    .verdict-neutral       { color: var(--text-dim); }
    .delta-pos             { color: var(--red); }
    .delta-neg             { color: var(--green); }

    /* ── Exotic tier cards ───────────────────────────────── */
    .tier-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px; margin-top: 16px;
    }
    .tier-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      text-align: center;
    }
    .tier-card-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.6rem; font-weight: 900; line-height: 1;
    }
    .tier-card-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
    .tier-card-sub { font-size: 0.68rem; color: var(--text-secondary); margin-top: 3px; }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand">
      <div class="nav-dot"></div>
      FunkyIQ
    </a>
    <span class="nav-title">Model Dashboard</span>
    <a href="/edge" class="nav-back">← The Edge</a>
  </div>
</nav>

<div class="page">

  <!-- Login gate -->
  <div id="loginGate" class="login-gate" style="display:none">
    <div class="login-gate-title">Admin Access</div>
    <div class="login-gate-sub">Enter the admin secret to view model performance data.</div>
    <input type="password" class="login-input" id="secretInput" placeholder="Admin secret" />
    <button class="login-btn" onclick="submitSecret()">Unlock Dashboard</button>
    <div class="login-error" id="loginError" style="display:none">Incorrect secret — try again.</div>
  </div>

  <!-- Dashboard content -->
  <div id="dashContent">
    <div class="loading">
      <div class="loading-spinner"></div>
      Loading dashboard…
    </div>
  </div>

</div>

<script>
  const API = 'https://web-production-dec62.up.railway.app';
  const SECRET_KEY = 'fiq_admin_secret';

  let adminSecret = sessionStorage.getItem(SECRET_KEY) || '';
  let activeTab = 'win';
  let exoticLoaded = false;

  function submitSecret() {
    const val = document.getElementById('secretInput').value.trim();
    if (!val) return;
    adminSecret = val;
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('dashContent').innerHTML = '<div class="loading"><div class="loading-spinner"></div>Loading dashboard…</div>';
    loadDashboard();
  }

  document.getElementById('secretInput')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') submitSecret();
  });

  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', timeZone: 'Australia/Sydney' });
  }

  function fmtDateTime(iso) {
    return new Date(iso + (iso.includes('Z') ? '' : 'Z')).toLocaleString('en-AU', {
      day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
      hour12: true, timeZone: 'Australia/Sydney'
    });
  }

  function pct(v) { return (v * 100).toFixed(1) + '%'; }

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById('tabWin').classList.toggle('active', tab === 'win');
    document.getElementById('tabExotic').classList.toggle('active', tab === 'exotic');
    document.getElementById('tabReviews').classList.toggle('active', tab === 'reviews');
    document.getElementById('tabQuality').classList.toggle('active', tab === 'quality');
    document.getElementById('tabFollowUps').classList.toggle('active', tab === 'followups');
    document.getElementById('panelWin').style.display = tab === 'win' ? '' : 'none';
    document.getElementById('panelExotic').style.display = tab === 'exotic' ? '' : 'none';
    document.getElementById('panelReviews').style.display = tab === 'reviews' ? '' : 'none';
    document.getElementById('panelQuality').style.display = tab === 'quality' ? '' : 'none';
    document.getElementById('panelFollowUps').style.display = tab === 'followups' ? '' : 'none';
    if (tab === 'exotic' && !exoticBacktestLoaded) loadExoticBacktest();
    if (tab === 'reviews' && !reviewsLoaded) loadReviews();
    if (tab === 'quality' && !qualityLoaded) loadQuality();
    if (tab === 'followups' && !followUpsLoaded) loadFollowUps();
  }

  // ═══════════════════════════════════════════════════════════
  //   WEEKLY REVIEW FOLLOW-UPS TAB
  // ═══════════════════════════════════════════════════════════
  let followUpsLoaded = false;

  function buildFollowUpsPlaceholder() {
    return `
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px">
        <button class="btn" onclick="loadFollowUps(true)">🔄 Refresh</button>
        <span class="btn-status" id="followUpsStatus"></span>
      </div>
      <div id="followUpsList">Loading…</div>
    `;
  }

  async function loadFollowUps(forceRefresh) {
    if (!forceRefresh) followUpsLoaded = true;
    try {
      const res = await fetch(`${API}/api/admin/weekly-review-followups`,
        { headers: { 'x-cron-secret': adminSecret } });
      const data = await res.json();
      renderFollowUps(data.rows || []);
    } catch (e) {
      document.getElementById('followUpsList').innerHTML =
        `<div class="nr-empty">Failed to load: ${e.message}</div>`;
    }
  }

  function daysUntil(dateStr) {
    if (!dateStr) return null;
    const target = new Date(dateStr + 'T00:00:00');
    const now = new Date();
    const diffMs = target.getTime() - now.getTime();
    return Math.round(diffMs / (1000 * 60 * 60 * 24));
  }

  function renderFollowUps(rows) {
    const wrap = document.getElementById('followUpsList');
    if (!rows.length) {
      wrap.innerHTML = `<div class="nr-empty">No follow-ups yet. Create one via POST /api/admin/weekly-review-followup/create.</div>`;
      return;
    }
    // Resolver cron now runs daily at 05:30 AEST — see main.py
    // scheduler.add_job(_scheduled_weekly_review_followup_check,
    // CronTrigger(hour=5, minute=30, ...)). No day-of-week math needed
    // any more; if the row's scheduled_for has passed, the next 05:30
    // will fire it.
    wrap.innerHTML = rows.map(r => {
      const measured = r.measured_at != null;
      const days = daysUntil(r.scheduled_for);
      const isCandidate = (r.measurement_type || '').startsWith('candidate_review_');
      let statusChip;
      if (measured) {
        // context_changed = drift detected by _recontextualise_followup;
        // measurement was skipped. Purple to distinguish from the four
        // "real result" verdicts and read as "situation moved" not "bad".
        const vColor = r.verdict === 'fixed' ? '#22c55e'
          : r.verdict === 'partial' ? '#f59e0b'
          : r.verdict === 'worse' ? '#ef4444'
          : r.verdict === 'context_changed' ? '#a855f7'
          : 'var(--text-dim)';
        const vLabel = r.verdict === 'fixed' ? '✓ FIXED'
          : r.verdict === 'partial' ? '~ PARTIAL'
          : r.verdict === 'worse' ? '✗ WORSE'
          : r.verdict === 'context_changed' ? '⤳ CONTEXT CHANGED'
          : '— UNCHANGED';
        statusChip = `<span style="background:${vColor}20;color:${vColor};border:1px solid ${vColor};padding:3px 10px;border-radius:999px;font-size:0.75rem;font-weight:700">${vLabel}</span>`;
      } else if (isCandidate) {
        // Candidate reviews are human-gated, not cron-gated — no fire date.
        statusChip = `<span style="background:rgba(139,92,246,0.14);color:#c4b5fd;border:1px solid rgba(139,92,246,0.35);padding:3px 10px;border-radius:999px;font-size:0.75rem;font-weight:600">👀 Awaiting review</span>`;
      } else if (days > 0) {
        statusChip = `<span style="background:rgba(245,200,66,0.14);color:#f5c842;border:1px solid rgba(245,200,66,0.35);padding:3px 10px;border-radius:999px;font-size:0.75rem;font-weight:600">⏳ Fires in ${days}d · daily 05:30 cron</span>`;
      } else if (days === 0) {
        statusChip = `<span style="background:rgba(59,130,246,0.14);color:#60a5fa;border:1px solid rgba(59,130,246,0.35);padding:3px 10px;border-radius:999px;font-size:0.75rem;font-weight:600">Due today · daily 05:30 cron</span>`;
      } else {
        statusChip = `<span style="background:rgba(239,68,68,0.14);color:#ef4444;border:1px solid rgba(239,68,68,0.35);padding:3px 10px;border-radius:999px;font-size:0.75rem;font-weight:600">Overdue by ${-days}d — next 05:30 cron</span>`;
      }
      const outcomeBlock = measured ? `
        <div style="margin-top:12px;padding:12px;background:rgba(59,130,246,0.06);border-left:3px solid #60a5fa;border-radius:4px">
          <div style="font-size:0.75rem;color:#60a5fa;text-transform:uppercase;letter-spacing:0.03em;font-weight:700;margin-bottom:4px">Measurement</div>
          <div style="font-size:0.9rem"><strong>${r.measured_value}</strong> vs baseline ${r.baseline_value} ${r.target_below ? `(target: <${r.target_below})` : (r.target_above ? `(target: >${r.target_above})` : '')}</div>
          <div style="font-size:0.75rem;color:var(--text-dim);margin-top:4px">Measured ${(r.measured_at || '').slice(0,16).replace('T',' ')}</div>
          ${r.next_action_md ? `<div style="margin-top:8px;font-size:0.85rem"><strong>Next action:</strong> ${escHtml(r.next_action_md)}</div>` : ''}
        </div>` : `
        <div style="margin-top:12px;padding:12px;background:var(--bg-elevated);border-radius:4px">
          <div style="font-size:0.75rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.03em;font-weight:600;margin-bottom:4px">Will measure on ${escHtml(r.scheduled_for)}</div>
          <div style="font-size:0.8rem;color:var(--text-secondary)">Metric: ${escHtml(r.measurement_type || '')} · baseline ${r.baseline_value} ${r.target_below ? `· target <${r.target_below}` : (r.target_above ? `· target >${r.target_above}` : '')}</div>
        </div>`;
      // Model-artefact candidate reviews get promote/reject buttons in
      // addition to the standard card content. measurement_type prefix
      // "candidate_review_<artefact>" carries the artefact (e.g. isotonic)
      // and the title trailing "#<id>" carries the DB row id.
      let candidateActions = '';
      // Buttons render only when the follow-up hasn't been resolved.
      // Check measured_at (the WeeklyReviewFollowUpRow "decided" field
      // set by _close_candidate_review_followup on promote/reject),
      // NOT reviewed_at (which lives on the candidate row, not the
      // follow-up row — the prior check evaluated as !undefined every
      // time and the buttons never hid).
      if ((r.measurement_type || '').startsWith('candidate_review_') && !r.measured_at) {
        const artefact = (r.measurement_type || '').replace('candidate_review_', '');
        // Weight candidate titles use a full UUID (#abc12345-1234-4567-89ab-...);
        // isotonic uses a numeric row id (#47). Match either.
        const idMatch = (r.title || '').match(/#([0-9a-f-]+)/i);
        const candidateId = idMatch ? idMatch[1] : null;
        // Weight candidates live under /api/admin/weight-candidate/{id};
        // other artefacts use /api/admin/{artefact}-candidate/{id}. Route
        // accordingly so buttons hit the right endpoint.
        const isWeights = artefact.endsWith('_weights');
        const inspectUrl = isWeights
          ? `${API}/api/admin/weight-candidate/${candidateId}`
          : `${API}/api/admin/${artefact}-candidate/${candidateId}`;
        if (candidateId) {
          candidateActions = `
            <div style="margin-top:12px;padding:10px;background:rgba(139,92,246,0.06);border:1px dashed rgba(139,92,246,0.35);border-radius:6px">
              <div style="font-size:0.75rem;color:#c4b5fd;text-transform:uppercase;letter-spacing:0.03em;font-weight:700;margin-bottom:8px">Model Release Gate — Human Review Required</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn" style="background:#22c55e20;border-color:#22c55e;color:#22c55e" onclick="reviewCandidate('${artefact}', '${candidateId}', 'promote')">✓ Promote</button>
                <button class="btn" style="background:#ef444420;border-color:#ef4444;color:#ef4444" onclick="reviewCandidate('${artefact}', '${candidateId}', 'reject')">✗ Reject</button>
                <a class="btn" style="text-decoration:none" href="${inspectUrl}" target="_blank">🔍 Inspect</a>
              </div>
            </div>`;
        }
      }
      return `
        <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;flex-wrap:wrap">
            <div style="font-weight:700;font-size:1rem">${escHtml(r.title || '(untitled)')}</div>
            ${statusChip}
          </div>
          <div style="font-size:0.83rem;color:var(--text-secondary);margin-bottom:6px"><strong>Context:</strong> ${escHtml(r.context_md || '')}</div>
          <div style="font-size:0.83rem;color:var(--text-secondary)"><strong>Applied:</strong> ${escHtml(r.action_md || '')}</div>
          ${candidateActions}
          ${outcomeBlock}
        </div>`;
    }).join('');
  }

  async function reviewCandidate(artefact, candidateId, action) {
    const label = action === 'promote' ? 'PROMOTE' : 'REJECT';
    const note = prompt(`${label} ${artefact} candidate #${candidateId}?\n\nOptional reviewer note:`, '');
    if (note === null) return; // cancelled
    // Weight candidates use /api/admin/weight-candidate/{batch_id}/{action}
    // (the endpoint pattern is model-type-agnostic; the batch_id encodes
    // which model_type it targets). Other artefacts (isotonic) use the
    // per-artefact path /api/admin/{artefact}-candidate/{id}/{action}.
    // The batch_id parameter for weight endpoints is looked up server-side
    // from the short id via a LIKE match — but we already have the short
    // id from the title, so pass it as candidateId directly.
    const isWeights = artefact.endsWith('_weights');
    try {
      const url = isWeights
        ? `${API}/api/admin/weight-candidate/${candidateId}/${action}?note=${encodeURIComponent(note)}`
        : `${API}/api/admin/${artefact}-candidate/${candidateId}/${action}?note=${encodeURIComponent(note)}`;
      const res = await fetch(url, { method: 'POST', headers: { 'x-cron-secret': adminSecret } });
      const body = await res.json();
      if (!res.ok) {
        alert(`Failed: ${body.detail || res.status}`);
        return;
      }
      alert(`${label} succeeded — reload follow-ups.`);
      followUpsLoaded = false;
      loadFollowUps();
    } catch (e) {
      alert(`Request failed: ${e}`);
    }
  }

  // ═══════════════════════════════════════════════════════════
  //   MORNING REPORT / QUALITY CHECK TAB
  // ═══════════════════════════════════════════════════════════
  let qualityLoaded = false;

  function buildQualityPlaceholder() {
    return `
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px">
        <button class="btn" onclick="loadQuality(true)">🔄 Refresh</button>
        <button class="btn" onclick="fireQualityHealNow()">⚡ Run & Heal Now</button>
        <span class="btn-status" id="qualityStatus"></span>
      </div>
      <div id="qualityReport">Loading morning report…</div>
      <div id="qualityHistory" style="margin-top:24px"></div>
    `;
  }

  async function loadQuality(forceRefresh) {
    if (!forceRefresh) qualityLoaded = true;
    try {
      const [reportRes, historyRes] = await Promise.all([
        fetch(`${API}/api/admin/morning-report`, { headers: { 'x-cron-secret': adminSecret } }),
        fetch(`${API}/api/admin/quality-check/history?limit=14`, { headers: { 'x-cron-secret': adminSecret } }),
      ]);
      const report = await reportRes.json();
      const history = await historyRes.json();
      renderQualityReport(report);
      renderQualityHistory(history);
    } catch (e) {
      document.getElementById('qualityReport').innerHTML =
        `<div class="nr-empty">Failed to load: ${e.message}</div>`;
    }
  }

  function renderQualityReport(report) {
    const wrap = document.getElementById('qualityReport');
    if (report.status === 'no_data') {
      wrap.innerHTML = `<div class="nr-empty">${escHtml(report.note || 'No data yet.')}</div>`;
      return;
    }
    const verdictColor = report.verdict === 'all_clear' ? '#22c55e'
      : report.verdict === 'warnings_only' ? '#f59e0b'
      : '#ef4444';
    const verdictLabel = report.verdict === 'all_clear' ? '✓ All clear'
      : report.verdict === 'warnings_only' ? '⚠ Warnings only'
      : '✗ Critical';
    const snap = report.health_snapshot || {};
    const healed = report.auto_healed || [];
    const needs = report.still_needs_attention || {};
    const critical = needs.critical || [];
    const warning = needs.warning || [];

    wrap.innerHTML = `
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px">
          <div>
            <span style="font-size:1.15rem;font-weight:700;color:${verdictColor}">${verdictLabel}</span>
            <span style="color:var(--text-dim);font-size:0.85rem;margin-left:12px">for ${escHtml(report.date || '?')}</span>
          </div>
          <div style="font-size:0.75rem;color:var(--text-dim)">Ran ${escHtml(report.ran_at || 'never')}</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px">
          <div style="background:var(--bg-elevated);padding:10px;border-radius:8px">
            <div style="font-size:0.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em">Coverage</div>
            <div style="font-size:1.15rem;font-weight:700">${snap.prediction_coverage_pct ?? '—'}%</div>
          </div>
          <div style="background:var(--bg-elevated);padding:10px;border-radius:8px">
            <div style="font-size:0.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em">Rank-1 win rate</div>
            <div style="font-size:1.15rem;font-weight:700">${snap.rank1_win_rate_pct ?? '—'}%</div>
          </div>
          <div style="background:var(--bg-elevated);padding:10px;border-radius:8px">
            <div style="font-size:0.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em">Internal URLs</div>
            <div style="font-size:1.15rem;font-weight:700">${escHtml(String(snap.url_health_internal || '—'))}</div>
          </div>
          <div style="background:var(--bg-elevated);padding:10px;border-radius:8px">
            <div style="font-size:0.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em">External URLs</div>
            <div style="font-size:1.15rem;font-weight:700">${escHtml(String(snap.url_health_external || '—'))}</div>
          </div>
        </div>
      </div>

      ${healed.length ? `
      <div style="background:var(--bg-card);border:1px solid rgba(34,197,94,0.30);border-radius:var(--radius);padding:16px;margin-bottom:16px">
        <div style="font-weight:700;color:#22c55e;margin-bottom:10px">✓ Auto-healed (${healed.length})</div>
        ${healed.map(h => `
          <div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:0.85rem">
            <strong>${escHtml(h.issue)}</strong> — ${escHtml(h.action)} (${h.affected} row${h.affected === 1 ? '' : 's'})
          </div>`).join('')}
      </div>` : ''}

      ${critical.length ? `
      <div style="background:var(--bg-card);border:1px solid rgba(239,68,68,0.30);border-radius:var(--radius);padding:16px;margin-bottom:16px">
        <div style="font-weight:700;color:#ef4444;margin-bottom:10px">✗ Still needs attention — CRITICAL (${critical.length})</div>
        ${critical.map(f => `
          <div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:0.85rem">
            <div><strong>${escHtml(f.check)}</strong> ${f.n_races ? `— ${f.n_races} races` : ''}${f.n_urls ? `— ${f.n_urls} URLs` : ''}${f.n_pairs ? `— ${f.n_pairs} pairs` : ''}</div>
            <div style="color:var(--text-secondary);font-size:0.8rem;margin-top:3px">${escHtml(f.reason || '')}</div>
            ${f.remediation ? `<div style="color:var(--text-dim);font-size:0.75rem;margin-top:3px;font-family:monospace">${escHtml(f.remediation)}</div>` : ''}
          </div>`).join('')}
      </div>` : ''}

      ${warning.length ? `
      <div style="background:var(--bg-card);border:1px solid rgba(245,158,11,0.30);border-radius:var(--radius);padding:16px;margin-bottom:16px">
        <div style="font-weight:700;color:#f59e0b;margin-bottom:10px">⚠ Warnings (${warning.length})</div>
        ${warning.map(f => `
          <div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:0.85rem">
            <div><strong>${escHtml(f.check)}</strong> ${f.n_races ? `— ${f.n_races} races` : ''}</div>
            <div style="color:var(--text-secondary);font-size:0.78rem;margin-top:2px">${escHtml(f.reason || '')}</div>
          </div>`).join('')}
      </div>` : ''}
    `;
  }

  function renderQualityHistory(data) {
    const wrap = document.getElementById('qualityHistory');
    const rows = data.rows || [];
    if (!rows.length) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = `
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px">
        <div style="font-weight:700;margin-bottom:10px">History (last 14 days)</div>
        <table style="width:100%;font-size:0.85rem;border-collapse:collapse">
          <thead>
            <tr style="color:var(--text-dim);text-align:left">
              <th style="padding:6px 8px">Date</th>
              <th style="padding:6px 8px;text-align:right">Critical</th>
              <th style="padding:6px 8px;text-align:right">Warning</th>
              <th style="padding:6px 8px;text-align:right">Info</th>
              <th style="padding:6px 8px">Ran</th>
            </tr>
          </thead>
          <tbody>
          ${rows.map(r => `
            <tr style="border-top:1px solid var(--border)">
              <td style="padding:6px 8px"><strong>${escHtml(r.check_date)}</strong></td>
              <td style="padding:6px 8px;text-align:right;color:${r.critical_count ? '#ef4444' : 'var(--text-dim)'}">${r.critical_count}</td>
              <td style="padding:6px 8px;text-align:right;color:${r.warning_count ? '#f59e0b' : 'var(--text-dim)'}">${r.warning_count}</td>
              <td style="padding:6px 8px;text-align:right;color:var(--text-dim)">${r.info_count}</td>
              <td style="padding:6px 8px;color:var(--text-dim);font-size:0.75rem">${escHtml((r.ran_at || '').slice(0,16).replace('T',' '))}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  async function fireQualityHealNow() {
    const status = document.getElementById('qualityStatus');
    status.textContent = 'Running…';
    try {
      // Yesterday date for a heal pass
      const d = new Date();
      d.setDate(d.getDate() - 1);
      const iso = d.toLocaleDateString('en-CA', { timeZone: 'Australia/Sydney' });
      const res = await fetch(`${API}/api/admin/quality-check?date=${iso}&heal=true`, {
        headers: { 'x-cron-secret': adminSecret },
      });
      const data = await res.json();
      const applied = data.summary?.heals_applied ?? 0;
      status.textContent = `Done — ${applied} heals applied. Refreshing…`;
      await loadQuality(true);
      status.textContent = '';
    } catch (e) {
      status.textContent = 'Failed: ' + e.message;
    }
  }

  let exoticBacktestLoaded = false;

  async function loadExoticBacktest() {
    exoticBacktestLoaded = true;
    try {
      const [lastRes, histRes, dailyRes] = await Promise.all([
        fetch(`${API}/api/admin/backtest-exotic/last`, { headers: { 'x-cron-secret': adminSecret } }),
        fetch(`${API}/api/admin/backtest-exotic/history?limit=14`, { headers: { 'x-cron-secret': adminSecret } }),
        fetch(`${API}/api/admin/exotic-daily-performance?days=14`, { headers: { 'x-cron-secret': adminSecret } }),
      ]);
      if (!lastRes.ok) return;
      const { data, ran_at } = await lastRes.json();
      if (!data) return;
      const histData  = histRes.ok  ? await histRes.json()  : { history: [], drift: false };
      const dailyData = dailyRes.ok ? await dailyRes.json() : { summary: [] };
      const results = document.getElementById('exoticResults');
      const status  = document.getElementById('exoticStatus');
      if (results) results.innerHTML = renderExoticResults(data, ran_at, histData, dailyData);
      if (status) status.textContent = '';
      mountExoticCharts(histData, dailyData);
    } catch (e) { /* silently skip if unavailable */ }
  }

  async function loadDashboard() {
    try {
      const [calRes, perfRes, analysisRes, prodRes, premRes] = await Promise.all([
        fetch(`${API}/api/admin/calibration/history?limit=14`, { headers: { 'x-cron-secret': adminSecret } }),
        fetch(`${API}/api/performance?days=30`),
        fetch(`${API}/api/admin/backtest/analysis`, { headers: { 'x-cron-secret': adminSecret } }),
        // Production model accuracy — actual deployed weights tested on holdout.
        // Different number from the calibration sweep because production
        // trains on all data (days=0), not a fixed window.
        fetch(`${API}/api/admin/backtest/feature-ablation?holdout_days=14`, { headers: { 'x-cron-secret': adminSecret } }),
        // Live premium tier performance — what users actually see.
        fetch(`${API}/api/performance/premium/public`),
      ]);

      if (calRes.status === 403) {
        sessionStorage.removeItem(SECRET_KEY);
        document.getElementById('dashContent').style.display = 'none';
        document.getElementById('loginGate').style.display = '';
        document.getElementById('loginError').style.display = '';
        return;
      }

      const calData      = calRes.ok      ? await calRes.json()      : null;
      const perfData     = perfRes.ok     ? await perfRes.json()     : null;
      const analysisData = analysisRes.ok ? await analysisRes.json() : null;
      const prodData     = prodRes.ok     ? await prodRes.json()     : null;
      const premData     = premRes.ok     ? await premRes.json()     : null;

      sessionStorage.setItem(SECRET_KEY, adminSecret);
      renderShell(calData, perfData, analysisData, prodData, premData);
    } catch (e) {
      document.getElementById('dashContent').innerHTML =
        `<div class="loading"><div style="font-size:1.5rem;margin-bottom:10px">⚠️</div>${e.message}</div>`;
    }
  }

  function renderShell(calData, perfData, analysisData, prodData, premData) {
    const winContent     = buildWinContent(calData, perfData, analysisData, prodData, premData);
    const exoContent     = buildExoticPlaceholder();
    const reviewsContent = buildReviewsPlaceholder();
    const qualityContent = buildQualityPlaceholder();
    const followUpsContent = buildFollowUpsPlaceholder();

    document.getElementById('dashContent').innerHTML = `
      <div class="model-tabs">
        <button class="model-tab active" id="tabWin" onclick="switchTab('win')">Win &amp; Placement</button>
        <button class="model-tab exotic" id="tabExotic" onclick="switchTab('exotic')">Exotics (beta)</button>
        <button class="model-tab reviews" id="tabReviews" onclick="switchTab('reviews')">Weekly Reviews</button>
        <button class="model-tab reviews" id="tabQuality" onclick="switchTab('quality')">Morning Report</button>
        <button class="model-tab reviews" id="tabFollowUps" onclick="switchTab('followups')">Follow-Ups</button>
      </div>
      <div id="panelWin">${winContent}</div>
      <div id="panelExotic" style="display:none">${exoContent}</div>
      <div id="panelReviews" style="display:none">${reviewsContent}</div>
      <div id="panelQuality" style="display:none">${qualityContent}</div>
      <div id="panelFollowUps" style="display:none">${followUpsContent}</div>
    `;

    mountWinCharts(calData, perfData);
    if (typeof refreshSiteWarnStatus === 'function') refreshSiteWarnStatus();
    // Lab hit-stats lives in the Exotic panel — call AFTER innerHTML is
    // set so the target div exists. The panel is hidden on initial load
    // (Win tab is default) but the table populates underneath so it's
    // ready when the user clicks Exotics.
    loadLabStats();
  }

  /* ═══════════════════════════════════════════════════════
     WIN & PLACEMENT TAB
  ══════════════════════════════════════════════════════════ */

  function buildWinContent(calData, perfData, analysisData, prodData, premData) {
    const cals   = calData?.calibrations || [];
    const latest = cals[0] || null;

    // ── Live Performance card — the only numbers that reflect what users see.
    //   - Production win rate (actual deployed weights, from feature-ablation)
    //   - Premium tier ROI / PnL / win rate (rolling 30d, what users would bet)
    //   - High-confidence threshold (≥30%) win rate / ROI from backtest analysis
    let productionHtml = '';
    if (prodData?.baseline_win_rate_pct != null || premData?.win_pct != null) {
      const winPct  = prodData?.baseline_win_rate_pct;
      const races   = prodData?.holdout_races;
      const winCol  = winPct == null ? 'var(--text-dim)'
                    : winPct >= 30   ? 'var(--green-bright)'
                    : winPct >= 25   ? 'var(--gold-light)' : '#f87171';
      const premRoi = premData?.roi_pct;
      const premCol = premRoi == null ? 'var(--text-dim)'
                    : premRoi >= 10   ? 'var(--green-bright)'
                    : premRoi >= 0    ? 'var(--gold-light)' : '#f87171';
      // Find the ≥30% threshold row for a "high-confidence" lift card
      const t30 = (analysisData?.thresholds || []).find(t => t.threshold_pct === 30);
      const t30Col = t30?.roi_pct == null ? 'var(--text-dim)'
                   : t30.roi_pct >= 10    ? 'var(--green-bright)'
                   : t30.roi_pct >= 0     ? 'var(--gold-light)' : '#f87171';

      productionHtml = `
        <div class="section">
          <div class="section-title">Live Performance — What Users See</div>
          <div class="stat-grid">
            ${winPct != null ? `
            <div class="stat-card">
              <div class="stat-card-num" style="color:${winCol}">${winPct.toFixed(1)}%</div>
              <div class="stat-card-label">Production Win Rate</div>
              <div class="stat-card-sub">Top-1 pick · ${races?.toLocaleString() ?? '—'} holdout races · last 14d</div>
            </div>` : ''}
            ${premData ? `
            <div class="stat-card">
              <div class="stat-card-num" style="color:${premCol}">${premRoi != null ? premRoi.toFixed(1) + '%' : '—'}</div>
              <div class="stat-card-label">Premium Tier ROI (SP)</div>
              <div class="stat-card-sub">${premData.bets ?? 0} picks · ${premData.win_pct?.toFixed(1) ?? '—'}% win · last 30d</div>
            </div>
            ${premData.roi_pct_bao != null ? (() => {
              const baoRoi = premData.roi_pct_bao;
              const baoCol = baoRoi >= 10 ? 'var(--green-bright)'
                          : baoRoi >= 0 ? 'var(--gold-light)' : '#f87171';
              const cov = premData.bao_coverage_pct ?? 0;
              // Warn when coverage is thin so the reader knows the number
              // is mostly SP-fallback and won't overreact to a small delta.
              const covWarn = cov < 30 ? ` <span style="color:#f5c842">(mostly SP fallback)</span>` : '';
              return `
                <div class="stat-card">
                  <div class="stat-card-num" style="color:${baoCol}">${baoRoi.toFixed(1)}%</div>
                  <div class="stat-card-label">Premium Tier ROI (BAO)</div>
                  <div class="stat-card-sub">Coverage ${cov.toFixed(1)}%${covWarn} · avg BAO $${premData.avg_bao?.toFixed(2) ?? '—'}</div>
                </div>`;
            })() : ''}
            <div class="stat-card">
              <div class="stat-card-num" style="color:${premData.pnl_at_10 >= 0 ? 'var(--green-bright)' : '#f87171'}">$${(premData.pnl_at_10 ?? 0).toFixed(0)}</div>
              <div class="stat-card-label">Premium PnL @ \$10 stake</div>
              <div class="stat-card-sub">Last 30d · avg SP $${premData.avg_sp?.toFixed(2) ?? '—'}</div>
            </div>` : ''}
            ${t30 ? `
            <div class="stat-card">
              <div class="stat-card-num" style="color:${t30Col}">${t30.roi_pct?.toFixed(1) ?? '—'}%</div>
              <div class="stat-card-label">≥30% Conf ROI</div>
              <div class="stat-card-sub">${t30.bets?.toLocaleString() ?? '—'} bets all-time · ${t30.win_pct?.toFixed(1) ?? '—'}% win</div>
            </div>` : ''}
          </div>
          <div style="font-size:0.7rem;color:var(--text-dim);margin-top:8px;line-height:1.5">
            These are the user-facing metrics. The calibration section below shows the model's training-time numbers (fresh retrain on a fixed window) — useful for understanding model behaviour but NOT what users experience.
          </div>
        </div>`;
    }

    // Drift banner
    let driftHtml = '';
    if (latest) {
      if (latest.drift_flag) {
        driftHtml = `
          <div class="drift-banner warn">
            <div class="drift-banner-icon">⚠️</div>
            <div class="drift-banner-text">
              <div class="drift-banner-title">Drift Detected</div>
              <div class="drift-banner-sub">${latest.drift_reason || 'Value ROI dropped below 4-week average'} &nbsp;·&nbsp; Last run ${fmtDateTime(latest.ran_at)}</div>
            </div>
          </div>
          <div class="drift-explainer">
            <div class="drift-explainer-title">What does drift mean?</div>
            <div class="drift-explainer-grid">
              <div class="drift-explainer-item">
                <strong>What drift measures</strong>
                Today's Value ROI versus the 4-week rolling average of past calibration runs. It's a profitability benchmark, not a model quality check.
              </div>
              <div class="drift-explainer-item">
                <strong>Best window vs drift</strong>
                These are independent signals. The 30d window winning every day means the model is well-tuned. Drift just means this week is less profitable than a strong patch 3–4 weeks ago.
              </div>
              <div class="drift-explainer-item">
                <strong>Most likely cause</strong>
                A high-ROI period from late April is rolling off the 4-week window. As it drops out, the average falls to meet current performance and the flag clears automatically.
              </div>
              <div class="drift-explainer-item">
                <strong>Real health signals</strong>

            </div>
            <div class="drift-explainer-note">
              Drift is assessed nightly after calibration. The flag is raised when today's Value ROI (or win rate) drops more than 5% below the average of the previous 4 calibration runs. It is <em>not</em> triggered by the training window selection — a well-tuned model (30d window winning) can still show drift if the current market is less favourable than recent weeks. No action is needed unless the gap widens over 5+ consecutive days or win rate drops below 45%.
            </div>
          </div>`;
      } else {
        driftHtml = `
          <div class="drift-banner ok">
            <div class="drift-banner-icon">✓</div>
            <div class="drift-banner-text">
              <div class="drift-banner-title">Model Healthy</div>
              <div class="drift-banner-sub">No drift detected &nbsp;·&nbsp; Last calibration ${fmtDateTime(latest.ran_at)}</div>
            </div>
          </div>`;
      }
    }

    // Action bar
    const actionHtml = `
      <div class="action-bar">
        <button class="btn" onclick="loadDashboard()">Refresh Dashboard</button>
        <button class="btn" id="reenrichBtn" onclick="triggerReenrich('reenrichBtn', 'winStatus')">Re-enrich Today</button>
        <button class="btn" id="calibrateBtn" onclick="triggerRetrain()">Run Calibration Now</button>

      </div>
      <div class="action-bar" style="margin-top:10px;align-items:center;gap:8px">

        <span class="btn-status" id="reseedStatus"></span>
      </div>
      <div class="action-explainers">
        <div class="action-explain">
          <strong>Refresh Dashboard</strong>
          <span>Reloads this page's stats from the database. No external API calls — zero cost, instant.</span>
        </div>
        <div class="action-explain">
          <strong>Re-enrich Today</strong>
          <span>Force re-runs the model on every race today, overwriting stored predictions. Makes <strong>one full RA API call per race</strong> to fetch the latest race card (scratchings, track condition, jockey changes), then re-runs the ML model. On a typical race day (~40 races across 5–6 meetings) this is ~40–50 API calls. Use after a model or form-scoring change when you want all predictions refreshed immediately.<br><br><em>The automated pre-race job runs every 15 min and is more surgical — it makes one lightweight call per meeting just to check start times, then only fetches full race data for races within 2 hours of jump. Use this button when you need to refresh races outside that 2-hour window.</em></span>
        </div>
        <div class="action-explain">
          <strong>Run Calibration Now</strong>
          <span>Runs the calibration sweep — trains a fresh model on each candidate window (60/90/180/270 days) and reports win rate, ROI, and drift status per window. <strong>Measurement only — does NOT update production weights.</strong> Takes ~14 min. Normally runs automatically at 2am AEST nightly. Use this after a model change to see how a fresh-window retrain would compare.</span>
        </div>
        <div class="action-explain">
          <strong>Retrain Production</strong>
          <span>Retrains the production win model on <strong>all stored data</strong> (not a window — this is what serves live predictions). No external API calls. Takes ~2–5 min. Run this after the calibration sweep shows a meaningful win-rate gap between windows and full-data, or after a feature/mask change. Avoid running more than once per day — production updates ripple through predictions and stats.</span>
        </div>
        <div class="action-explain">
          <strong>Reseed Results</strong>
          <span>Re-fetches race results from Racing Australia for a past date and stores them in the database. Use this to fix wrong win/place indicators for a past meeting — the per-runner duplicate check means it won't double-insert correct rows. Pick yesterday's date and click Reseed if labels look wrong.</span>
        </div>
      </div>`;

    // Latest stats
    const latestStatsHtml = latest ? `
      <div class="section">
        <div class="section-title">Latest Calibration (training-time metric) — ${fmtDateTime(latest.ran_at)}</div>
        <div style="font-size:0.7rem;color:var(--text-dim);margin-bottom:10px;line-height:1.5">
          Win rate and Value ROI here are from a <em>fresh retrain</em> on a fixed window (60–270d), not the production model. The Live Performance section above is what users actually see.
        </div>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-card-num" style="color:var(--green-bright)">${pct(latest.win_rate)}</div>
            <div class="stat-card-label">Win Rate</div>
            <div class="stat-card-sub">Holdout set</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-num" style="color:var(--blue)">${pct(latest.place_rate)}</div>
            <div class="stat-card-label">Place Rate</div>
            <div class="stat-card-sub">Top 3 finish</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-num" style="color:${latest.value_roi >= 4 ? 'var(--green-bright)' : latest.value_roi >= 2 ? 'var(--gold-light)' : '#f87171'}">${latest.value_roi.toFixed(2)}%</div>
            <div class="stat-card-label">Value ROI</div>
            <div class="stat-card-sub">${latest.value_bets} value bets</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-num" style="color:var(--purple-bright)">${latest.best_window}d</div>
            <div class="stat-card-label">Best Window</div>
            <div class="stat-card-sub">Training days</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-num">${(latest.total_races ?? latest.window_results?.find(w => !w.skipped)?.holdout_races ?? 0).toLocaleString()}</div>
            <div class="stat-card-label">Races Tested</div>
            <div class="stat-card-sub">Holdout sample</div>
          </div>
          <div class="stat-card">

            <div class="stat-card-sub">${latest.drift_flag ? 'Below 4-week avg' : 'Within range'}</div>

        </div>
      </div>` : '';

    // ROI trend placeholder
    const roiTrendHtml = cals.length > 2 ? `
      <div class="section">
        <div class="section-title">Value ROI Trend &nbsp;<span style="font-size:0.7rem;color:var(--gold-light)">● drift flagged</span> &nbsp;<span style="font-size:0.7rem;color:var(--blue)">● healthy</span></div>
        <div class="chart-card">
          <div class="chart-wrap" style="height:200px"><canvas id="roiTrendChart"></canvas></div>
        </div>
      </div>` : '';

    // 14-day performance charts
    let perfHtml = '';
    if (perfData?.summary?.length) {
      perfHtml = `
        <div class="section">
          <div class="section-title">Last 14 Days — Daily Performance</div>
          <div class="two-col">
            <div class="chart-card">
              <div class="chart-card-title">Win Rate %</div>

                <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:rgba(239,68,68,0.4);margin-right:4px;vertical-align:middle"></span>&lt; 50% — below target</span>

              <div class="chart-wrap"><canvas id="winRateChart"></canvas></div>
            </div>
            <div class="chart-card">
              <div class="chart-card-title">Value Bet P&amp;L — $10 per race</div>
              <div style="display:flex;gap:12px;margin-bottom:10px;font-size:0.7rem;color:var(--text-dim)">
                <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:rgba(59,130,246,0.6);margin-right:4px;vertical-align:middle"></span>Profitable day</span>

              </div>

              </div>

          </div>
        </div>`;
    }

    // Window table
    let windowHtml = '';
    if (latest?.window_results?.length) {
      const rows = latest.window_results.map(w => {
        // Skipped windows have minimal fields — render a single-cell explanation
        if (w.skipped) {
          return `<tr><td>${w.window_days}d</td><td colspan="5" style="color:var(--text-dim);font-style:italic">${w.reason || 'skipped'}</td></tr>`;

            <table class="window-table">

              <tbody>${rows}</tbody>
            </table>

    // Threshold table
    let thresholdHtml = '';
    if (analysisData?.thresholds?.length) {
      const rows = analysisData.thresholds.filter(t => t.threshold_pct >= 25).map(t => `
        <tr>
          <td>≥${t.threshold_pct}%</td>
          <td>${t.bets?.toLocaleString() ?? '—'}</td>
          <td>${t.win_pct != null ? t.win_pct.toFixed(1) + '%' : '—'}</td>

          <td>${t.avg_sp != null ? '$' + t.avg_sp.toFixed(2) : '—'}</td>

        <div class="section">
          <div class="section-title">Model Performance by Confidence Threshold</div>

    // Calibration history
    let historyHtml = '';
    if (cals.length > 1) {
      const rows = cals.map(c => `
        <tr>
          <td>${fmtDate(c.ran_at)}</td>
          <td>${(c.win_rate * 100).toFixed(1)}%</td>

          <td>${c.value_bets}</td>
          <td>${c.best_window}d</td>
          <td><span class="drift-dot ${c.drift_flag ? 'warn' : 'ok'}"></span>${c.drift_flag ? 'Drift' : 'OK'}</td>
        </tr>`).join('');
      historyHtml = `
        <div class="section">
          <div class="section-title">Calibration History (Last ${cals.length} Runs)</div>
          <div class="chart-card">
            <table class="history-table">
              <thead><tr>
                <th>Date</th><th>Win Rate</th><th>Place Rate</th>
                <th>Value ROI</th><th>Value Bets</th><th>Window</th><th>Drift</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`;
    }

    // Site-warning banner toggle. Read the CURRENT state on load and
    // render a switch that flips the model-unstable red banner across

    // /api/config/site-warnings for the shared contract.

      <div class="section" id="siteWarningsSection">
        <div class="section-title">Site-Wide Warnings</div>
        <div class="stat-card" style="padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
          <div>
            <div style="font-weight:700;font-size:1rem">Model-instability banner</div>
            <div style="font-size:0.8rem;color:var(--text-secondary);margin-top:2px" id="siteWarnStatus">
              Loading…
            </div>
          </div>
          <div style="display:flex;gap:10px;align-items:center">
            <button class="btn" id="siteWarnOn" style="background:#dc262620;border-color:#dc2626;color:#ef4444" onclick="setModelUnstable(true)">🔴 Turn ON</button>
            <button class="btn" id="siteWarnOff" style="background:#22c55e20;border-color:#22c55e;color:#22c55e" onclick="setModelUnstable(false)">✓ Turn OFF</button>
          </div>
        </div>
        <div style="font-size:0.72rem;color:var(--text-dim);margin-top:8px;line-height:1.5">

        </div>
      </div>`;
    return productionHtml + driftHtml + actionHtml + latestStatsHtml + siteWarningsHtml + roiTrendHtml + perfHtml + windowHtml + thresholdHtml + historyHtml;
  }

  // Site-warning toggle handlers — attached to window so onclick can find them.
  async function refreshSiteWarnStatus() {
    try {
      const res = await fetch(`${API}/api/config/site-warnings`);
      if (!res.ok) return;
      const w = await res.json();
      const mu = w?.model_unstable || {};
      const el = document.getElementById('siteWarnStatus');
      if (el) {
        el.innerHTML = mu.active
          ? `<span style="color:#ef4444;font-weight:700">🔴 ACTIVE</span> — banner text: "${escHtml(mu.message || '')}"`
          : `<span style="color:#22c55e;font-weight:700">✓ Off</span> — no banner is being shown`;
      }
    } catch (e) { console.warn('site-warn status fetch failed', e); }
  }
  async function setModelUnstable(active) {
    const message = active
      ? (prompt('Banner message (leave blank for default):', 'Model not stable today — NO BETS') || 'Model not stable today — NO BETS')
      : '';
    try {
      const url = `${API}/api/admin/site-warnings/model-unstable?active=${active}${message ? '&message=' + encodeURIComponent(message) : ''}`;
      const res = await fetch(url, { method: 'POST', headers: { 'x-cron-secret': adminSecret } });
      if (!res.ok) { alert('Failed to toggle: ' + res.status); return; }
      refreshSiteWarnStatus();
      alert(active ? 'Banner ON — refresh any user page to see it.' : 'Banner OFF.');
    } catch (e) {
      alert('Request failed: ' + e);
    }
  }
  window.setModelUnstable = setModelUnstable;
  window.refreshSiteWarnStatus = refreshSiteWarnStatus;

  function mountWinCharts(calData, perfData) {
    const cals = calData?.calibrations || [];

    const chartDefaults = {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#4a5a7a', font: { size: 10 } }, grid: { color: 'rgba(30,40,64,0.6)' } },
        y: { ticks: { color: '#4a5a7a', font: { size: 10 } }, grid: { color: 'rgba(30,40,64,0.6)' } },
      }
    };

    setTimeout(() => {
      if (perfData?.summary?.length) {
        const days = [...perfData.summary].reverse().slice(-14);
        const labels      = days.map(d => fmtDate(d.date));
        const winRates    = days.map(d => +(d.win_rate * 100).toFixed(1));
        const raceCounts  = days.map(d => d.races || 0);
        const valueBets   = days.map(d => d.value_bets || 0);
        const tierPremium = days.map(d => d.tier_premium || 0);
        const tierHot     = days.map(d => d.tier_hot || 0);
        const tierHigh    = days.map(d => d.tier_high || 0);
        const tierStrong  = days.map(d => d.tier_strong || 0);
        const roiRates    = days.map(d => +(d.value_pnl * 10).toFixed(2));

        new Chart(document.getElementById('winRateChart'), {
          type: 'bar',
          data: {
            labels,
            datasets: [{ data: winRates, backgroundColor: winRates.map(v => v >= 50 ? 'rgba(34,197,94,0.6)' : 'rgba(239,68,68,0.4)'), borderRadius: 4 }]
          },
          options: {
            ...chartDefaults,
            plugins: { ...chartDefaults.plugins, tooltip: { callbacks: {
              label: ctx => `Win rate: ${ctx.parsed.y}%`,
              afterLabel: ctx => `Races that day: ${raceCounts[ctx.dataIndex]}`,
            }}},
            scales: { ...chartDefaults.scales, y: { ...chartDefaults.scales.y, ticks: { ...chartDefaults.scales.y.ticks, callback: v => v + '%' } } }
          }
        });

        new Chart(document.getElementById('pnlChart'), {
          type: 'bar',
          data: {
            labels,
            datasets: [{ data: roiRates, backgroundColor: roiRates.map(v => v >= 0 ? 'rgba(59,130,246,0.6)' : 'rgba(239,68,68,0.4)'), borderRadius: 4 }]
          },
          options: {
            ...chartDefaults,
            plugins: { ...chartDefaults.plugins, tooltip: { callbacks: {
              label: ctx => `P&L: $${ctx.parsed.y} (at $10/race)`,
              afterLabel: ctx => {
                const i = ctx.dataIndex;
                const lines = [`Value bets: ${valueBets[i]}`];
                if (tierPremium[i]) lines.push(`  💎 Premium: ${tierPremium[i]}`);
                if (tierHot[i])     lines.push(`  🔥 Hot Pick: ${tierHot[i]}`);
                if (tierHigh[i])    lines.push(`  ⚡ High Confidence: ${tierHigh[i]}`);
                if (tierStrong[i])  lines.push(`  Strong Pick: ${tierStrong[i]}`);
                return lines;
              },
            }}},
            scales: { ...chartDefaults.scales, y: { ...chartDefaults.scales.y, ticks: { ...chartDefaults.scales.y.ticks, callback: v => '$' + v } } }
          }
        });
      }

      if (cals.length > 2) {
        const calReversed = [...cals].reverse();
        const hasBao = calReversed.some(c => c.value_roi_bao != null);
        const datasets = [{
          label: 'SP',
          data: calReversed.map(c => c.value_roi != null ? +c.value_roi.toFixed(2) : null),
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59,130,246,0.08)',
          fill: true, tension: 0.35,
          pointBackgroundColor: calReversed.map(c => c.drift_flag ? '#e8a020' : '#3b82f6'),
          pointRadius: 5, pointHoverRadius: 7,
        }];
        if (hasBao) {
          datasets.push({
            label: 'BAO',
            data: calReversed.map(c => c.value_roi_bao != null ? +c.value_roi_bao.toFixed(2) : null),
            borderColor: '#22c55e',
            backgroundColor: 'rgba(34,197,94,0.05)',
            fill: false, tension: 0.35,
            borderDash: [5, 4],
            pointBackgroundColor: '#22c55e',
            pointRadius: 4, pointHoverRadius: 6,
            spanGaps: true,
          });
        }
        new Chart(document.getElementById('roiTrendChart'), {
          type: 'line',
          data: { labels: calReversed.map(c => fmtDate(c.ran_at)), datasets },
          options: {
            ...chartDefaults,
            plugins: {
              ...chartDefaults.plugins,
              legend: { display: hasBao, position: 'top', labels: { color: '#94a3b8', font: { size: 10 }, boxWidth: 14 } },
              tooltip: {
                callbacks: {
                  label: ctx => ` ${ctx.dataset.label || ''}: ${ctx.parsed.y}%`,
                  afterLabel: ctx => {
                    if (ctx.dataset.label !== 'BAO') return '';
                    const cov = calReversed[ctx.dataIndex]?.bao_coverage_pct;
                    return cov != null ? `BAO coverage: ${cov}%` : '';
                  },
                },
              },
            },
            scales: { ...chartDefaults.scales, y: { ...chartDefaults.scales.y, ticks: { ...chartDefaults.scales.y.ticks, callback: v => v + '%' } } }
          }
        });
      }
    }, 50);
  }

  function mountExoticCharts(histData, dailyData) {
    const chartDefaults = {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.y}%` } } },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#64748b', font: { size: 10 } } },
        y: { grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#64748b', font: { size: 10 }, callback: v => v + '%' } },
      },
    };

    setTimeout(() => {
      // Box Hit Rate Trend
      const trendEl = document.getElementById('exoticTrendChart');
      if (trendEl && histData.history?.length > 2) {
        const rev = [...histData.history].reverse();
        new Chart(trendEl, {
          type: 'line',
          data: {
            labels: rev.map(h => new Date(h.ran_at).toLocaleDateString('en-AU', { day:'numeric', month:'short' })),
            datasets: [{
              data: rev.map(h => h.best_holdout_box_hit_rate),
              borderColor: 'rgba(20,184,166,0.8)',
              backgroundColor: 'rgba(20,184,166,0.08)',
              fill: true, tension: 0.35,
              pointBackgroundColor: rev.map((h, i) => {
                const prior = rev.slice(Math.max(0, i-3), i).map(x => x.best_holdout_box_hit_rate);
                const drift = prior.length && h.best_holdout_box_hit_rate < (prior.reduce((a,b)=>a+b,0)/prior.length) - 1.5;
                return drift ? '#e8a020' : 'rgba(20,184,166,0.9)';
              }),
              pointRadius: 5, pointHoverRadius: 7,
            }]
          },
          options: { ...chartDefaults, scales: { ...chartDefaults.scales, y: { ...chartDefaults.scales.y, ticks: { ...chartDefaults.scales.y.ticks, callback: v => v + '%' } } } }
        });
      }

      // Daily Box Hit Rate
      const hitRateEl = document.getElementById('exoticHitRateChart');
      if (hitRateEl && dailyData.summary?.length) {
        const TARGET = 10;
        new Chart(hitRateEl, {
          type: 'bar',
          data: {
            labels: dailyData.summary.map(d => new Date(d.date + 'T00:00').toLocaleDateString('en-AU', { day:'numeric', month:'short' })),
            datasets: [{
              data: dailyData.summary.map(d => d.hit_rate_pct),
              backgroundColor: dailyData.summary.map(d => d.hit_rate_pct >= TARGET ? 'rgba(20,184,166,0.6)' : 'rgba(239,68,68,0.4)'),
              borderColor:      dailyData.summary.map(d => d.hit_rate_pct >= TARGET ? 'rgba(20,184,166,0.9)' : 'rgba(239,68,68,0.7)'),
              borderWidth: 1,
            }]
          },
          options: {
            ...chartDefaults,
            plugins: { ...chartDefaults.plugins, tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.y}% (${dailyData.summary[ctx.dataIndex].eligible_races} races)` } } },
            scales: { ...chartDefaults.scales, y: { ...chartDefaults.scales.y, ticks: { ...chartDefaults.scales.y.ticks, callback: v => v + '%' } } },
          }
        });
      }

      // Daily Hits vs Eligible
      const hitsEl = document.getElementById('exoticHitsChart');
      if (hitsEl && dailyData.summary?.length) {
        new Chart(hitsEl, {
          type: 'bar',
          data: {
            labels: dailyData.summary.map(d => new Date(d.date + 'T00:00').toLocaleDateString('en-AU', { day:'numeric', month:'short' })),
            datasets: [
              {
                label: 'Box Hits',
                data: dailyData.summary.map(d => d.box_hits),
                backgroundColor: 'rgba(20,184,166,0.6)', borderColor: 'rgba(20,184,166,0.9)', borderWidth: 1,
              },
              {
                label: 'Eligible',
                data: dailyData.summary.map(d => d.eligible_races),
                backgroundColor: 'rgba(100,116,139,0.25)', borderColor: 'rgba(100,116,139,0.5)', borderWidth: 1,
              },
            ]
          },
          options: {
            ...chartDefaults,
            plugins: { ...chartDefaults.plugins, legend: { display: true, labels: { color: '#94a3b8', font: { size: 10 } } }, tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y}` } } },
            scales: { ...chartDefaults.scales, y: { ...chartDefaults.scales.y, ticks: { ...chartDefaults.scales.y.ticks, callback: v => v } } },
          }
        });
      }
    }, 50);
  }
