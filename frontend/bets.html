<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>body{visibility:hidden}</style>
  <script>
    fetch('/api/check', {credentials:'include'})
      .then(function(r){
        if(r.ok){ document.body.style.visibility='visible'; }
        else{ window.location.replace('/login?next='+encodeURIComponent(location.pathname)); }
      })
      .catch(function(){ document.body.style.visibility='visible'; });
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <title>🧪 The Lab — Paper Trading Trifectas | FunkyIQ</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base:      #07090f;
      --bg-card:      #0e1220;
      --bg-elevated:  #1a2035;
      --border:       #1e2840;
      --green:        #22c55e;
      --green-bright: #4ade80;
      --red:          #f87171;
      --gold:         #e8a020;
      --teal:         #2dd4bf;
      --teal-bright:  #5eead4;
      --text:         #e6e9f0;
      --text-dim:     #8a93a8;
      --text-muted:   #5c6478;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px 12px 60px;
      background: var(--bg-base);
      color: var(--text);
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }
    header { margin-bottom: 14px; }
    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 0.5px;
      margin: 0;
      line-height: 1;
    }
    .subtitle {
      color: var(--text-dim);
      font-size: 12px;
      margin-top: 4px;
    }
    .nav-back {
      display: inline-block;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-dim);
      text-decoration: none;
    }

    /* Strategy selector */
    .strategy-row {
      display: flex;
      gap: 8px;
      margin: 12px 0 10px;
    }
    .strategy-pill {
      flex: 1;
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      color: var(--text-dim);
      transition: all 0.15s;
    }
    .strategy-pill.active {
      background: rgba(45,212,191,0.10);
      border-color: var(--teal);
      color: var(--text);
    }
    .strategy-pill .name {
      display: block;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.4px;
    }
    .strategy-pill .meta {
      display: block;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.4;
    }
    .strategy-pill.active .name { color: var(--teal-bright); }
    .strategy-pill .stat {
      display: inline-block;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .strategy-pill .stat.pos { color: var(--green-bright); }
    .strategy-pill .stat.neg { color: var(--red); }

    /* Sort selector */
    .sort-row {
      display: flex;
      gap: 6px;
      margin: 10px 0;
      align-items: center;
      flex-wrap: wrap;
    }
    .sort-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .sort-pill {
      padding: 5px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .sort-pill.active {
      background: rgba(45,212,191,0.12);
      border-color: var(--teal);
      color: var(--teal-bright);
    }

    /* Today's best pick hero */
    .hero-pick {
      margin-bottom: 14px;
      padding: 14px 16px;
      border: 1px solid rgba(45,212,191,0.4);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(45,212,191,0.08), rgba(45,212,191,0.02));
      box-shadow: 0 0 0 1px rgba(45,212,191,0.18);
    }
    .hero-pick.empty {
      opacity: 0.65;
      background: var(--bg-card);
      border-color: var(--border);
      box-shadow: none;
    }
    .hero-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--teal-bright);
      margin-bottom: 6px;
    }
    .hero-race {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 26px;
      line-height: 1;
      letter-spacing: 0.4px;
      color: var(--text);
    }
    .hero-jump {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-dim);
      margin-left: 10px;
    }
    .hero-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      font-size: 11px;
    }
    .hero-stat {
      display: flex;
      align-items: baseline;
      gap: 4px;
      color: var(--text-dim);
      background: var(--bg-elevated);
      padding: 4px 8px;
      border-radius: 6px;
    }
    .hero-stat strong {
      color: var(--text);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .hero-hit {
      color: var(--green-bright) !important;
      font-weight: 800 !important;
      font-size: 12px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
    }
    .summary-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
    }
    .summary-num.pos { color: var(--green-bright); }
    .summary-num.neg { color: var(--red); }
    .summary-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .strategy-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: -4px 0 12px 0;
    }
    .strategy-stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 4px;
      text-align: center;
    }
    .strategy-stat-name {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
    }
    .strategy-stat-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
      margin-top: 1px;
    }
    .strategy-stat-frac {
      font-size: 10px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .race {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .race.settled-hit { border-color: rgba(74,222,128,0.4); }
    .race.settled-miss { opacity: 0.85; }
    .race.pending { border-color: rgba(45,212,191,0.4); }
    .race-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
    }
    .race-id {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.3px;
    }
    .race-pnl {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 20px;
      font-variant-numeric: tabular-nums;
    }
    .race-pnl.pos { color: var(--green-bright); }
    .race-pnl.neg { color: var(--red); }
    .race-pnl.pending { color: var(--teal-bright); font-size: 13px; font-weight: 600; }
    .race-meta {
      font-size: 11px;
      color: var(--text-dim);
    }
    /* Winning trifecta strip (settled races only) */
    .winning-strip {
      margin: 8px 0 0;
      padding: 6px 10px;
      background: rgba(45,212,191,0.08);
      border: 1px solid rgba(45,212,191,0.25);
      border-radius: 8px;
      font-size: 11px;
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }
    .winning-strip .trophy { color: var(--gold); }
    .winning-strip .label {
      color: var(--teal-bright);
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      font-size: 10px;
    }
    .winning-strip .leg {
      display: inline-flex;
      align-items: baseline;
      gap: 3px;
    }
    .winning-strip .pos {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 10px;
    }
    .winning-strip .tab {
      display: inline-block;
      min-width: 16px;
      padding: 1px 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-weight: 700;
      text-align: center;
      font-size: 10px;
    }
    .winning-strip .name {
      color: var(--text);
      font-weight: 500;
    }
    .winning-strip .sep { color: var(--text-muted); margin: 0 2px; }

    .race-time {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
      font-size: 12px;
    }
    .jump-time {
      color: var(--text);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .countdown {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--text-dim);
    }
    .countdown.soon { color: var(--gold); }
    .countdown.now { color: var(--red); animation: pulse 1.5s ease-in-out infinite; }
    .countdown.done { color: var(--text-muted); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }
    .race-stats {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
      font-size: 11px;
    }
    .race-stat {
      text-align: center;
      padding: 4px;
      background: var(--bg-elevated);
      border-radius: 6px;
    }
    .race-stat-num {
      font-weight: 700;
      color: var(--text);
      display: block;
      font-variant-numeric: tabular-nums;
    }
    .race-stat-label {
      color: var(--text-muted);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* Bet detail expansion */
    .bet-toggle {
      margin-top: 10px;
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      padding: 6px 0;
      border-top: 1px dashed var(--border);
    }
    .bet-toggle:active { color: var(--text); }
    .bet-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bet-row {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
    }
    .bet-row.hit {
      border-color: rgba(74,222,128,0.45);
      background: rgba(74,222,128,0.06);
    }
    .bet-row-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }
    .bet-strategy {
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-size: 10px;
    }
    .bet-result {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .bet-result.hit { color: var(--green-bright); }
    .bet-result.miss { color: var(--text-muted); }
    .bet-result.pending { color: var(--teal-bright); }
    .bet-horses {
      color: var(--text);
      line-height: 1.5;
    }
    .bet-horses .tab {
      display: inline-block;
      min-width: 18px;
      padding: 1px 5px;
      margin-right: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-weight: 700;
      text-align: center;
      font-size: 10px;
    }
    .bet-horses .name {
      color: var(--text-dim);
      margin-right: 8px;
    }
    .bet-meta {
      color: var(--text-muted);
      font-size: 10px;
      margin-top: 4px;
    }
    .bet-loading { color: var(--text-muted); padding: 8px 0; font-size: 11px; text-align: center; }

    /* Per-card strategy sections */
    .strategy-block {
      margin-top: 10px;
      padding: 8px 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .strategy-block.default {
      border-color: rgba(45,212,191,0.35);
      background: rgba(45,212,191,0.04);
    }
    .strategy-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      margin-bottom: 6px;
    }
    .strategy-block-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text);
    }
    .strategy-block.default .strategy-block-name { color: var(--teal-bright); }
    .strategy-block-badge {
      font-size: 9px;
      padding: 1px 5px;
      background: var(--teal);
      color: var(--bg-base);
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .strategy-block-meta {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .strategy-block-box {
      font-size: 11px;
      margin: 4px 0;
      line-height: 1.5;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px;
    }
    .strategy-block-box.hit {
      color: var(--green-bright);
    }
    .strategy-block-box-label {
      color: var(--text-muted);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      min-width: 70px;
    }
    .strategy-block-box .tab {
      display: inline-block;
      min-width: 18px;
      padding: 1px 5px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-weight: 700;
      text-align: center;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .strategy-block-box.hit .tab { border-color: rgba(74,222,128,0.45); }
    .tab-pair {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      margin-right: 8px;
      margin-bottom: 2px;
    }
    .tab-name {
      color: var(--text-dim);
      font-size: 10px;
      letter-spacing: 0.2px;
    }
    .tab-odds {
      color: var(--gold);
      font-weight: 600;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      margin-left: 2px;
    }
    .strategy-block-box.hit .tab-name { color: var(--green-bright); }
    .strategy-block-box-horses {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 2px 8px;
      flex: 1;
    }
    .strategy-block-payout {
      color: var(--green-bright);
      font-weight: 700;
      font-size: 11px;
      margin-left: 4px;
    }
    .strategy-block-result {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.3px;
      margin-left: auto;
    }
    .strategy-block-result.hit { color: var(--green-bright); }
    .strategy-block-result.miss { color: var(--text-muted); }
    .strategy-block-result.pending { color: var(--teal-bright); }

    /* Inline dividend entry */
    .dividend-row {
      margin-top: 8px;
      padding: 6px 10px;
      background: rgba(45,212,191,0.06);
      border: 1px dashed rgba(45,212,191,0.35);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }
    .dividend-row .label {
      color: var(--text-dim);
      font-weight: 600;
    }
    .dividend-row input {
      flex: 1;
      background: var(--bg-base);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-family: 'Outfit', sans-serif;
      font-variant-numeric: tabular-nums;
      min-width: 60px;
    }
    .dividend-row input:focus {
      outline: none;
      border-color: var(--teal);
    }
    .dividend-row button {
      background: var(--teal);
      border: 0;
      color: var(--bg-base);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
    }
    .dividend-row button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .dividend-row .err {
      color: var(--red);
      font-size: 10px;
    }

    /* Day section header */
    .day-divider {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 28px 4px 14px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
    }
    .day-divider:first-child { margin-top: 10px; }
    .day-divider .label-strong { color: var(--teal-bright); }
    .day-divider .count {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.3px;
    }
    .day-divider hr {
      flex: 1;
      border: 0;
      border-top: 1px solid var(--border);
      margin: 0;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .loading { text-align: center; padding: 40px; color: var(--text-dim); }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <div>
        <h1 class="title">🧪 The Lab</h1>
        <div class="subtitle">Paper-trading · $2 flexi-box trifectas · metro meetings only</div>
      </div>
      <a href="/hotseat" class="nav-back">🔥 Hot Seat →</a>
    </div>
    <div id="heroPick"></div>
    <div id="summary" class="summary"></div>
    <div class="sort-row">
      <span class="sort-label">Sort</span>
      <button class="sort-pill active" data-sort="next">Next race</button>
      <button class="sort-pill" data-sort="recent">Just ran</button>
      <button class="sort-pill" data-sort="pnl">Best P/L</button>
    </div>
  </header>
  <main id="races">
    <div class="loading">Loading ledger…</div>
  </main>

<script>
  const API = 'https://web-production-dec62.up.railway.app';
  // Reuse the dashboard's admin-secret slot — if the user has logged in
  // on /dashboard, the secret is cached in sessionStorage and the inline
  // dividend entry shows up. Otherwise hidden (no public exposure).
  const ADMIN_KEY = 'fiq_admin_secret';
  const adminSecret = (typeof sessionStorage !== 'undefined' && sessionStorage.getItem(ADMIN_KEY)) || '';
  const isAdmin = !!adminSecret;
  const STRATEGY_LABELS = {
    core_top3: 'Top 3 box',
    core_top4: 'Top 4 box',
    value_runner1: 'Top 2 + value #1',
    value_runner2: 'Top 2 + value #2',
    no_favourite_hedge: 'No-favourite hedge',
  };

  // race_id -> bool (expanded?); race_id -> array of bet rows (cached fetch)
  const STRATEGY_KEY = 'fiq_strategy';
  const state = {
    expanded: new Set(), detail: {}, lastData: null, sort: 'next',
    strategy: 'all',  // page no longer filters by strategy — each card shows all
    strategyStats: [],
    // "race_id:group" keys that the user has explicitly toggled the
    // opposite of the default. By default Trio is expanded, others
    // collapsed; flipping a section toggles its entry in this set.
    collapsedFlip: new Set(),
  };

  function isCollapsed(raceId, group) {
    const flipped = state.collapsedFlip.has(`${raceId}:${group}`);
    const defaultCollapsed = group !== 'trio';
    return flipped ? !defaultCollapsed : defaultCollapsed;
  }

  function fmtPnl(v) {
    if (v == null) return null;
    const s = v >= 0 ? '+' : '−';
    return s + '$' + Math.abs(v).toFixed(2);
  }

  function formatJumpTime(iso) {
    if (!iso) return null;
    const d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    return d.toLocaleTimeString('en-AU', {
      hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Australia/Sydney',
    });
  }

  function formatCountdown(iso) {
    if (!iso) return null;
    const t = new Date(iso).getTime();
    if (isNaN(t)) return null;
    const diff = Math.floor((t - Date.now()) / 1000);
    if (diff <= -480) return { text: 'Done', cls: 'done' };
    if (diff <= -60) return { text: 'Running', cls: 'now' };
    if (diff <= 0) return { text: 'NOW', cls: 'now' };
    const mins = Math.floor(diff / 60);
    if (mins < 60) return { text: `in ${mins}m`, cls: mins < 5 ? 'soon' : '' };
    const hrs = Math.floor(mins / 60);
    const rem = mins % 60;
    return { text: `in ${hrs}h ${rem.toString().padStart(2,'0')}m`, cls: '' };
  }

  function escHtml(s) {
    return (s == null ? '' : String(s))
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Order + display labels for the per-card strategy blocks.
  const STRATEGY_DISPLAY = [
    { key: 'trio',   label: 'Trio',   tagline: '1 box · best ROI',  isDefault: true,  legacy: false },
    { key: 'stack',  label: 'Stack',  tagline: '5 × 3-horse',       isDefault: false, legacy: false },
    { key: 'quad',   label: 'Quad',   tagline: '1 box · 4 horses',  isDefault: false, legacy: false },
    { key: 'spread', label: 'Spread', tagline: '5 mixed boxes',     isDefault: false, legacy: false },
    // Legacy single-box wides — only rendered on older races that still
    // have these rows in the DB; no new rows are generated. Hidden from
    // the daily-strategy summary strip via the legacy flag so the strip
    // stays focused on current strategies.
    { key: 'net',    label: 'Net',    tagline: '6-horse wide box',  isDefault: false, legacy: true  },
    { key: 'sweep',  label: 'Sweep',  tagline: '5-horse wide box',  isDefault: false, legacy: true  },
  ];
  const BOX_LABELS = {
    core_top3: 'Top 3', core_top4: 'Top 4',
    value_runner1: 'Value 1', value_runner2: 'Value 2',
    no_favourite_hedge: 'Hedge',
    trio_only: 'Trio', quad_only: 'Quad',
    stack_top3: 'Top 3', stack_skip3: 'Skip 3', stack_skip2: 'Skip 2',
    stack_no_fav: 'No fav', stack_value: 'Value',
  };

  function renderStrategyBlock(raceId, group, bets, raceStatus) {
    if (!bets || !bets.length) return '';
    const meta = STRATEGY_DISPLAY.find(s => s.key === group);
    if (!meta) return '';
    const totalStake = bets.reduce((a, b) => a + (b.stake_dollars || 0), 0);
    const hits = bets.filter(b => b.is_hit).length;
    // Sum estimated payouts across hit boxes — uses Harville on actual
    // top-3's market odds, before any real TAB dividend is entered.
    const estTotal = bets.reduce(
      (a, b) => a + ((b.is_hit && b.estimated_payout) ? b.estimated_payout : 0),
      0
    );
    const estPnl = estTotal > 0 ? (estTotal - totalStake) : null;
    let resultText, resultCls;
    if (raceStatus === 'pending') {
      resultText = 'Pending'; resultCls = 'pending';
    } else if (hits > 0) {
      const pnlTag = estPnl != null
        ? ` · est ${estPnl >= 0 ? '+' : '-'}$${Math.abs(estPnl).toFixed(2)}`
        : '';
      resultText = '✓ ' + hits + (hits === 1 ? ' hit' : ' hits') + pnlTag;
      resultCls = 'hit';
    } else {
      resultText = '✗ Miss'; resultCls = 'miss';
    }
    const collapsed = isCollapsed(raceId, group);
    const boxes = collapsed ? '' : bets.map(b => {
      const isHit = b.is_hit === true;
      const label = BOX_LABELS[b.strategy_label] || b.strategy_label;
      const horses = (b.box_horses || []).map((tab, i) => {
        const name = (b.box_horse_names || [])[i] || '';
        const odds = ((b.box_horse_odds || [])[i]);
        const oddsTxt = (odds && odds > 1.0) ? ` <span class="tab-odds">$${odds.toFixed(2)}</span>` : '';
        return `<span class="tab-pair"><span class="tab">${tab}</span><span class="tab-name">${escHtml(name)}</span>${oddsTxt}</span>`;
      }).join('');
      const hitMark = isHit ? ' ✓' : '';
      const payoutTag = (isHit && b.estimated_payout)
        ? ` <span class="strategy-block-payout">+$${b.estimated_payout.toFixed(2)}</span>`
        : '';
      return `
        <div class="strategy-block-box${isHit ? ' hit' : ''}">
          <span class="strategy-block-box-label">${escHtml(label)}${hitMark}${payoutTag}</span>
          <div class="strategy-block-box-horses">${horses}</div>
        </div>`;
    }).join('');
    const chevron = collapsed ? '▸' : '▾';
    return `
      <div class="strategy-block${meta.isDefault ? ' default' : ''}"
           data-strat-toggle="${escHtml(raceId)}:${group}"
           style="cursor:pointer">
        <div class="strategy-block-head">
          <div>
            <span style="color:var(--text-muted);font-weight:700;margin-right:6px">${chevron}</span>
            <span class="strategy-block-name">${escHtml(meta.label)}</span>
            ${meta.isDefault ? '<span class="strategy-block-badge">★ DEFAULT</span>' : ''}
            <span class="strategy-block-meta">· $${totalStake.toFixed(0)} · ${meta.tagline} · ${bets.length} box${bets.length === 1 ? '' : 'es'}</span>
          </div>
          <span class="strategy-block-result ${resultCls}">${resultText}</span>
        </div>
        ${boxes}
      </div>`;
  }

  function renderBetDetail(raceId) {
    const bets = state.detail[raceId];
    if (bets === undefined) return `<div class="bet-loading">Loading bets…</div>`;
    if (!bets || !bets.length) return `<div class="bet-loading">No bets recorded.</div>`;
    return `<div class="bet-list">${bets.map(b => {
      const label = STRATEGY_LABELS[b.strategy_label] || b.strategy_label;
      const horses = (b.box_horses || []).map((tab, i) => {
        const name = (b.box_horse_names || [])[i] || '';
        return `<span><span class="tab">${tab}</span><span class="name">${escHtml(name)}</span></span>`;
      }).join('');
      let resultEl, cls = '';
      if (b.settled) {
        if (b.is_hit) {
          cls = 'hit';
          const payoutTxt = (b.payout_dollars != null)
            ? `+$${b.payout_dollars.toFixed(2)}`
            : `(dividend pending)`;
          resultEl = `<span class="bet-result hit">HIT · ${payoutTxt}</span>`;
        } else {
          resultEl = `<span class="bet-result miss">Miss</span>`;
        }
      } else {
        resultEl = `<span class="bet-result pending">Pending</span>`;
      }
      let meta;
      if (b.settled) {
        if (b.is_hit) {
          const divTxt = (b.trifecta_dividend != null) ? `div $${b.trifecta_dividend.toFixed(2)}` : `dividend not yet available`;
          meta = `${b.num_permutations} perms · stake $${(b.stake_dollars||0).toFixed(2)} · ${divTxt}`;
        } else {
          meta = `${b.num_permutations} perms · stake $${(b.stake_dollars||0).toFixed(2)} · top-3 outside box`;
        }
      } else {
        meta = `${b.num_permutations} perms · stake $${(b.stake_dollars||0).toFixed(2)}`;
      }
      return `
        <div class="bet-row ${cls}">
          <div class="bet-row-top">

  async function fetchBetDetail(raceId) {
    if (state.detail[raceId] !== undefined) return;
    try {
      const r = await fetch(`${API}/api/bets/${encodeURIComponent(raceId)}?strategy=${encodeURIComponent(state.strategy)}`);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      state.detail[raceId] = data.bets || [];
    } catch (e) {
      console.error('[bets] detail fetch failed:', e);
      state.detail[raceId] = [];
    }
    if (state.lastData) render(state.lastData);
  }

  function _jumpMs(r) {
    if (!r.scheduled_time) return null;
    const t = new Date(r.scheduled_time).getTime();
    return isNaN(t) ? null : t;
  }

  function _aestDateKey(r) {
    // Return the race-day key in Australia/Sydney (YYYY-MM-DD). Prefer
    // scheduled_time if present; fall back to the stored date column.
    if (r.scheduled_time) {
      const d = new Date(r.scheduled_time);
      if (!isNaN(d.getTime())) {
        const parts = d.toLocaleDateString('en-AU', {
          timeZone: 'Australia/Sydney', year: 'numeric', month: '2-digit', day: '2-digit',
        }).split('/');
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }
    }
    return r.date || '';
  }

  function _todayAestKey() {
    const parts = new Date().toLocaleDateString('en-AU', {
      timeZone: 'Australia/Sydney', year: 'numeric', month: '2-digit', day: '2-digit',
    }).split('/');
    return `${parts[2]}-${parts[1]}-${parts[0]}`;
  }

  function _dayLabel(dateKey) {
    if (!dateKey) return 'Other';
    const today = _todayAestKey();
    if (dateKey === today) return 'Today';
    // Compute tomorrow in AEST
    const [y, m, d] = today.split('-').map(Number);
    const t = new Date(Date.UTC(y, m - 1, d) + 24 * 60 * 60 * 1000);
    const tomorrow = `${t.getUTCFullYear()}-${String(t.getUTCMonth()+1).padStart(2,'0')}-${String(t.getUTCDate()).padStart(2,'0')}`;
    if (dateKey === tomorrow) return 'Tomorrow';
    // Past or further future → use weekday + day
    const parsed = new Date(`${dateKey}T12:00:00+10:00`);
    if (isNaN(parsed.getTime())) return dateKey;
    return parsed.toLocaleDateString('en-AU', {
      timeZone: 'Australia/Sydney', weekday: 'short', day: 'numeric', month: 'short',
    });
  }

  // Races still 'Running' (jumped but within ~8 min) should stay at the
  // very top of Next-race — they're the live ones the user cares about.
  // Mirrors the 480s Running window in formatCountdown.
  const RUNNING_WINDOW_MS = 8 * 60 * 1000;

  function applySort(races) {
    const now = Date.now();
    if (state.sort === 'next') {
      // Parse scheduled_time as a Date (includes TZ offset) so upcoming
      // vs past compares on the real instant. Running races (jumped, but
      // still inside the Running window) lead, then truly upcoming
      // sorted by soonest jump, then finished sorted most-recent-first.
      const running = races.filter(r => {
        const t = _jumpMs(r);
        return t != null && t <= now && t > now - RUNNING_WINDOW_MS;
      });
      const upcoming = races.filter(r => {
        const t = _jumpMs(r);
        return t != null && t > now;
      });
      const past = races.filter(r => {
        const t = _jumpMs(r);
        return t == null || t <= now - RUNNING_WINDOW_MS;
      });
      running.sort((a, b) => (_jumpMs(b) || 0) - (_jumpMs(a) || 0));
      upcoming.sort((a, b) => (_jumpMs(a) || 0) - (_jumpMs(b) || 0));
      past.sort((a, b) => (_jumpMs(b) || 0) - (_jumpMs(a) || 0));
      return [...running, ...upcoming, ...past];
    }
    if (state.sort === 'recent') {
      // 'Just ran' — past races first (most recently finished at top),
      // then upcoming races below sorted by soonest jump.
      const now = Date.now();
      const past = races.filter(r => { const t = _jumpMs(r); return t == null || t <= now; });
      const upcoming = races.filter(r => { const t = _jumpMs(r); return t != null && t > now; });
      past.sort((a, b) => (_jumpMs(b) || 0) - (_jumpMs(a) || 0));
      upcoming.sort((a, b) => (_jumpMs(a) || 0) - (_jumpMs(b) || 0));
      return [...past, ...upcoming];
    }
    if (state.sort === 'pnl') {
      return [...races].sort((a, b) => {
        // pending races last, then by pnl desc
        const ap = a.pnl == null ? 1 : 0;
        const bp = b.pnl == null ? 1 : 0;
        if (ap !== bp) return ap - bp;
        return (b.pnl || 0) - (a.pnl || 0);
      });
    }
    return races;
  }

  function render(data) {
    state.lastData = data;
    const races = applySort(data.races || []);
    const summary = document.getElementById('summary');
    const settled = races.filter(r => r.status === 'settled');
    const resulted = races.filter(r => r.status === 'settled' || r.status === 'settled_no_dividend');
    const totalStakeAll = races.reduce((a, r) => a + (r.total_stake || 0), 0);
    const totalPnl = settled.reduce((a, r) => a + (r.pnl || 0), 0);
    const racesWithHit = resulted.filter(r => (r.hits || 0) > 0).length;
    const hitPct = resulted.length ? Math.round(racesWithHit / resulted.length * 100) : 0;
    const pendingCount = races.length - resulted.length;
    const anyEstimated = settled.some(r => r.dividend_estimated);

    // Per-strategy daily hit %: today's AEST resulted races only.
    // Resets at AEST midnight by virtue of the date filter.
    const todayKey = _todayAestKey();
    const todayResulted = resulted.filter(r => _aestDateKey(r) === todayKey);
    const stratStats = STRATEGY_DISPLAY.filter(s => !s.legacy).map(s => {
      const racesWithGroup = todayResulted.filter(r => {
        const groupBets = (r.bets_by_strategy || {})[s.key];
        return groupBets && groupBets.length > 0;
      });
      const groupHits = racesWithGroup.filter(r =>
        r.bets_by_strategy[s.key].some(b => b.is_hit)
      ).length;
      const pct = racesWithGroup.length
        ? Math.round(groupHits / racesWithGroup.length * 100)
        : null;
      return { key: s.key, label: s.label, hits: groupHits, total: racesWithGroup.length, pct };
    });

    summary.innerHTML = `
      <div class="summary-card">
        <div class="summary-num">${resulted.length}/${races.length}</div>
        <div class="summary-label">Races${pendingCount > 0 ? ` (${pendingCount} pending)` : ''}</div>
      </div>
      <div class="summary-card">
        <div class="summary-num ${totalPnl >= 0 ? 'pos' : 'neg'}">${fmtPnl(totalPnl) || '—'}</div>
        <div class="summary-label">${anyEstimated ? 'P/L (est.)' : 'Settled P/L'}</div>
      </div>
      <div class="summary-card">
        <div class="summary-num">${racesWithHit}/${resulted.length}</div>
        <div class="summary-label">Races hit (${hitPct}%)</div>
      </div>`;

    // Render per-strategy daily strip just below the summary.
    let stripEl = document.getElementById('strategy-stats');
    if (!stripEl) {
      stripEl = document.createElement('div');
      stripEl.id = 'strategy-stats';
      stripEl.className = 'strategy-stats';
      summary.parentNode.insertBefore(stripEl, summary.nextSibling);
    }
    stripEl.innerHTML = stratStats.map(s => `
      <div class="strategy-stat">
        <div class="strategy-stat-name">${s.label}</div>
        <div class="strategy-stat-num">${s.pct === null ? '—' : s.pct + '%'}</div>
        <div class="strategy-stat-frac">${s.hits}/${s.total} today</div>
      </div>`).join('');

    const main = document.getElementById('races');
    if (!races.length) {
      main.innerHTML = `
        <div class="empty">
          <div style="font-size:28px;margin-bottom:8px">📭</div>
          <div>No paper-trading bets yet — they generate hourly during racing hours.</div>
        </div>`;
      return;
    }
    // Group runs by AEST date so we can insert section dividers as the
    // date changes from one card to the next. The sort already groups
    // same-date races contiguously (within upcoming/past blocks).
    const dayCounts = {};
    races.forEach(r => {
      const k = _aestDateKey(r);
      dayCounts[k] = (dayCounts[k] || 0) + 1;
    });
    let lastDateKey = null;
    main.innerHTML = races.map(r => {
      const dateKey = _aestDateKey(r);
      let divider = '';
      if (dateKey !== lastDateKey) {
        const label = _dayLabel(dateKey);
        const isStrong = label === 'Today' || label === 'Tomorrow';
        divider = `
          <div class="day-divider">
            <span class="${isStrong ? 'label-strong' : ''}">${escHtml(label)}</span>
            <hr/>
            <span class="count">${dayCounts[dateKey]} race${dayCounts[dateKey] === 1 ? '' : 's'}</span>
          </div>`;
        lastDateKey = dateKey;
      }
      const pending = r.status === 'pending';
      const noDiv = r.status === 'settled_no_dividend';
      const pnl = r.pnl;
      const hits = r.hits || 0;
      // Card class drives the outline colour: green border if any bet hit
      // (whether or not we have a dividend), red/dimmed if all missed.
      const cls = pending ? 'pending' : (hits > 0 ? 'settled-hit' : 'settled-miss');
      let pnlEl;
      if (pending) {
        pnlEl = `<div class="race-pnl pending">Pending</div>`;
      } else if (noDiv) {
        // No dividend yet — show binary Correct / Missed instead of a
        // misleading P&L number. Hit count visible inside the expanded
        // bet detail.
        const label = hits > 0 ? `✓ Correct (${hits})` : '✗ Missed';
        const labelCls = hits > 0 ? 'pos' : 'neg';
        pnlEl = `<div class="race-pnl ${labelCls}" style="font-size:14px;font-weight:700">${label}</div>`;
      } else {
        pnlEl = `<div class="race-pnl ${pnl >= 0 ? 'pos' : 'neg'}">${fmtPnl(pnl)}</div>`;
      }
      const venue = (r.venue || '').replace(/-/g,' ').toUpperCase();
      const jt = formatJumpTime(r.scheduled_time);
      const cd = formatCountdown(r.scheduled_time);
      const timeRow = jt
        ? `<div class="race-time"><span class="jump-time">🕐 ${jt}</span><span class="countdown ${cd ? cd.cls : ''}">${cd ? cd.text : ''}</span></div>`
        : '';
      const top3 = Array.isArray(r.top3) ? r.top3 : null;
      const winningStrip = top3 && top3.length === 3
        ? `<div class="winning-strip">
             <span class="trophy">🏆</span>
             <span class="label">Result</span>
             ${top3.map((leg, i) => `
               <span class="leg">
                 <span class="pos">${leg.position === 1 ? '1st' : leg.position === 2 ? '2nd' : '3rd'}</span>
                 <span class="tab">${leg.tab_number ?? '—'}</span>
                 <span class="name">${escHtml(leg.horse_name || '')}</span>
               </span>${i < 2 ? '<span class="sep">·</span>' : ''}`).join('')}
           </div>`
        : '';
      return `${divider}
        <div class="race ${cls}">
          <div class="race-top">
            <div>
              <div class="race-id">${escHtml(venue)} R${r.race_number}</div>
              <div class="race-meta">${escHtml(r.date || '')} · ${r.num_bets} bets · stake $${r.total_stake.toFixed(2)}</div>
              ${timeRow}
            </div>
            ${pnlEl}
          </div>
          <div class="race-stats">
            <div class="race-stat">
              <span class="race-stat-num">${r.num_bets}</span>
              <span class="race-stat-label">Bets</span>
            </div>
            <div class="race-stat">
              <span class="race-stat-num">${r.hits || 0}</span>
              <span class="race-stat-label">Hits</span>
            </div>
            <div class="race-stat">
              <span class="race-stat-num">$${r.total_stake.toFixed(2)}</span>
              <span class="race-stat-label">Stake</span>
            </div>
            <div class="race-stat">
              <span class="race-stat-num">${r.total_payout != null ? '$' + r.total_payout.toFixed(2) : '—'}</span>
              <span class="race-stat-label">Payout</span>
            </div>
          </div>
          ${winningStrip}
          ${(noDiv && isAdmin) ? `
            <div class="dividend-row" data-divrow="${escHtml(r.race_id)}">
              <span class="label">Trifecta $</span>
              <input type="number" step="0.01" min="0.01" placeholder="e.g. 234.50"
                     data-divinput="${escHtml(r.race_id)}" />
              <button data-divsave="${escHtml(r.race_id)}">Save</button>
            </div>` : ''}
          ${(() => {
            const bbs = r.bets_by_strategy || {};
            return STRATEGY_DISPLAY
              .filter(s => bbs[s.key] && bbs[s.key].length)
              .map(s => renderStrategyBlock(r.race_id, s.key, bbs[s.key], r.status))
              .join('');
          })()}
        </div>`;
    }).join('');
  }

  async function load() {
    try {
      const r = await fetch(`${API}/api/bets?days=14&include_bets=true`);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      render(data);
    } catch (e) {
      document.getElementById('races').innerHTML = `
        <div class="empty">Could not load ledger: ${escHtml(e.message)}</div>`;
    }
  }

  function renderStrategyRow() {
    const row = document.getElementById('strategyRow');
    if (!row) return;
    const CANONICAL = [
      { strategy: 'trio',   label: 'The Trio',   tagline: '1 box · best ROI' },
      { strategy: 'stack',  label: 'The Stack',  tagline: '5 × 3-horse · most $' },
      { strategy: 'quad',   label: 'The Quad',   tagline: '1 box · wider' },
      { strategy: 'spread', label: 'The Spread', tagline: '5 mixed boxes' },
    ];
    const byKey = {};
    for (const s of (state.strategyStats || [])) byKey[s.strategy] = s;
    const groups = CANONICAL.map(c => ({ ...c, ...(byKey[c.strategy] || {}) }));
    row.innerHTML = groups.map(g => {
      const isActive = state.strategy === g.strategy;
      const isDefault = g.strategy === 'trio';  // recommended by 270d backtest
      const races = g.races_bet ?? 0;
      const hitRate = (g.race_hit_rate_pct != null) ? g.race_hit_rate_pct.toFixed(0) + '%' : '—';
      const roi = (g.roi_pct != null)
        ? `<span class="stat ${g.roi_pct >= 0 ? 'pos' : 'neg'}">${g.roi_pct >= 0 ? '+' : ''}${g.roi_pct.toFixed(1)}%</span>`
        : `<span class="stat" style="color:var(--text-muted)">—</span>`;
      const tagline = g.tagline || '';
      const subline = (g.races_bet != null && g.races_bet > 0)
        ? `${tagline}${tagline ? ' · ' : ''}${races} races · hit ${hitRate} · ROI ${roi}`
        : (tagline || g.meta || '');
      const badge = isDefault
        ? `<span style="display:inline-block;font-size:9px;padding:1px 5px;background:var(--teal);color:var(--bg-base);border-radius:4px;margin-left:6px;font-weight:700;letter-spacing:0.3px">★ DEFAULT</span>`
        : '';
      return `
        <div class="strategy-pill ${isActive ? 'active' : ''}" data-strategy="${g.strategy}">
          <span class="name">${escHtml(g.label || g.strategy)}${badge}</span>
          <span class="meta">${subline}</span>
        </div>`;
    }).join('');
  }

      const r = await fetch(`${API}/api/bet-insights/strategy-stats?days=14`);
      if (!r.ok) throw new Error('HTTP ' + r.status);

  async function loadHeroPick() {
    const target = document.getElementById('heroPick');
    if (!target) return;
    try {
      const r = await fetch(`${API}/api/bet-insights/today?limit=1`);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      const cand = (d.tomorrow_candidates && d.tomorrow_candidates[0]) || null;
      if (!cand) {
        target.innerHTML = `
          <div class="hero-pick empty">
            <div class="hero-label">Today's Best Pick</div>
            <div style="font-size:12px;color:var(--text-muted)">No qualifying upcoming races right now. Algorithm filters: field 7-13, rank-1 win outside 25-30%.</div>
          </div>`;
        return;
      }
      const venue = (cand.venue || '').replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      const jump = cand.scheduled_time ? cand.scheduled_time.substring(11, 16) : '—';
      target.innerHTML = `
        <div class="hero-pick">
          <div class="hero-label">🎯 Today's Best Pick · predicted ${cand.predicted_hit_rate_pct.toFixed(0)}% hit</div>
          <div>
            <span class="hero-race">${escHtml(venue)} R${cand.race_number}</span>
            <span class="hero-jump">🕐 ${jump}</span>
          </div>
          <div class="hero-row">
            <span class="hero-stat">Field <strong>${cand.field_size}</strong></span>
            <span class="hero-stat">Rank-1 <strong>${cand.rank1_win_pct.toFixed(1)}%</strong></span>
            <span class="hero-stat">Top-3 Σ <strong>${cand.top3_sum_pct.toFixed(1)}%</strong></span>
            <span class="hero-stat hero-hit">Pred. hit ${cand.predicted_hit_rate_pct.toFixed(1)}%</span>
          </div>
        </div>`;
    } catch (e) {
      console.error('[heroPick]', e);
      target.innerHTML = '';
    }
  }

  // Sort pills
  document.querySelectorAll('.sort-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sort-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.sort = btn.dataset.sort;
      if (state.lastData) render(state.lastData);
    });
  });

  // Delegated click handler — handles both the expand toggle and the
  // inline dividend save button. Cards re-render on refresh so all
  // listeners must be delegated from a stable parent.
  document.getElementById('races').addEventListener('click', async (e) => {
    // Strategy block collapse toggle (whole block is clickable except
    // dividend input which has its own button).
    const stratBlock = e.target.closest('[data-strat-toggle]');
    if (stratBlock && !e.target.closest('button, input')) {
      const key = stratBlock.dataset.stratToggle;
      if (state.collapsedFlip.has(key)) state.collapsedFlip.delete(key);
      else state.collapsedFlip.add(key);
      if (state.lastData) render(state.lastData);
      return;
    }

    // Dividend save
    const saveBtn = e.target.closest('button[data-divsave]');
    if (saveBtn) {
      const raceId = saveBtn.dataset.divsave;
      const input = document.querySelector(`input[data-divinput="${CSS.escape(raceId)}"]`);
      if (!input) return;
      const val = parseFloat(input.value);
      if (!val || val <= 0) {
        input.style.borderColor = 'var(--red)';
        input.focus();
        return;
      }
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      try {
        const r = await fetch(`${API}/api/admin/bets/dividend/${encodeURIComponent(raceId)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Cron-Secret': adminSecret },
          body: JSON.stringify({ trifecta: val }),
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        // Invalidate the per-race bet-detail cache so the expanded view
        // re-fetches with the new payout numbers.
        delete state.detail[raceId];
        await load();
      } catch (err) {
        saveBtn.disabled = false; saveBtn.textContent = 'Save';
        input.style.borderColor = 'var(--red)';
        input.title = err.message;
      }
      return;
    }

    // Expand/collapse
    const t = e.target.closest('.bet-toggle');
    if (!t) return;
    const raceId = t.dataset.race;
    if (state.expanded.has(raceId)) {
      state.expanded.delete(raceId);
    } else {
      state.expanded.add(raceId);
      if (state.detail[raceId] === undefined) {
        fetchBetDetail(raceId);
      }
    }
    if (state.lastData) render(state.lastData);
  });

  // Re-render every second so countdowns tick — uses cached data, no API call
  setInterval(() => {
    if (state.lastData) render(state.lastData);
  }, 1000);

  // Refresh every 60s + jitter
  setInterval(load, 60000 + Math.random() * 15000);
  // Hero pick refreshes a bit faster — the upcoming-only filter naturally
  // promotes the next race as races jump throughout the day.
  setInterval(loadHeroPick, 90000 + Math.random() * 20000);
  // Strategy stats refresh every 5 min — they're cumulative; no need to
  // chase intraday changes.
  load();
  loadHeroPick();
</script>
</body>
</html>
