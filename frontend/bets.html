<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>body{visibility:hidden}</style>
  <script>
    fetch('/api/check', {credentials:'include'})
      .then(function(r){
        if(r.ok){ document.body.style.visibility='visible'; }
        else{ window.location.replace('/login?next='+encodeURIComponent(location.pathname)); }
      })
      .catch(function(){ document.body.style.visibility='visible'; });
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <title>📊 Bet Ledger — Paper Trading | FunkyIQ</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base:      #07090f;
      --bg-card:      #0e1220;
      --bg-elevated:  #1a2035;
      --border:       #1e2840;
      --green:        #22c55e;
      --green-bright: #4ade80;
      --red:          #f87171;
      --gold:         #e8a020;
      --teal:         #2dd4bf;
      --teal-bright:  #5eead4;
      --text:         #e6e9f0;
      --text-dim:     #8a93a8;
      --text-muted:   #5c6478;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px 12px 60px;
      background: var(--bg-base);
      color: var(--text);
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }
    header { margin-bottom: 14px; }
    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 0.5px;
      margin: 0;
      line-height: 1;
    }
    .subtitle {
      color: var(--text-dim);
      font-size: 12px;
      margin-top: 4px;
    }
    .nav-back {
      display: inline-block;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-dim);
      text-decoration: none;
    }

    /* Sort selector */
    .sort-row {
      display: flex;
      gap: 6px;
      margin: 10px 0;
      align-items: center;
      flex-wrap: wrap;
    }
    .sort-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .sort-pill {
      padding: 5px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .sort-pill.active {
      background: rgba(45,212,191,0.12);
      border-color: var(--teal);
      color: var(--teal-bright);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
    }
    .summary-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
    }
    .summary-num.pos { color: var(--green-bright); }
    .summary-num.neg { color: var(--red); }
    .summary-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .race {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .race.settled-hit { border-color: rgba(74,222,128,0.4); }
    .race.settled-miss { opacity: 0.85; }
    .race.pending { border-color: rgba(45,212,191,0.4); }
    .race-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
    }
    .race-id {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.3px;
    }
    .race-pnl {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 20px;
      font-variant-numeric: tabular-nums;
    }
    .race-pnl.pos { color: var(--green-bright); }
    .race-pnl.neg { color: var(--red); }
    .race-pnl.pending { color: var(--teal-bright); font-size: 13px; font-weight: 600; }
    .race-meta {
      font-size: 11px;
      color: var(--text-dim);
    }
    .race-time {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
      font-size: 12px;
    }
    .jump-time {
      color: var(--text);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .countdown {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--text-dim);
    }
    .countdown.soon { color: var(--gold); }
    .countdown.now { color: var(--red); animation: pulse 1.5s ease-in-out infinite; }
    .countdown.done { color: var(--text-muted); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }
    .race-stats {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
      font-size: 11px;
    }
    .race-stat {
      text-align: center;
      padding: 4px;
      background: var(--bg-elevated);
      border-radius: 6px;
    }
    .race-stat-num {
      font-weight: 700;
      color: var(--text);
      display: block;
      font-variant-numeric: tabular-nums;
    }
    .race-stat-label {
      color: var(--text-muted);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* Bet detail expansion */
    .bet-toggle {
      margin-top: 10px;
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      padding: 6px 0;
      border-top: 1px dashed var(--border);
    }
    .bet-toggle:active { color: var(--text); }
    .bet-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bet-row {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
    }
    .bet-row.hit {
      border-color: rgba(74,222,128,0.45);
      background: rgba(74,222,128,0.06);
    }
    .bet-row-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }
    .bet-strategy {
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-size: 10px;
    }
    .bet-result {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .bet-result.hit { color: var(--green-bright); }
    .bet-result.miss { color: var(--text-muted); }
    .bet-result.pending { color: var(--teal-bright); }
    .bet-horses {
      color: var(--text);
      line-height: 1.5;
    }
    .bet-horses .tab {
      display: inline-block;
      min-width: 18px;
      padding: 1px 5px;
      margin-right: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-weight: 700;
      text-align: center;
      font-size: 10px;
    }
    .bet-horses .name {
      color: var(--text-dim);
      margin-right: 8px;
    }
    .bet-meta {
      color: var(--text-muted);
      font-size: 10px;
      margin-top: 4px;
    }
    .bet-loading { color: var(--text-muted); padding: 8px 0; font-size: 11px; text-align: center; }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .loading { text-align: center; padding: 40px; color: var(--text-dim); }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <div>
        <h1 class="title">📊 Bet Ledger</h1>
        <div class="subtitle">Paper-trading · $2 flexi-box trifectas · 5 bets per qualifying race</div>
      </div>
      <a href="/hotseat" class="nav-back">🔥 Hot Seat →</a>
    </div>
    <div id="summary" class="summary"></div>
    <div class="sort-row">
      <span class="sort-label">Sort</span>
      <button class="sort-pill active" data-sort="next">Next race</button>
      <button class="sort-pill" data-sort="recent">Most recent</button>
      <button class="sort-pill" data-sort="pnl">Best P/L</button>
    </div>
  </header>
  <main id="races">
    <div class="loading">Loading ledger…</div>
  </main>

<script>
  const API = 'https://web-production-dec62.up.railway.app';
  const STRATEGY_LABELS = {
    core_top3: 'Top 3 box',
    core_top4: 'Top 4 box',
    value_runner1: 'Top 2 + value #1',
    value_runner2: 'Top 2 + value #2',
    no_favourite_hedge: 'No-favourite hedge',
  };

  // race_id -> bool (expanded?); race_id -> array of bet rows (cached fetch)
  const state = { expanded: new Set(), detail: {}, lastData: null, sort: 'next' };

  function fmtPnl(v) {
    if (v == null) return null;
    const s = v >= 0 ? '+' : '−';
    return s + '$' + Math.abs(v).toFixed(2);
  }

  function formatJumpTime(iso) {
    if (!iso) return null;
    const d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    return d.toLocaleTimeString('en-AU', {
      hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Australia/Sydney',
    });
  }

  function formatCountdown(iso) {
    if (!iso) return null;
    const t = new Date(iso).getTime();
    if (isNaN(t)) return null;
    const diff = Math.floor((t - Date.now()) / 1000);
    if (diff <= -480) return { text: 'Done', cls: 'done' };
    if (diff <= -60) return { text: 'Running', cls: 'now' };
    if (diff <= 0) return { text: 'NOW', cls: 'now' };
    const mins = Math.floor(diff / 60);
    if (mins < 60) return { text: `in ${mins}m`, cls: mins < 5 ? 'soon' : '' };
    const hrs = Math.floor(mins / 60);
    const rem = mins % 60;
    return { text: `in ${hrs}h ${rem.toString().padStart(2,'0')}m`, cls: '' };
  }

  function escHtml(s) {
    return (s == null ? '' : String(s))
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderBetDetail(raceId) {
    const bets = state.detail[raceId];
    if (bets === undefined) return `<div class="bet-loading">Loading bets…</div>`;
    if (!bets || !bets.length) return `<div class="bet-loading">No bets recorded.</div>`;
    return `<div class="bet-list">${bets.map(b => {
      const label = STRATEGY_LABELS[b.strategy_label] || b.strategy_label;
      const horses = (b.box_horses || []).map((tab, i) => {
        const name = (b.box_horse_names || [])[i] || '';
        return `<span><span class="tab">${tab}</span><span class="name">${escHtml(name)}</span></span>`;
      }).join('');
      let resultEl, cls = '';
      if (b.settled) {
        if (b.is_hit) {
          cls = 'hit';
          resultEl = `<span class="bet-result hit">HIT · +$${(b.payout_dollars || 0).toFixed(2)}</span>`;
        } else {
          resultEl = `<span class="bet-result miss">Miss</span>`;
        }
      } else {
        resultEl = `<span class="bet-result pending">Pending</span>`;
      }
      const meta = b.settled
        ? `${b.num_permutations} perms · stake $${(b.stake_dollars||0).toFixed(2)} · ${b.is_hit ? `div $${(b.trifecta_dividend||0).toFixed(2)}` : 'no dividend hit'}`
        : `${b.num_permutations} perms · stake $${(b.stake_dollars||0).toFixed(2)}`;
      return `
        <div class="bet-row ${cls}">
          <div class="bet-row-top">
            <span class="bet-strategy">${escHtml(label)}</span>
            ${resultEl}
          </div>
          <div class="bet-horses">${horses}</div>
          <div class="bet-meta">${escHtml(meta)}</div>
        </div>`;
    }).join('')}</div>`;
  }

  async function fetchBetDetail(raceId) {
    if (state.detail[raceId] !== undefined) return;
    try {
      const r = await fetch(`${API}/api/bets/${encodeURIComponent(raceId)}`);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      state.detail[raceId] = data.bets || [];
    } catch (e) {
      console.error('[bets] detail fetch failed:', e);
      state.detail[raceId] = [];
    }
    if (state.lastData) render(state.lastData);
  }

  function _jumpMs(r) {
    if (!r.scheduled_time) return null;
    const t = new Date(r.scheduled_time).getTime();
    return isNaN(t) ? null : t;
  }

  function applySort(races) {
    const now = Date.now();
    if (state.sort === 'next') {
      // Parse scheduled_time as a Date (it includes the TZ offset) so
      // upcoming/past is compared on the real instant in time, not on
      // lexical strings — '12:30+10:00' is not lexically before now-UTC.
      const upcoming = races.filter(r => { const t = _jumpMs(r); return t != null && t > now; });
      const past = races.filter(r => { const t = _jumpMs(r); return t == null || t <= now; });
      upcoming.sort((a, b) => (_jumpMs(a) || 0) - (_jumpMs(b) || 0));
      past.sort((a, b) => (_jumpMs(b) || 0) - (_jumpMs(a) || 0));
      return [...upcoming, ...past];
    }
    if (state.sort === 'recent') {
      return [...races].sort((a, b) => (_jumpMs(b) || 0) - (_jumpMs(a) || 0));
    }
    if (state.sort === 'pnl') {
      return [...races].sort((a, b) => {
        // pending races last, then by pnl desc
        const ap = a.pnl == null ? 1 : 0;
        const bp = b.pnl == null ? 1 : 0;
        if (ap !== bp) return ap - bp;
        return (b.pnl || 0) - (a.pnl || 0);
      });
    }
    return races;
  }

  function render(data) {
    state.lastData = data;
    const races = applySort(data.races || []);
    const summary = document.getElementById('summary');
    const settled = races.filter(r => r.status === 'settled');
    const totalStakeAll = races.reduce((a, r) => a + (r.total_stake || 0), 0);
    const totalPnl = settled.reduce((a, r) => a + (r.pnl || 0), 0);
    const totalHits = races.reduce((a, r) => a + (r.hits || 0), 0);
    summary.innerHTML = `
      <div class="summary-card">
        <div class="summary-num">${races.length}</div>
        <div class="summary-label">Races</div>
      </div>
      <div class="summary-card">
        <div class="summary-num ${totalPnl >= 0 ? 'pos' : 'neg'}">${fmtPnl(totalPnl) || '—'}</div>
        <div class="summary-label">Settled P/L</div>
      </div>
      <div class="summary-card">
        <div class="summary-num">${totalHits}</div>
        <div class="summary-label">Trifecta hits</div>
      </div>`;

    const main = document.getElementById('races');
    if (!races.length) {
      main.innerHTML = `
        <div class="empty">
          <div style="font-size:28px;margin-bottom:8px">📭</div>
          <div>No paper-trading bets yet — they generate hourly during racing hours.</div>
        </div>`;
      return;
    }
    main.innerHTML = races.map(r => {
      const pending = r.status === 'pending';
      const pnl = r.pnl;
      const cls = pending ? 'pending' : (pnl >= 0 ? 'settled-hit' : 'settled-miss');
      const pnlEl = pending
        ? `<div class="race-pnl pending">Pending</div>`
        : `<div class="race-pnl ${pnl >= 0 ? 'pos' : 'neg'}">${fmtPnl(pnl)}</div>`;
      const venue = (r.venue || '').replace(/-/g,' ').toUpperCase();
      const jt = formatJumpTime(r.scheduled_time);
      const cd = formatCountdown(r.scheduled_time);
      const timeRow = jt
        ? `<div class="race-time"><span class="jump-time">🕐 ${jt}</span><span class="countdown ${cd ? cd.cls : ''}">${cd ? cd.text : ''}</span></div>`
        : '';
      return `
        <div class="race ${cls}">
          <div class="race-top">
            <div>
              <div class="race-id">${escHtml(venue)} R${r.race_number}</div>
              <div class="race-meta">${escHtml(r.date || '')} · ${r.num_bets} bets · stake $${r.total_stake.toFixed(2)}</div>
              ${timeRow}
            </div>
            ${pnlEl}
          </div>
          <div class="race-stats">
            <div class="race-stat">
              <span class="race-stat-num">${r.num_bets}</span>
              <span class="race-stat-label">Bets</span>
            </div>
            <div class="race-stat">
              <span class="race-stat-num">${r.hits || 0}</span>
              <span class="race-stat-label">Hits</span>
            </div>
            <div class="race-stat">
              <span class="race-stat-num">$${r.total_stake.toFixed(2)}</span>
              <span class="race-stat-label">Stake</span>
            </div>
            <div class="race-stat">
              <span class="race-stat-num">${r.total_payout != null ? '$' + r.total_payout.toFixed(2) : '—'}</span>
              <span class="race-stat-label">Payout</span>
            </div>
          </div>
          ${state.expanded.has(r.race_id)
            ? `<div class="bet-toggle" data-race="${escHtml(r.race_id)}">Hide bets ▴</div>${renderBetDetail(r.race_id)}`
            : `<div class="bet-toggle" data-race="${escHtml(r.race_id)}">Show ${r.num_bets} bets ▾</div>`}
        </div>`;
    }).join('');
  }

  async function load() {
    try {
      const r = await fetch(`${API}/api/bets?days=14`);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      render(data);
    } catch (e) {
      document.getElementById('races').innerHTML = `
        <div class="empty">Could not load ledger: ${escHtml(e.message)}</div>`;
    }
  }

  // Sort pills
  document.querySelectorAll('.sort-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sort-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.sort = btn.dataset.sort;
      if (state.lastData) render(state.lastData);
    });
  });

  // Delegated click for the expand toggle — cards re-render on refresh.
  document.getElementById('races').addEventListener('click', (e) => {
    const t = e.target.closest('.bet-toggle');
    if (!t) return;
    const raceId = t.dataset.race;
    if (state.expanded.has(raceId)) {
      state.expanded.delete(raceId);
    } else {
      state.expanded.add(raceId);
      if (state.detail[raceId] === undefined) {
        fetchBetDetail(raceId);
      }
    }
    if (state.lastData) render(state.lastData);
  });

  // Re-render every second so countdowns tick — uses cached data, no API call
  setInterval(() => {
    if (state.lastData) render(state.lastData);
  }, 1000);

  // Refresh every 60s + jitter
  setInterval(load, 60000 + Math.random() * 15000);
  load();
</script>
</body>
</html>
