[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "horse-prediction-engine"
version         = "1.0.0"
description     = "FunkyIQ horse racing prediction engine"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "aiofiles>=23.2",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "diskcache>=5.6",
    "rich>=13.7",
    "typer>=0.12",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "anthropic>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
horse-engine = "horse_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["horse_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.ruff]
line-length    = 100
target-version = "py311"
